<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mahdi Repair – Receiving notes</title>
<link rel="stylesheet" href="common.css?v=24"><style>#tabs{display:none!important}

#pa .a4{font:12px/1.4 Arial,sans-serif;color:#000}#pa .a4 table{width:100%;border-collapse:collapse;margin:10px 0}#pa .a4 th,#pa .a4 td{border:1px solid #000;padding:5px 7px;text-align:start}#pa .a4 td.n,#pa .a4 th.n{text-align:end}#pa .a4 .h{display:flex;justify-content:space-between;gap:20px}#pa .a4 .sg{display:flex;justify-content:space-between;margin-top:50px}

.cl2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hdr{grid-template-columns:200px minmax(0,1.3fr) minmax(0,1fr)}
</style></head><body><main>

<!-- ================= JOURNAL ================= -->
<div class="vw" id="vL">
 <div class="tb"><span class="nv"><button id="n1" title="First">⏮</button><button id="n2" title="Previous">◀</button><button id="n3" title="Next">▶</button><button id="n4" title="Last">⏭</button></span>
  <button class="p" id="bNew">＋ New <kbd>F1</kbd></button><button id="bOpen">✎ Open / Edit <kbd>F2</kbd></button><button id="bDel" class="d">🗑 Delete <kbd>Del</kbd></button><button id="bPrint">🖨 Print <kbd>F5</kbd></button><button id="bCsv">⬇ Excel (CSV)</button>
  <span class="sp"></span><label>Period <select id="pe"><option value="today">Today</option><option value="yest">Yesterday</option><option value="week">Last 7 days</option><option value="month">This month</option><option value="all">All</option><option value="custom">Custom</option></select></label>
  <label>From <input type="date" id="df"></label><label>To <input type="date" id="dt2"></label></div>
 <div class="tb"><input id="lq" placeholder="🔍 Search no., invoice, supplier, product…" style="flex:1;min-width:200px"><label><input type="checkbox" id="kd"> Discount only</label><label><input type="checkbox" id="ku"> Unpaid only</label><button id="bRef">↻ Refresh</button></div>
 <div class="lm"><div class="lc"><div class="tw" id="mt"></div><div class="tw" id="dw"></div></div>
  <aside class="fp"><div><label>User</label><select id="fu"></select></div><div><label>Supplier</label><select id="fc"></select></div><div><label>Payment mode</label><select id="fm"></select></div>
   <div class="tt"><div><label>Total TTC</label><input id="t1" readonly></div><div><label>Discount</label><input id="t2" readonly></div><div><label>To pay</label><input id="t3" readonly></div><div><label>Paid</label><input id="t4" readonly></div><div><label>Unpaid (owed)</label><input id="t5" readonly></div></div></aside></div>
 <div class="sbar" id="sb1"></div>
</div>

<!-- ================= EDITOR ================= -->
<div class="vw" id="vE" hidden>
 <div class="tb"><button class="p" id="eNew">＋ New <kbd>F1</kbd></button><button id="eEdit">✎ Modify <kbd>F2</kbd></button><button class="p" id="eSave">✔ Validate <kbd>F3</kbd></button><button id="ePrint">🖨 Print <kbd>F5</kbd></button><button id="eHold">⏸ Hold <kbd>F9</kbd></button><button id="eHeld">Held (0)</button><button id="eNP">📦 New product <kbd>Ctrl+N</kbd></button>
  <label><input type="checkbox" id="pp"> Print after</label><span class="sp"></span><button id="eQuit">✕ Quit <kbd>Esc</kbd></button></div>
 <div class="hdr"><div class="c1"><div><label>Receiving note N°</label><input id="no" readonly></div><div><label>Date</label><input type="date" id="dd" class="lk"></div><div><label>Payment mode</label><select id="pm" class="lk"><option value="Cash">Cash</option><option value="Transfer">Transfer</option><option value="Cheque">Cheque</option><option value="Credit">On account (unpaid)</option></select></div></div>
  <div class="cl"><button class="cb lk" id="cBtn"><i>🏭</i>Supplier<kbd>F4</kbd></button><div class="ci"><div><label>Supplier</label><input id="cn" readonly value="— choose a supplier —"></div><div class="cb2" id="cinfo"></div><div class="cl2"><div><label>Supplier invoice N°</label><input id="inv" class="lk"></div><div><label>Pay from register</label><select id="rid" class="lk"></select></div></div></div></div>
  <div class="bal"><div class="bl"><span>Old balance</span><b id="ob">0.00</b></div><div class="bl"><span>Amount</span><b id="ob2">0.00</b></div><div class="bl"><span>Paid</span><b id="ob3">0.00</b></div><div class="bl nb"><span>New balance</span><b id="ob4">0.00</b></div></div></div>
 <div class="ent"><label>Product code / name</label><div class="cw"><input id="cq" class="lk" placeholder="Scan barcode or type name, then Enter" autocomplete="off"><div class="fr" id="fr"></div></div><label>Qty</label><input id="cqty" class="lk" type="number" min="1" value="1" style="width:80px"><button class="p lk" id="bIns">＋ Insert <kbd>Enter</kbd></button><button class="lk" id="bMod">✎ Qty / price <kbd>F7</kbd></button><button class="d lk" id="bRm">✕ Remove <kbd>Del</kbd></button></div>
 <div class="em"><div class="tw" id="lt"></div>
  <aside class="rp2"><input id="sub" type="hidden"><div><label>Discount</label><input id="di" class="lk" type="number" min="0" step="0.01" value="0" style="text-align:end"></div><div><label>TOTAL TTC</label><input id="tp" class="ro" readonly style="font-size:22px"></div>
   <div class="z"><label>Paid now</label><input id="vers" class="lk" type="number" min="0" step="0.01"></div><div><label>Left to pay</label><input id="left" class="ro noc" readonly></div></aside></div>
 <div class="sbar" id="sb2"></div>
 <div class="nt"><textarea id="note" class="lk" placeholder="Observations"></textarea></div>
</div>
<div class="toast" id="ts"></div>

<dialog class="dd" id="cdlg"><div class="in"><h2 style="margin:0">Choose supplier</h2><input id="cs" placeholder="🔍 Name or phone" autocomplete="off"><div class="pk" id="cpk"></div>
 <details><summary>＋ New supplier</summary><div class="bar" style="margin:8px 0 0"><input id="nn" placeholder="Name"><input id="np" placeholder="Phone"><button class="p" id="nsv" style="flex:0 0 auto">Save</button></div></details>
 <div class="fa" style="display:flex;gap:8px;justify-content:flex-end"><button id="cx">Close</button></div></div></dialog>
<dialog class="dd" id="hdlg"><div class="in"><h2 style="margin:0">Held receiving notes (this device)</h2><div class="pk" id="hpk"></div><div class="fa" style="display:flex;justify-content:flex-end"><button id="hx">Close</button></div></div></dialog>
<dialog class="dd" id="npd"><form class="in" id="npf"><h2 style="margin:0">New product (accessory)</h2><div class="bar" style="margin:0"><input name="id" placeholder="Barcode (optional)"><input name="name" placeholder="Name" required></div><div class="bar" style="margin:0"><input name="model" placeholder="Category (Charger, Cable…)" required><input name="brand" placeholder="Brand"></div>
 <div class="bar" style="margin:0"><input name="buy" type="number" step="0.01" min="0" placeholder="Purchase price"><input name="wholesale" type="number" step="0.01" min="0" placeholder="Wholesale price"><input name="normal" type="number" step="0.01" min="0" placeholder="Sale price" required></div>
 <div class="fa" style="display:flex;gap:8px;justify-content:flex-end"><button type="button" id="npx">Cancel</button><button class="p">Create &amp; add</button></div></form></dialog>
<div id="pa"></div>
</main>
<script type="module">
import {$,esc,db,start,money,num,norm,gen,moveStock,logAudit,logPrices,specialOf,fixedOf,user,role,profile,canManage,watchParts,SHOP} from "./common.js?v=38";
import {collection,onSnapshot,doc,setDoc,updateDoc,deleteDoc,writeBatch,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
let D=[],S=[],parts=[],prods=[],regs=[],R=[],P=[],ready=0,sid='';
let cur=null,mode='new',L=[],sel=-1,sup=null,vT=false,fi=0,FR=[],busy=false;
const fm=money,today=()=>new Date().toISOString().slice(0,10),sec=d=>d.createdAt?.seconds||9e9;
const usr=d=>String(d.seller||d.by||'').split('@')[0].toUpperCase(),colOf=s=>prods.some(p=>p.id===s)?'products':'parts',owe=d=>num(d.total)-num(d.paid);
const hhmm=d=>d.createdAt&&d.createdAt.seconds?new Date(d.createdAt.seconds*1000).toTimeString().slice(0,8):'';
const items=()=>[...prods.map(p=>({...p,col:'products'})),...parts.map(p=>({...p,col:'parts'}))];
const lget=(col,id)=>(col==='products'?prods:parts).find(p=>p.id===id);
const toast=m=>{const t=$('ts');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2600)};
try{$('pp').checked=localStorage.getItem('rn_pp')==='1'}catch(_){}$('pp').onchange=()=>{try{localStorage.setItem('rn_pp',$('pp').checked?'1':'0')}catch(_){}};
const HK='rn_held',getH=()=>{try{return JSON.parse(localStorage.getItem(HK)||'[]')}catch(_){return[]}},setH=a=>{try{localStorage.setItem(HK,JSON.stringify(a))}catch(_){}$('eHeld').textContent=`Held (${a.length})`};

start(()=>{if(!canManage()){alert('Receiving notes are for managers and admins.');return}
 setH(getH());
 onSnapshot(collection(db,'receivings'),s=>{D=s.docs.map(d=>({...d.data(),_id:d.id}));lst();if(!ready++)route();else if(!$('vE').hidden)recalc()});
 onSnapshot(collection(db,'suppliers'),s=>{S=s.docs.map(d=>({...d.data(),id:d.id}));if(!$('vE').hidden)recalc()});
 onSnapshot(collection(db,'returns'),s=>{R=s.docs.map(d=>d.data())},()=>{});onSnapshot(collection(db,'supplierPayments'),s=>{P=s.docs.map(d=>({...d.data(),_id:d.id}))},()=>{});
 onSnapshot(collection(db,'registers'),s=>{regs=s.docs.map(d=>({...d.data(),id:d.id}));$('rid').innerHTML='<option value="">— none —</option>'+regs.map(r=>`<option value="${esc(r.id)}">${esc(r.name)}</option>`).join('');defReg()},()=>{});
 onSnapshot(collection(db,'products'),s=>{prods=s.docs.map(d=>({...d.data(),id:d.id}))});watchParts(p=>{parts=p})});
const defReg=()=>{if(mode==='new'&&!$('rid').value){const r=regs.find(x=>x.isDefault&&x.type==='cash')||regs.find(x=>x.type==='cash');if(r)$('rid').value=r.id}};

/* ---------- routing ---------- */
function route(){const h=decodeURIComponent(location.hash.slice(1));if(h==='new')openNew();else if(h&&D.find(d=>d.no===h))openNote(D.find(d=>d.no===h));else showL()}
addEventListener('hashchange',()=>{if(ready)route()});
const foc=f=>{try{if(parent!==window)parent.postMessage({rdGo:'receiving.html',focus:f},location.origin)}catch(_){}};
function showL(){$('vE').hidden=true;$('vL').hidden=false;foc(false);lst()}
function showE(){$('vL').hidden=true;$('vE').hidden=false;foc(true)}

/* ---------- journal ---------- */
function setPeriod(){const v=$('pe').value,t=today(),dt=n=>{const x=new Date();x.setDate(x.getDate()-n);return x.toISOString().slice(0,10)};let a=$('df').value,b=$('dt2').value;
 if(v==='today')a=b=t;else if(v==='yest')a=b=dt(1);else if(v==='week'){a=dt(6);b=t}else if(v==='month'){a=t.slice(0,8)+'01';b=t}else if(v==='all')a=b='';if(v!=='custom'){$('df').value=a;$('dt2').value=b}lst()}
$('pe').onchange=setPeriod;$('df').onchange=$('dt2').onchange=()=>{$('pe').value='custom';lst()};$('pe').value='today';$('df').value=$('dt2').value=today();
function fillSel(id,vals,lab){const el=$(id),v=el.value,k=[...new Set(vals.filter(Boolean))].sort();el.innerHTML=`<option value="">${lab}</option>`+k.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');el.value=k.includes(v)?v:''}
function view(){const q=norm($('lq').value),u=$('fu').value,c=$('fc').value,m=$('fm').value,a=$('df').value,b=$('dt2').value;
 return D.filter(d=>(!a||d.date>=a)&&(!b||d.date<=b)&&(!u||usr(d)===u)&&(!c||(d.who||'')===c)&&(!m||d.method===m)&&(!$('kd').checked||num(d.discount)>0)&&(!$('ku').checked||owe(d)>0.004)&&(!q||norm(d.no+' '+(d.invoiceNo||'')+' '+d.who+' '+(d.lines||[]).map(l=>l.name+' '+l.sku).join(' ')).includes(q)))
  .sort((x,y)=>x.date>y.date?1:x.date<y.date?-1:sec(x)-sec(y)||(x.no>y.no?1:-1))}
const sub0=x=>num(x.subtotal)||num(x.total)+num(x.discount),qty0=x=>(x.lines||[]).reduce((a,l)=>a+num(l.qty),0);
function lst(){if($('vL').hidden)return;fillSel('fu',D.map(usr),'All');fillSel('fc',D.map(d=>d.who),'All');fillSel('fm',D.map(d=>d.method),'All');
 const V=view();if(!V.find(d=>d._id===sid))sid=V.length?V[V.length-1]._id:'';
 $('mt').innerHTML=`<table class="gt"><thead><tr><th>N°</th><th>Invoice N°</th><th>Date</th><th>Time</th><th>Supplier</th><th>Items</th><th>Total qty</th><th>Total TTC</th><th>Discount</th><th>To pay</th><th>Old balance</th><th>Paid</th><th>Payment</th><th>User</th></tr></thead><tbody>`+
  V.map(d=>`<tr data-id="${esc(d._id)}" class="${d._id===sid?'on':''} ${owe(d)>0.004?'cr':''}"><td><b>${esc(d.no)}</b></td><td>${esc(d.invoiceNo||'')}</td><td>${esc(d.date||'')}</td><td>${hhmm(d)}</td><td class="l">${esc(d.who||'')}</td><td>${(d.lines||[]).length}</td><td>${qty0(d)}</td><td class="n">${fm(sub0(d))}</td><td class="n">${fm(num(d.discount))}</td><td class="n"><b>${fm(d.total)}</b></td><td class="n">${d.prevBalance===undefined?'':fm(d.prevBalance)}</td><td class="n">${fm(d.paid)}</td><td>${esc(d.method||'—')}</td><td>${esc(usr(d))}</td></tr>`).join('')+(V.length?'':'<tr><td colspan="14" style="padding:30px;color:var(--mut)">No receiving notes for this selection.</td></tr>')+'</tbody></table>';
 $('mt').querySelectorAll('tbody tr[data-id]').forEach(r=>{r.onclick=()=>{sid=r.dataset.id;$('mt').querySelectorAll('tr.on').forEach(x=>x.classList.remove('on'));r.classList.add('on');detail()};r.ondblclick=()=>{sid=r.dataset.id;openSel()}});
 const on=$('mt').querySelector('tr.on');if(on)on.scrollIntoView({block:'nearest'});detail();
 $('t1').value=fm(V.reduce((a,x)=>a+sub0(x),0));$('t2').value=fm(V.reduce((a,x)=>a+num(x.discount),0));$('t3').value=fm(V.reduce((a,x)=>a+num(x.total),0));$('t4').value=fm(V.reduce((a,x)=>a+num(x.paid),0));$('t5').value=fm(V.reduce((a,x)=>a+Math.max(0,owe(x)),0));
