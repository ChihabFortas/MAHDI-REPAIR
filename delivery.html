</style></head><body><main>

<!-- ================= JOURNAL ================= -->
<div class="vw" id="vL">
 <div class="tb"><span class="nv"><button id="n1" title="First">⏮</button><button id="n2" title="Previous">◀</button><button id="n3" title="Next">▶</button><button id="n4" title="Last">⏭</button></span>
  <button class="p" id="bNew">＋ New <kbd>F1</kbd></button><button id="bOpen">✎ Open / Edit <kbd>F2</kbd></button><button id="bDel" class="d">🗑 Delete <kbd>Del</kbd></button><button id="bPrint">🖨 Print <kbd>F5</kbd></button><button id="bCsv">⬇ Excel (CSV)</button>
  <span class="sp"></span><label>Period <select id="pe"><option value="today">Today</option><option value="yest">Yesterday</option><option value="week">Last 7 days</option><option value="month">This month</option><option value="all">All</option><option value="custom">Custom</option></select></label>
  <label>From <input type="date" id="df"></label><label>To <input type="date" id="dt2"></label></div>
 <div class="tb"><input id="lq" placeholder="🔍 Search no., customer, product…" style="flex:1;min-width:200px"><label><input type="checkbox" id="kd"> Discount only</label><label><input type="checkbox" id="ku"> Unpaid only</label><button id="bRef">↻ Refresh</button></div>
 <div class="lm"><div class="lc"><div class="tw" id="mt"></div><div class="tw" id="dw"></div></div>
  <aside class="fp"><div><label>User</label><select id="fu"></select></div><div><label>Customer</label><select id="fc"></select></div><div><label>Payment mode</label><select id="fm"></select></div><div><label>Seller</label><select id="fs2"></select></div>
   <div class="tt"><div><label>Total TTC</label><input id="t1" readonly></div><div><label>Discount</label><input id="t2" readonly></div><div><label>To pay</label><input id="t3" readonly></div><div><label>Collected</label><input id="t4" readonly></div><div><label>Unpaid (credit)</label><input id="t5" readonly></div></div></aside></div>
 <div class="sbar" id="sb1"></div>
</div>

<div class="vw" id="vE" hidden>
 <div class="tb"><button class="p" id="eNew">＋ New <kbd>F1</kbd></button><button id="eEdit">✎ Modify <kbd>F2</kbd></button><button class="p" id="eSave">✔ Validate <kbd>F3</kbd></button><button id="ePrint">🖨 Print <kbd>F5</kbd></button><button id="eHold">⏸ Hold <kbd>F8</kbd></button><button id="eHeld">Held (0)</button><button id="eRep">🔧 Repair prices <kbd>F12</kbd></button>
  <label><input type="checkbox" id="pp"> Print after</label><span class="sp"></span><b id="eTitle" hidden></b><button id="eQuit">✕ Quit <kbd>Esc</kbd></button></div>
 <div class="hdr"><div class="c1"><div><label>Delivery note N°</label><input id="no" readonly></div><div><label>Date</label><input type="date" id="dd" class="lk"></div><div><label>Payment mode</label><select id="pm" class="lk"><option value="Cash">Cash</option><option value="Card">Card</option><option value="Transfer">Transfer</option><option value="Credit">On credit</option></select></div></div>
  <div class="cl"><button class="cb lk" id="cBtn"><i>👤</i>Customer<kbd>F9</kbd></button><div class="ci"><div><label>Customer</label><input id="cn" readonly value="WALK-IN"></div><div class="cb2" id="cinfo">Walk-in — paid in full at the counter</div><div><label>Seller</label><input id="sl" class="lk"></div></div></div>
  <div class="big" id="big">0.00</div></div>
 <div class="ent"><label>Product code / name</label><div class="cw"><input id="cq" class="lk" placeholder="Scan barcode or type name, then Enter" autocomplete="off"><div class="fr" id="fr"></div></div><label>Qty</label><input id="cqty" class="lk" type="number" min="1" value="1" style="width:80px"><button class="p lk" id="bIns">＋ Insert <kbd>Enter</kbd></button><button class="lk" id="bMod">✎ Qty / price <kbd>F7</kbd></button><button class="d lk" id="bRm">✕ Remove <kbd>Del</kbd></button><label>Price list <select id="tr" class="lk" style="width:auto"><option value="r">Retail</option><option value="w">Wholesale</option><option value="p">Repair</option></select></label></div>
 <div class="em"><div class="tw" id="lt"></div>
  <aside class="rp2"><input id="am" type="hidden"><input id="sub" type="hidden"><div><label>Discount</label><input id="di" class="lk" type="number" min="0" step="0.01" value="0" style="text-align:end"></div><div><label>TO PAY</label><input id="tp" class="ro" readonly style="font-size:22px"></div>
   <div class="z"><label>Customer pays</label><input id="vers" class="lk" type="number" min="0" step="0.01"></div><div><label>Change due</label><input id="chg" class="ro okc" readonly></div><div><label>Left on account</label><input id="left" class="ro noc" readonly></div></aside></div>
 <div class="sbar" id="sb2"></div>
 <div class="nt"><textarea id="note" class="lk" placeholder="Notes / other information"></textarea></div>
</div>
<div class="toast" id="ts"></div>

<dialog class="dd" id="cdlg"><div class="in"><h2 style="margin:0">Choose customer</h2><input id="cs" placeholder="🔍 Name or phone" autocomplete="off"><div class="pk" id="cpk"></div>
 <details><summary>＋ New customer</summary><div class="bar" style="margin:8px 0 0"><input id="nn" placeholder="Name"><input id="np" placeholder="Phone"><select id="nt2"><option value="r">Retail</option><option value="w">Wholesale</option></select><button class="p" id="nsv" style="flex:0 0 auto">Save</button></div></details>
 <div class="fa" style="display:flex;gap:8px;justify-content:flex-end"><button id="cw">Walk-in</button><button id="cx">Close</button></div></div></dialog>
<dialog class="dd" id="hdlg"><div class="in"><h2 style="margin:0">Held sales</h2><div class="pk" id="hpk"></div><div class="fa" style="display:flex;justify-content:flex-end"><button id="hx">Close</button></div></div></dialog>
<div id="pa"></div>
</main>
<script type="module">
import {$,esc,db,start,money,num,norm,gen,moveStock,logAudit,user,role,profile,canManage,watchParts,priceOf,SHOP} from "./common.js?v=37";
import {collection,onSnapshot,doc,setDoc,updateDoc,deleteDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
let D=[],C=[],parts=[],prods=[],regs=[],R=[],P=[],held=[],ready=0,sid='';
let cur=null,mode='new',L=[],sel=-1,cust=null,tier='r',vT=false,fi=0,FR=[],busy=false;
const fm=money,today=()=>new Date().toISOString().slice(0,10),sec=d=>d.createdAt?.seconds||9e9;
const usr=d=>String(d.seller||d.by||'').split('@')[0].toUpperCase(),colOf=s=>prods.some(p=>p.id===s)?'products':'parts',owe=d=>num(d.total)-num(d.paid);
const items=()=>[...prods.map(p=>({...p,col:'products'})),...parts.map(p=>({...p,col:'parts'}))];
const lget=(col,id)=>(col==='products'?prods:parts).find(p=>p.id===id);
const toast=m=>{const t=$('ts');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2600)};
try{$('pp').checked=localStorage.getItem('dn_pp')==='1'}catch(_){}$('pp').onchange=()=>{try{localStorage.setItem('dn_pp',$('pp').checked?'1':'0')}catch(_){}};

start(()=>{if(!canManage()){const s=document.createElement('style');s.textContent='.mgc{display:none}';document.head.append(s)}
 $('sl').value=(profile&&profile.name)||(user&&user.email)||'';
 onSnapshot(collection(db,'deliveries'),s=>{D=s.docs.map(d=>({...d.data(),_id:d.id}));lst();if(!ready++)route();else if(!$('vE').hidden)recalc()});
 onSnapshot(collection(db,'customers'),s=>{C=s.docs.map(d=>({...d.data(),id:d.id}));if(!$('vE').hidden)recalc()});
 onSnapshot(collection(db,'returns'),s=>{R=s.docs.map(d=>d.data())},()=>{});onSnapshot(collection(db,'payments'),s=>{P=s.docs.map(d=>d.data())},()=>{});
 onSnapshot(collection(db,'registers'),s=>{regs=s.docs.map(d=>({...d.data(),id:d.id}))},()=>{});
 onSnapshot(collection(db,'heldSales'),s=>{held=s.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>sec(a)-sec(b));$('eHeld').textContent=`Held (${held.length})`;if($('hdlg').open)drawHeld()},()=>{});
 onSnapshot(collection(db,'products'),s=>{prods=s.docs.map(d=>({...d.data(),id:d.id}))});watchParts(p=>{parts=p})});

/* ---------- routing ---------- */
function route(){const h=decodeURIComponent(location.hash.slice(1));if(h==='new')openNew();else if(h&&D.find(d=>d.no===h))openNote(D.find(d=>d.no===h));else showL()}
addEventListener('hashchange',()=>{if(ready)route()});
const foc=f=>{try{if(parent!==window)parent.postMessage({rdGo:'delivery.html',focus:f},location.origin)}catch(_){}};
function showL(){$('vE').hidden=true;$('vL').hidden=false;foc(false);lst()}
function showE(){$('vL').hidden=true;$('vE').hidden=false;foc(true)}

/* ---------- journal ---------- */
function setPeriod(){const v=$('pe').value,t=today(),dt=n=>{const x=new Date();x.setDate(x.getDate()-n);return x.toISOString().slice(0,10)};let a=$('df').value,b=$('dt2').value;
 if(v==='today')a=b=t;else if(v==='yest')a=b=dt(1);else if(v==='week'){a=dt(6);b=t}else if(v==='month'){a=t.slice(0,8)+'01';b=t}else if(v==='all')a=b='';if(v!=='custom'){$('df').value=a;$('dt2').value=b}lst()}
$('pe').onchange=setPeriod;$('df').onchange=$('dt2').onchange=()=>{$('pe').value='custom';lst()};$('pe').value='today';$('df').value=$('dt2').value=today();
function fillSel(id,vals,lab){const el=$(id),v=el.value,k=[...new Set(vals.filter(Boolean))].sort();el.innerHTML=`<option value="">${lab}</option>`+k.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');el.value=k.includes(v)?v:''}
function view(){const q=norm($('lq').value),u=$('fu').value,c=$('fc').value,m=$('fm').value,s=$('fs2').value,a=$('df').value,b=$('dt2').value;
 return D.filter(d=>(!a||d.date>=a)&&(!b||d.date<=b)&&(!u||usr(d)===u)&&(!c||(d.who||'')===c)&&(!m||d.method===m)&&(!s||(d.seller||'')===s)&&(!$('kd').checked||num(d.discount)>0)&&(!$('ku').checked||owe(d)>0.004)&&(!q||norm(d.no+' '+d.who+' '+(d.lines||[]).map(l=>l.name+' '+l.sku).join(' ')).includes(q)))
  .sort((x,y)=>x.date>y.date?1:x.date<y.date?-1:sec(x)-sec(y)||(x.no>y.no?1:-1))}
function lst(){if($('vL').hidden)return;fillSel('fu',D.map(usr),'All');fillSel('fc',D.map(d=>d.who),'All');fillSel('fm',D.map(d=>d.method),'All');fillSel('fs2',D.map(d=>d.seller),'All');
 const V=view();if(!V.find(d=>d._id===sid))sid=V.length?V[V.length-1]._id:'';
 $('mt').innerHTML=`<table class="gt"><thead><tr><th>N°</th><th>Date</th><th>Customer</th><th>Items</th><th>Total TTC</th><th>Discount</th><th>To pay</th><th>Paid</th><th>Payment</th><th>Seller</th></tr></thead><tbody>`+
  V.map(d=>`<tr data-id="${esc(d._id)}" class="${d._id===sid?'on':''} ${owe(d)>0.004?'cr':''}"><td><b>${esc(d.no)}</b></td><td>${esc(d.date||'')}</td><td class="l">${esc(d.who||'')}</td><td>${(d.lines||[]).length}</td><td class="n">${fm(num(d.subtotal)||num(d.total)+num(d.discount))}</td><td class="n">${fm(num(d.discount))}</td><td class="n"><b>${fm(d.total)}</b></td><td class="n">${fm(d.paid)}</td><td>${esc(d.method||'—')}</td><td>${esc(usr(d))}</td></tr>`).join('')+(V.length?'':'<tr><td colspan="10" style="padding:30px;color:var(--mut)">No delivery notes for this selection.</td></tr>')+'</tbody></table>';
 $('mt').querySelectorAll('tbody tr[data-id]').forEach(r=>{r.onclick=()=>{sid=r.dataset.id;$('mt').querySelectorAll('tr.on').forEach(x=>x.classList.remove('on'));r.classList.add('on');detail()};r.ondblclick=()=>{sid=r.dataset.id;openSel()}});
 const on=$('mt').querySelector('tr.on');if(on)on.scrollIntoView({block:'nearest'});detail();
 const sub=x=>num(x.subtotal)||num(x.total)+num(x.discount);$('t1').value=fm(V.reduce((a,x)=>a+sub(x),0));$('t2').value=fm(V.reduce((a,x)=>a+num(x.discount),0));$('t3').value=fm(V.reduce((a,x)=>a+num(x.total),0));$('t4').value=fm(V.reduce((a,x)=>a+num(x.paid),0));$('t5').value=fm(V.reduce((a,x)=>a+Math.max(0,owe(x)),0));
 const ln=V.flatMap(x=>x.lines||[]);$('sb1').innerHTML=`<span>Notes: <b>${V.length}</b></span><span>Products: <b>${ln.length}</b></span><span>Total quantity: <b>${ln.reduce((a,l)=>a+num(l.qty),0)}</b></span><span class="mgc">Margin: <b>${fm(ln.reduce((a,l)=>a+num(l.qty)*(num(l.price)-num(l.cost)),0))}</b></span><span class="w2">Unpaid notes: <b>${V.filter(x=>owe(x)>0.004).length}</b></span>`}
function detail(){const d=D.find(x=>x._id===sid);if(!d){$('dw').innerHTML='<div class="dh">Select a delivery note to see its lines.</div>';return}
 $('dw').innerHTML=`<div class="dh"><b>${esc(d.no)}</b> · ${esc(d.who||'')} · ${esc(d.date||'')}${d.note?' · 📝 '+esc(d.note):''}</div><table class="gt"><thead><tr><th>N°</th><th>Code</th><th>Designation</th><th>Qty</th><th>Unit price</th><th>Amount</th><th class="mgc">Margin</th></tr></thead><tbody>`+
  (d.lines||[]).map((l,i)=>`<tr><td>${i+1}</td><td>${esc(l.sku)}</td><td class="l">${esc(l.name)}</td><td><b>${num(l.qty)}</b></td><td class="n">${fm(l.price)}</td><td class="n">${fm(num(l.qty)*num(l.price))}</td><td class="n mgc">${fm(num(l.qty)*(num(l.price)-num(l.cost)))}</td></tr>`).join('')+'</tbody></table>'}
['lq','kd','ku','fu','fc','fm','fs2'].forEach(i=>$(i).oninput=$(i).onchange=lst);$('bRef').onclick=()=>{$('lq').value='';$('kd').checked=$('ku').checked=false;['fu','fc','fm','fs2'].forEach(i=>$(i).value='');$('pe').value='today';setPeriod()};
const nav=k=>{const V=view();if(!V.length)return;let i=V.findIndex(d=>d._id===sid);i=k==='f'?0:k==='l'?V.length-1:Math.min(V.length-1,Math.max(0,i+(k==='n'?1:-1)));sid=V[i]._id;lst()};
$('n1').onclick=()=>nav('f');$('n2').onclick=()=>nav('p');$('n3').onclick=()=>nav('n');$('n4').onclick=()=>nav('l');
function openSel(){const d=D.find(x=>x._id===sid);if(d)openNote(d)}
$('bNew').onclick=()=>openNew();$('bOpen').onclick=openSel;$('bPrint').onclick=()=>{const d=D.find(x=>x._id===sid);if(d)printNote(d)};
$('bDel').onclick=async()=>{const d=D.find(x=>x._id===sid);if(!d)return;if(role!=='admin'){alert('Only an admin can delete delivery notes.');return}if(!confirm('Delete delivery note '+d.no+'? Items go back to stock and the customer history is recalculated.'))return;

function avail(sku,col){const p=lget(col,sku);let a=p?num(p.qty):0;if(cur&&mode==='edit'){const o=(cur.lines||[]).find(x=>x.sku===sku);if(o)a+=num(o.qty)}return a}

 if(l){l.qty+=q;sel=L.indexOf(l)}else{L.push({col,sku:p.id,name:p.name,qty:q,price:priceOf(p,tier),cost:num(p.buy),loc:p.location||''});sel=L.length-1}vT=false;$('cq').value='';$('cqty').value=1;$('fr').style.display='none';drawE();$('cq').focus();const r=$('lt').querySelector('tr.on');if(r)r.scrollIntoView({block:'nearest'})}

/* save */
async function cashSync(no,paid,method,date,who){try{if(method==='Cash'&&paid>0){const r=regs.find(x=>x.isDefault&&x.type==='cash')||regs.find(x=>x.type==='cash');if(!r)return;try{await updateDoc(doc(db,'cashEntries','SALE_'+no),{amount:paid,date,remark:who})}catch(_){await setDoc(doc(db,'cashEntries','SALE_'+no),{registerId:r.id,date,time:new Date().toTimeString().slice(0,8),kind:'in',amount:paid,source:'SALE',ref:no,mode:'Cash',remark:who,by:user.email,createdAt:serverTimestamp()})}}else{try{await deleteDoc(doc(db,'cashEntries','SALE_'+no))}catch(_){}}}catch(_){}}
async function save(){if(!editable()||busy)return;if(!L.length){alert('Add at least one product.');return}const t=tot(),m=$('pm').value,paid=m==='Credit'?0:Math.min(num($('vers').value),t),who=cust?cust.name:'Walk-in';
 if(!cust&&paid<t-0.004){alert('Walk-in sales must be paid in full. Choose a customer (F9) to sell on credit.');return}
 for(const l of L){if(l.qty>avail(l.sku,l.col)){alert(`Only ${avail(l.sku,l.col)} in stock for ${l.name}.`);return}}
 busy=true;$('eSave').disabled=true;const date=$('dd').value||today(),base={who,customerId:cust&&cust.id?cust.id:null,date,subtotal:sub(),discount:num($('di').value),total:t,paid,method:m,seller:$('sl').value||user.email,note:$('note').value.trim(),lines:L.map(l=>({sku:l.sku,name:l.name,qty:num(l.qty),price:num(l.price),cost:num(l.cost),col:l.col}))};
 try{let d;if(mode==='new'){const no='DN-'+today().replace(/-/g,'')+'-'+gen('').slice(0,3),done=[];try{for(const l of L){await moveStock(l.sku,-l.qty,'sale',no,who,l.col);done.push(l)}d={no,...base,source:'pos',channel:'delivery',by:user.email};await setDoc(doc(db,'deliveries',no),{...d,createdAt:serverTimestamp()})}
   catch(e){for(const l of done)await moveStock(l.sku,l.qty,'return',no,'Note rolled back',l.col).catch(()=>{});throw e}
   await cashSync(no,paid,m,date,who);logAudit('pos.sale',no+' · '+fm(t));toast('✔ Saved '+no+' — '+fm(t));if($('pp').checked)printNote({...d,debt:cust&&cust.id?balOf(cust)+t-paid:0});openNew()}
  else{const o=cur,mp=new Map();(o.lines||[]).forEach(x=>mp.set(x.sku,{...x,col:x.col||colOf(x.sku),d:num(x.qty)}));L.forEach(x=>{const e=mp.get(x.sku);if(e)e.d-=x.qty;else mp.set(x.sku,{...x,d:-x.qty})});const done=[];
   try{for(const x of mp.values()){if(!x.d)continue;await moveStock(x.sku,x.d,x.d>0?'return':'sale',o.no,'Delivery note edited',x.col);done.push(x)}}catch(e){for(const x of done)await moveStock(x.sku,-x.d,x.d>0?'sale':'return',o.no,'Edit rolled back',x.col).catch(()=>{});throw e}
   await updateDoc(doc(db,'deliveries',o._id),{...base,editedBy:user.email,editedAt:serverTimestamp()});await cashSync(o.no,paid,m,date,who);logAudit('invoice.edit',o.no+' · '+fm(o.total)+' → '+fm(t));toast('✔ Updated '+o.no);if($('pp').checked)printNote({...o,...base});sid=o._id;showL()}
 }catch(e){alert('Not saved: '+e.message)}busy=false;if(!$('vE').hidden)$('eSave').disabled=!editable()}
$('eSave').onclick=save;$('eNew').onclick=()=>{if(L.length&&editable()&&!confirm('Discard the current note?'))return;openNew()};

/* print */
function printNote(d){const c=C.find(x=>x.id===d.customerId),bal=c?balOf(c,d.no)+owe(d):null;
 $('pa').innerHTML=`<div class="a4"><div class="h"><div><b style="font-size:20px">${esc(SHOP.name)}</b><br>${esc(SHOP.address||'')}<br>${esc(SHOP.phone||'')}</div><div style="text-align:end"><b style="font-size:18px">DELIVERY NOTE</b><br>N° <b>${esc(d.no)}</b><br>Date: ${esc(d.date||'')}</div></div><hr><div><b>Customer:</b> ${esc(d.who||'Walk-in')} ${c&&c.phone?' · '+esc(c.phone):''}<br>Seller: ${esc(usr(d))} · Payment: ${esc(d.method||'')}</div>
 <table><thead><tr><th>N°</th><th>Code</th><th>Designation</th><th class="n">Qty</th><th class="n">Unit price</th><th class="n">Amount</th></tr></thead><tbody>${(d.lines||[]).map((l,i)=>`<tr><td>${i+1}</td><td>${esc(l.sku)}</td><td>${esc(l.name)}</td><td class="n">${num(l.qty)}</td><td class="n">${fm(l.price)}</td><td class="n">${fm(num(l.qty)*num(l.price))}</td></tr>`).join('')}</tbody></table>
 <div style="margin-inline-start:auto;width:260px"><div class="h"><span>Subtotal</span><span>${fm(num(d.subtotal)||num(d.total)+num(d.discount))}</span></div>${num(d.discount)?`<div class="h"><span>Discount</span><span>-${fm(d.discount)}</span></div>`:''}<div class="h"><b>TOTAL</b><b>${fm(d.total)}</b></div><div class="h"><span>Paid</span><span>${fm(d.paid)}</span></div>${owe(d)>0.004?`<div class="h"><span>Left on this note</span><span>${fm(owe(d))}</span></div>`:''}${bal!==null?`<div class="h"><span>Account balance</span><span>${fm(bal)}</span></div>`:''}</div>
 ${d.note?`<p>Note: ${esc(d.note)}</p>`:''}<div class="sg"><span>Customer signature</span><span>Seller signature</span></div></div>`;
 let st=$('ps');if(!st){st=document.createElement('style');st.id='ps';document.head.appendChild(st)}st.textContent='@page{size:A4;margin:12mm}';setTimeout(()=>window.print(),150)}
/* keyboard */
addEventListener('keydown',e=>{if(document.querySelector('dialog[open]'))return;const inp=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName),L1=!$('vL').hidden,k=e.key;
 const fn={F1:()=>L1?openNew():$('eNew').click(),F2:()=>L1?openSel():$('eEdit').click(),F3:()=>L1||save(),F5:()=>L1?$('bPrint').click():$('ePrint').click(),F7:()=>L1||$('bMod').click(),F8:()=>L1||$('eHold').click(),F9:()=>L1||pickC(),F12:()=>L1||$('eRep').click()}[k];
 if(fn){e.preventDefault();fn();return}

 if(L1&&!inp){if(k==='ArrowDown'){e.preventDefault();nav('n')}else if(k==='ArrowUp'){e.preventDefault();nav('p')}else if(k==='Enter')openSel();else if(k==='Delete')$('bDel').click()}
 if(!L1&&!inp){if(k==='Delete')$('bRm').click();else if(k==='ArrowDown'&&sel<L.length-1){sel++;drawE()}else if(k==='ArrowUp'&&sel>0){sel--;drawE()}else if(k.length===1&&!e.ctrlKey&&!e.metaKey&&editable()){$('cq').focus()}}});
