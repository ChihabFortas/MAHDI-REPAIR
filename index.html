<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><!--boot--><style id="fouc">html{visibility:hidden}</style><script>setTimeout(function(){var f=document.getElementById('fouc');f&&f.remove()},5000)</script><link rel="modulepreload" href="js/common.js?v=72"><link rel="modulepreload" href="js/ui.js?v=72"><link rel="modulepreload" href="js/firebase-config.js?v=72"><link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"><link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"><link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"><!--/boot--><title>Mahdi Repair</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1c93c2"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Mahdi"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="img/apple-touch-icon.png"><link rel="icon" href="img/icon-192.png"><link rel="stylesheet" href="css/common.css?v=72"><style>html,body{height:100%;margin:0}body{background:#050708;color:#e8f1f6;min-height:100dvh;display:grid;grid-template-columns:1.1fr 1fr}
.art{background:#050708 url(img/login-bg.jpg) center/contain no-repeat;min-height:100dvh}
.side{display:grid;place-items:center;padding:24px;background:radial-gradient(900px 600px at 80% 10%,#1c93c233,transparent 60%),#0a0e11}
#lg{box-sizing:border-box;width:100%;max-width:380px;background:#ffffff0d;border:1px solid #ffffff1f;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);padding:30px 26px;border-radius:20px;display:grid;gap:14px;box-shadow:0 20px 60px #0008}
#lg h2{margin:0;font-size:28px;letter-spacing:.3px;color:#fff}#lg p{margin:-8px 0 4px;color:#9fb3be;font-size:14px}
#lg input,#lg select{background:#ffffff12;color:#fff;border:1px solid #ffffff26;border-radius:12px;padding:13px 14px;font-size:16px;width:100%;box-sizing:border-box}#lg input::placeholder{color:#8aa0ac}#pw.sec{-webkit-text-security:disc;text-security:disc}
#lg input:focus{outline:2px solid #1c93c2;border-color:transparent}#lg select{width:auto;padding:6px 10px;font-size:14px;color-scheme:dark}
#lg .p{background:linear-gradient(135deg,#1c93c2,#157aa3);color:#fff;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:700;cursor:pointer}#lg .p:hover{filter:brightness(1.1)}
.lk{background:none;border:0;color:#6cc3e6;padding:0;text-align:center;cursor:pointer;font-size:14px}
@media(max-width:820px){body{grid-template-columns:1fr;grid-template-rows:34vh 1fr}.art{min-height:0;background-size:cover;background-position:center 45%}.side{align-items:start;padding:16px 16px 28px;background:#0a0e11}#lg{margin-top:-30px}}
</style></head><body>
<div class="art"></div><div class="side"><div id="lg"><div style="text-align:end"><select id="ls" style="width:auto;padding:5px"><option value="en">English</option><option value="fr">Français</option><option value="ar">العربية</option></select></div>
<h2>Mahdi Repair</h2><p id="sub">Sign in to your workspace</p><input id="em" type="text" placeholder="Name" dir="auto" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next"><div style="position:relative"><input id="pw" type="text" name="rd-secret" class="sec" placeholder="Password" autocomplete="off" data-lpignore="true" data-1p-ignore="true" dir="ltr" lang="en" inputmode="text" enterkeyhint="go" autocapitalize="off" autocorrect="off" spellcheck="false" style="padding-inline-end:46px"><button type="button" id="eye" aria-label="Show password" style="position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);background:none;border:0;font-size:20px;cursor:pointer;padding:6px">👁</button></div><button type="button" id="osk" class="lk" style="text-align:center">⌨ On-screen keyboard</button><div id="kb" style="display:none;gap:5px;flex-direction:column"></div><button class="p" id="go" style="padding:11px">Sign in</button><button class="lk" id="fp">Forgot password?</button><a href="shop.html" style="text-align:center;color:#9fb3be;font-size:13px">← Online shop</a><small id="ms" style="color:#ff8a80;text-align:center"></small></div></div>
<script type="module">
if(window.self!==window.top){window.top.location.replace(location.href)}
import {$,auth,db,loadProfile,logAudit,HOME,reveal,slugName,STAFF_DOMAIN} from "./js/common.js?v=72";
import {doc,getDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {S,setLang} from "./js/ui.js?v=72";
import {signInWithEmailAndPassword,sendPasswordResetEmail,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
let fresh=false;const say=(t,ok)=>{$('ms').style.color=ok?'#6cc3e6':'#ff8a80';$('ms').textContent=t};
$('ls').value=S.lang;$('ls').onchange=()=>setLang($('ls').value);
const toEmail=async id=>{id=id.trim();if(id.includes('@'))return id;const sl=slugName(id);if(!sl)return '';try{const s=await getDoc(doc(db,'usernames',sl));if(s.exists())return s.data().email}catch(e){}return sl+'@'+STAFF_DOMAIN};
$('go').onclick=async()=>{fresh=true;say('');const em=await toEmail($('em').value);if(!em){fresh=false;say('Enter your name.');return}signInWithEmailAndPassword(auth,em,$('pw').value).catch(()=>{fresh=false;say('Wrong name or password.')})};
$('eye').onclick=()=>{const p=$('pw');p.classList.toggle('sec');p.focus()};
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click()});
$('fp').onclick=async()=>{const m=await toEmail($('em').value);if(!m){say('Enter your name first.');return}if(m.endsWith('@'+STAFF_DOMAIN)){say('Ask a manager or administrator to reset your password.',true);return}sendPasswordResetEmail(auth,m).catch(()=>{}).finally(()=>say('If this account has an email, a reset link was sent.',true))};
let routing=false;
async function route(u){if(routing)return;routing=true;
 try{const p=await loadProfile(u);
  if(!p||p.active!==true){reveal();say(!p?'Your account is waiting for an administrator to give it a role.':'This account has been disabled.');await signOut(auth);routing=false;return}
  if(fresh)await logAudit('login','',{by:u.email,role:p.role});
  location.replace(HOME[p.role]+location.search)}catch(e){reveal();say('Access check failed: '+e.message);await signOut(auth);routing=false}}
(auth.authStateReady?auth.authStateReady():Promise.resolve()).then(()=>{if(auth.currentUser)route(auth.currentUser);else reveal();onAuthStateChanged(auth,u=>{if(u&&fresh)route(u)})});
</script><script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
// on-screen keyboard: works even when the device keyboard misses keys
(()=>{const $=id=>document.getElementById(id),kb=$('kb'),pw=$('pw');let sh=0,sy=0;const L=['qwertyuiop','asdfghjkl','zxcvbnm'],N=['1234567890','@#$%&*-_+=','!?.,:;/\\()'];
 const draw=()=>{const rows=sy?N:L,B=(t,k,w)=>`<button type="button" data-k="${k}" style="flex:${w||1};padding:11px 0;font-size:17px;border-radius:9px;border:1px solid #ffffff30;background:#ffffff14;color:#fff;cursor:pointer;min-width:0">${t}</button>`;
  const row=r=>`<div style="display:flex;gap:4px">${[...r].map(c=>{const v=(sh&&!sy)?c.toUpperCase():c;return B(v.replace('&','&amp;').replace('<','&lt;'),v)}).join('')}</div>`;
  kb.innerHTML=(sy?'':row('1234567890'))+rows.map(row).join('')+`<div style="display:flex;gap:4px">${B(sy?'ABC':'123','#sy',1.4)}${sy?'':B(sh?'⇧ on':'⇧','#sh',1.4)}${B('space','#sp',3)}${B('⌫','#bs',1.4)}</div>`;
  kb.querySelectorAll('button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k==='#sy'){sy=!sy;draw();return}if(k==='#sh'){sh=!sh;draw();return}
   if(k==='#bs')pw.value=pw.value.slice(0,-1);else pw.value+=k==='#sp'?' ':k;if(sh&&!sy&&k!=='#bs'){sh=0;draw()}pw.dispatchEvent(new Event('input',{bubbles:true}))})};
 $('osk').onclick=()=>{const on=kb.style.display==='none';kb.style.display=on?'flex':'none';if(on)draw()};
 pw.addEventListener('keydown',()=>{});})();
</script></body></html>
