<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mahdi Repair – My attendance</title>
<link rel="stylesheet" href="common.css?v=42"><style>#tabs{display:none!important}main{max-width:980px!important;margin:0 auto!important;box-sizing:border-box;width:100%}
.cl0{text-align:center;padding:22px 12px}.cl0 .tm{font-size:clamp(48px,12vw,92px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1}.cl0 .dt{color:var(--mut);margin-top:4px}
.st0{display:inline-block;margin:12px 0;padding:6px 16px;border-radius:99px;font-weight:700;background:#8882}.st0.in{background:#16a34a22;color:#16a34a}.st0.br{background:#f59e0b22;color:#d97706}.st0.out{background:#64748b22;color:#64748b}
.ab{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:10px 0}.ab button{padding:22px 10px;font-size:20px;font-weight:700;border-radius:16px}.ab .go{background:#16a34a;border-color:#16a34a;color:#fff}.ab .stp{background:#dc2626;border-color:#dc2626;color:#fff}.ab .brk{background:#f59e0b;border-color:#f59e0b;color:#fff}.ab button:disabled{opacity:.45}
.msg{padding:10px 14px;border-radius:12px;margin:8px 0;font-size:14px}.msg.ok{background:#16a34a18;color:#15803d}.msg.no{background:#f59e0b20;color:#b45309}.msg.er{background:#dc262618;color:#b91c1c}
.kp3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.k3{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card)}.k3 span{font-size:12.5px;color:var(--mut)}.k3 b{display:block;font-size:22px}
table.t3{width:100%;border-collapse:collapse;font-size:14px}.t3 th,.t3 td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:start}.t3 th{font-size:12.5px;color:var(--mut)}.pl{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:#8882}.pl.a{background:#16a34a22;color:#16a34a}.pl.p{background:#f59e0b22;color:#d97706}.pl.r{background:#dc262622;color:#dc2626}
dialog.dd{width:min(520px,96vw)}dialog.dd .in{padding:16px;display:grid;gap:10px}video{width:100%;border-radius:12px;background:#000}</style></head><body><main>
<div class="card cl0"><div class="tm" id="tm">--:--</div><div class="dt" id="dt"></div><div class="st0 out" id="st">…</div><div id="mg"></div>
 <div class="ab" id="ab"></div><button id="sc" style="margin-top:6px" hidden>📷 Scan the shop QR code</button></div>
<div class="card"><h3 style="margin:0 0 8px">Today</h3><div id="tl"></div></div>
<div class="card"><h3 style="margin:0 0 8px">This month <small id="mn" style="color:var(--mut)"></small></h3><div class="kp3" id="ms"></div></div>
<div class="card"><div class="bar" style="margin:0 0 8px"><b style="flex:1;align-self:center">Leave requests</b><button class="p" id="nl" style="flex:0 0 auto">＋ Request leave</button></div><table class="t3"><thead><tr><th>Type</th><th>From</th><th>To</th><th>Status</th><th></th></tr></thead><tbody id="lv"></tbody></table></div>
<div class="card"><h3 style="margin:0 0 8px">My week</h3><div id="wk"></div></div>
</main>
<dialog class="dd" id="ld"><form class="in" id="lf"><h2 style="margin:0">Request leave</h2><div><label>Type</label><select name="type"><option value="annual">Annual leave</option><option value="sick">Sick leave</option><option value="unpaid">Unpaid leave</option><option value="other">Other</option></select></div><div class="bar" style="margin:0"><div><label>From</label><input type="date" name="from" required></div><div><label>To</label><input type="date" name="to" required></div></div><div><label>Note</label><input name="note"></div><div class="fa" style="display:flex;gap:8px;justify-content:flex-end"><button type="button" id="lx">Cancel</button><button class="p">Send request</button></div></form></dialog>
<dialog class="dd" id="sd"><div class="in"><h2 style="margin:0">Scan the QR code</h2><video id="vd" playsinline muted></video><p style="color:var(--mut);margin:0" id="sm">Point the camera at the code shown on the shop screen.</p><div class="fa" style="display:flex;justify-content:flex-end"><button id="sx">Close</button></div></div></dialog>
<script type="module">
import {$,esc,db,start,user,profile,num} from "./common.js?v=42";
import {collection,addDoc,doc,onSnapshot,query,where,setDoc,deleteDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {ymd,fmtH,clock,monthStats,dayCalc,expectedFor,DAYS,atMs} from "./attlib.js?v=41";
let logs=[],sched=null,cfg={},leaves=[],tok='',busy=false;const today=()=>ymd(new Date());
// token from the scanned QR link (?k=...)
try{const k=new URLSearchParams(location.search).get('k');if(k){sessionStorage.setItem('att_k',k+'|'+Date.now());const u=new URL(location.href);u.searchParams.delete('k');history.replaceState(null,'',u.pathname+u.search+u.hash)}
 const s=sessionStorage.getItem('att_k');if(s){const [t,at]=s.split('|');if(Date.now()-(+at)<10*60000)tok=t;else sessionStorage.removeItem('att_k')}}catch(_){}
start(()=>{const q=n=>collection(db,n);
 onSnapshot(query(q('attendanceLogs'),where('uid','==',user.uid)),s=>{logs=s.docs.map(d=>({...d.data(),id:d.id}));draw()});
 onSnapshot(doc(db,'staffSchedules',user.uid),s=>{sched=s.exists()?s.data():null;draw()},()=>{});onSnapshot(doc(db,'settings','attendance'),s=>{cfg=s.exists()?s.data():{};draw()},()=>{});
 onSnapshot(query(q('leaves'),where('uid','==',user.uid)),s=>{leaves=s.docs.map(d=>({...d.data(),id:d.id}));draw()},()=>{});setInterval(tick,1000);tick()});
function tick(){const n=new Date();$('tm').textContent=n.toTimeString().slice(0,8);$('dt').textContent=n.toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});if(logs.length&&n.getSeconds()===0)draw()}
const TY={in:'Clock in',out:'Clock out',breakStart:'Break started',breakEnd:'Break ended'};
function draw(){if(!user)return;const t=today(),ev=logs.filter(l=>l.date===t),c=dayCalc(ev,null,cfg,true),last=[...ev].sort((a,b)=>atMs(a.at)-atMs(b.at)).pop(),state=!last||last.type==='out'?'out':last.type==='breakStart'?'br':'in';
 const need=cfg.requireQR!==false;
 $('st').className='st0 '+state;$('st').textContent=state==='out'?(ev.length?'Clocked out · '+fmtH(c.worked)+' worked':'Not clocked in'):state==='br'?'On break since '+clock(last.at):'Working since '+clock(ev.find(e=>e.type==='in').at)+' · '+fmtH(c.worked);
 $('mg').innerHTML=need&&!tok?'<div class="msg no">To clock in or out, scan the QR code shown at the shop with your phone camera (or tap “Scan”).</div>':need?'<div class="msg ok">✔ Shop code received — you can clock now.</div>':'';
 $('sc').hidden=!(need&&!tok&&('BarcodeDetector' in window));
 const dis=need&&!tok;const B=[];if(state==='out')B.push(['in','▶ Clock in','go']);else if(state==='in'){B.push(['breakStart','☕ Start break','brk'],['out','■ Clock out','stp'])}else B.push(['breakEnd','▶ End break','go']);
 $('ab').innerHTML=B.map(([a,l,c])=>`<button class="${c}" data-a="${a}" ${dis||busy?'disabled':''}>${l}</button>`).join('');$('ab').querySelectorAll('button').forEach(b=>b.onclick=()=>act(b.dataset.a));
 $('tl').innerHTML=ev.length?`<table class="t3"><tbody>${[...ev].sort((a,b)=>atMs(a.at)-atMs(b.at)).map(e=>`<tr><td><b>${clock(e.at)}</b></td><td>${TY[e.type]}</td><td style="color:var(--mut)">${e.manual?'added by manager':''}</td></tr>`).join('')}</tbody></table>`:'<span style="color:var(--mut)">No records yet today.</span>';
 const m=t.slice(0,7),r=monthStats(m,logs.filter(l=>l.date.startsWith(m)),sched,cfg.shifts||[],cfg.holidays||[],leaves,cfg,t);$('mn').textContent='('+m+')';
 $('ms').innerHTML=[['Hours worked',fmtH(r.worked)],['Expected so far',sched?fmtH(r.expected):'—'],['Overtime',fmtH(r.overtime)],['Late arrivals',r.late],['Absences',sched?r.absent:'—'],['Attendance',r.attendance===null?'—':Math.round(r.attendance)+'%']].map(([l,v])=>`<div class="k3"><span>${l}</span><b>${v}</b></div>`).join('');
 $('lv').innerHTML=leaves.sort((a,b)=>a.from<b.from?1:-1).map(l=>`<tr><td>${esc(l.type)}</td><td>${l.from}</td><td>${l.to}</td><td><span class="pl ${l.status==='approved'?'a':l.status==='pending'?'p':'r'}">${l.status}</span></td><td>${l.status==='pending'?`<button data-d="${l.id}">Cancel</button>`:''}</td></tr>`).join('')||'<tr><td colspan="5" style="color:var(--mut)">No requests.</td></tr>';
 $('lv').querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(confirm('Cancel this request?'))await deleteDoc(doc(db,'leaves',b.dataset.d))});
 const sh=cfg.shifts||[];$('wk').innerHTML=sched&&sh.length?`<table class="t3"><tr>${[1,2,3,4,5,6,0].map(d=>`<th>${DAYS[d]}</th>`).join('')}</tr><tr>${[1,2,3,4,5,6,0].map(d=>{const s=sh.find(x=>x.id===(sched.days||[])[d]);return `<td>${s?`<b>${esc(s.name)}</b><br><small>${s.start}–${s.end}</small>`:'<span style="color:var(--mut)">off</span>'}</td>`}).join('')}</tr></table>`:'<span style="color:var(--mut)">Your manager has not assigned a schedule yet.</span>'}
async function act(type){if(busy)return;busy=true;draw();try{await addDoc(collection(db,'attendanceLogs'),{uid:user.uid,name:(profile&&profile.name)||user.email,type,date:today(),at:serverTimestamp(),token:tok||'',manual:false,by:user.email});$('mg').innerHTML='<div class="msg ok">✔ '+TY[type]+' recorded.</div>';if(type==='out'){tok='';try{sessionStorage.removeItem('att_k')}catch(_){}}}
 catch(e){$('mg').innerHTML='<div class="msg er">'+(/permission|insufficient/i.test(e.message)?'The shop code is missing or expired. Scan the QR code on the shop screen again (the screen must stay open).':esc(e.message))+'</div>';tok='';try{sessionStorage.removeItem('att_k')}catch(_){}}busy=false;setTimeout(draw,1500)}
$('nl').onclick=()=>{$('lf').reset();$('ld').showModal()};$('lx').onclick=()=>$('ld').close();
$('lf').onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));if(v.to<v.from){alert('The end date is before the start date.');return}try{await addDoc(collection(db,'leaves'),{uid:user.uid,name:(profile&&profile.name)||user.email,type:v.type,from:v.from,to:v.to,note:v.note||'',status:'pending',createdAt:serverTimestamp()});$('ld').close()}catch(x){alert(x.message)}};
// in-page QR scanner (Chrome/Android); other phones can simply use the camera app
let stream=null,scanning=false;$('sc').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});$('vd').srcObject=stream;await $('vd').play();$('sd').showModal();scanning=true;const bd=new BarcodeDetector({formats:['qr_code']});(async function loop(){while(scanning){try{const r=await bd.detect($('vd'));if(r.length){const raw=r[0].rawValue;let k='';try{k=new URL(raw).searchParams.get('k')||''}catch(_){}if(k){tok=k;try{sessionStorage.setItem('att_k',k+'|'+Date.now())}catch(_){}stop();draw();return}$('sm').textContent='This is not the shop attendance code.'}}catch(_){}await new Promise(r=>setTimeout(r,300))}})()}catch(e){alert('Camera not available: '+e.message)}};
const stop=()=>{scanning=false;if(stream)stream.getTracks().forEach(t=>t.stop());$('sd').close()};$('sx').onclick=stop;
</script></body></html>
