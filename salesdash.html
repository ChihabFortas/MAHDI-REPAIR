<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mahdi Repair – Counter dashboard</title>
<link rel="stylesheet" href="common.css?v=24"><style>#tabs{display:none!important}
main{max-width:1400px!important;margin:0 auto!important;box-sizing:border-box;width:100%}
.hd{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.hd h1{margin:0;font-size:26px}.hd small{color:var(--mut)}
.kp3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}.k3{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:12px 14px;border-inline-start:5px solid var(--c,var(--ac))}.k3 span{display:block;font-size:12.5px;color:var(--mut)}.k3 b{display:block;font-size:24px;margin-top:2px}.k3.alert{background:color-mix(in srgb,#f59e0b 14%,var(--card))}
.tl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}.t{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:104px;border-radius:16px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:14px;font-weight:600;text-align:center;padding:10px;transition:.12s}.t i{font-style:normal;font-size:30px}.t:hover{transform:translateY(-2px);border-color:var(--ac)}.t.main{background:var(--ac);color:#fff;border-color:var(--ac)}.t em{position:absolute;top:8px;inset-inline-end:8px;background:#dc2626;color:#fff;border-radius:99px;font-style:normal;font-size:12px;padding:1px 8px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:12px}.cols .card{margin:0}.cols h3{margin:0 0 8px}
.ls div{display:flex;justify-content:space-between;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line);font-size:14px}.ls div small{color:var(--mut)}.ls .go{cursor:pointer}.ls .go:hover{background:color-mix(in srgb,var(--ac) 8%,transparent)}.em2{color:var(--mut);padding:14px 4px}
.bd2{padding:1px 8px;border-radius:99px;font-size:12px;background:#8882}.bd2.n{background:#dc262622;color:#dc2626}.bd2.c{background:#16a34a22;color:#16a34a}</style></head><body><main>
<div class="hd"><div><h1 id="hi">Counter dashboard</h1><small id="dt"></small></div><div><button class="p" id="gp" style="padding:12px 20px;font-size:16px">🛒 Start selling <kbd style="font:11px monospace;opacity:.7">F1</kbd></button></div></div>
<div class="kp3" id="kp"></div>
<div class="tl" id="tl"></div>
<div class="cols"><section class="card"><h3>Today's sales</h3><div class="ls" id="rs"></div></section><section class="card"><h3>Online orders to handle</h3><div class="ls" id="os"></div></section>
<section class="card"><h3>Top sellers today</h3><div class="ls" id="ts"></div></section><section class="card"><h3>Low stock (at or below minimum)</h3><div class="ls" id="lw"></div></section><section class="card"><h3>Customer balances</h3><div class="ls" id="db"></div></section></div>
</main><script type="module">
import {$,esc,db,start,money,num,norm,user,role,profile,watchParts,goPage} from "./common.js?v=40";
import {collection,onSnapshot,query,where} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
let D=[],O=[],C=[],P=[],R=[],parts=[],prods=[];const fm=money,today=()=>new Date().toISOString().slice(0,10);
const sub=(q,f)=>onSnapshot(q,s=>{f(s.docs.map(d=>({...d.data(),id:d.id})));draw()},e=>console.warn(e.message));
start(()=>{const c=n=>collection(db,n);sub(c('deliveries'),x=>D=x);sub(query(c('orders'),where('status','in',['new','confirmed','waiting','processing'])),x=>O=x);sub(c('customers'),x=>C=x);sub(c('payments'),x=>P=x);sub(c('returns'),x=>R=x);sub(c('products'),x=>prods=x);watchParts(p=>{parts=p;draw()})});
const bal=c=>{let b=0;D.filter(d=>d.customerId===c.id).forEach(d=>b+=num(d.total)-num(d.paid));R.filter(r=>r.kind==='sale'&&r.customerId===c.id).forEach(r=>b+=num(r.refund&&r.refund.amount)-num(r.total));P.filter(p=>p.customerId===c.id).forEach(p=>b-=num(p.amount));return b};
const ST={new:'New',confirmed:'Confirmed',waiting:'Waiting for stock',processing:'Preparing'};
function draw(){if(!role)return;const h=new Date().getHours();$('hi').textContent=(h<12?'Good morning':h<18?'Good afternoon':'Good evening')+', '+((profile&&profile.name)||'').split(' ')[0];$('dt').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});
 const t=today(),td=D.filter(d=>d.date===t).sort((a,b)=>(b.createdAt?.seconds||9e9)-(a.createdAt?.seconds||9e9)),rev=td.reduce((a,x)=>a+num(x.total),0),col=td.reduce((a,x)=>a+num(x.paid),0),nw=O.filter(o=>o.status==='new').length;
 const dbt=C.map(c=>({c,b:bal(c)})).filter(x=>x.b>0.004).sort((a,b)=>b.b-a.b),rec=dbt.reduce((a,x)=>a+x.b,0),low=[...prods.map(p=>({...p,k:'Accessory'})),...parts.map(p=>({...p,k:'Part'}))].filter(p=>num(p.qty)<=(num(p.minQty)>0?num(p.minQty):2)).sort((a,b)=>num(a.qty)-num(b.qty));
 $('kp').innerHTML=[['Sales today',td.length,'#1c93c2'],['Revenue',fm(rev),'#16a34a'],['Collected',fm(col),'#0d9488'],['Sold on credit',fm(rev-col),'#f59e0b'],['Online orders to handle',O.length,'#8b5cf6',nw],['Customer balances',fm(rec),'#dc2626'],['Low-stock items',low.length,'#64748b']].map(([l,v,c,a])=>`<div class="k3 ${a?'alert':''}" style="--c:${c}"><span>${l}${a?` · <b style="display:inline;font-size:13px;color:#dc2626">${a} new</b>`:''}</span><b>${v}</b></div>`).join('');
 $('rs').innerHTML=td.slice(0,8).map(d=>`<div class="go" data-g="delivery.html"><span><b>${esc(d.no)}</b> <small>${esc(d.who||'')}</small></span><span>${fm(d.total)} <span class="bd2 ${num(d.total)-num(d.paid)>0.004?'n':'c'}">${esc(d.method||'')}</span></span></div>`).join('')||'<div class="em2">No sales yet today.</div>';
 $('os').innerHTML=O.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)).slice(0,8).map(o=>`<div class="go" data-g="orders.html"><span><b>${esc(o.code||o.id)}</b> <small>${esc((o.customer&&o.customer.name)||'')}</small></span><span>${fm(o.total)} <span class="bd2 ${o.status==='new'?'n':''}">${ST[o.status]||o.status}</span></span></div>`).join('')||'<div class="em2">No online orders waiting. 🎉</div>';
 const sold={};td.forEach(d=>(d.lines||[]).forEach(l=>sold[l.name]=(sold[l.name]||0)+num(l.qty)));$('ts').innerHTML=Object.entries(sold).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([n,q])=>`<div><span>${esc(n)}</span><b>${q}×</b></div>`).join('')||'<div class="em2">Nothing sold yet today.</div>';
 $('lw').innerHTML=low.slice(0,8).map(p=>`<div class="go" data-g="${p.k==='Part'?'inventory.html#cat':'pos.html#acc'}"><span>${esc(p.name)} <small>${esc(p.model||'')}</small></span><b style="color:${num(p.qty)<=0?'#dc2626':'#d97706'}">${num(p.qty)}</b></div>`).join('')||'<div class="em2">Stock levels look fine.</div>';
 $('db').innerHTML=dbt.slice(0,8).map(x=>`<div class="go" data-g="customers.html"><span>${esc(x.c.name)} <small>${esc(x.c.phone||'')}</small></span><b style="color:#dc2626">${fm(x.b)}</b></div>`).join('')||'<div class="em2">No customer owes money.</div>';
 document.querySelectorAll('[data-g]').forEach(e=>e.onclick=()=>goPage(e.dataset.g))}
const TL=[['🛒','Counter sale','pos.html#pos',1,'main'],['📤','New delivery note','delivery.html#new',1],['🌐','Online orders','orders.html'],['👥','Customers & debts','customers.html'],['🎧','Accessories','pos.html#acc'],['↩️','Returns','pos.html#ret'],['📒','Sales journal','pos.html#sal'],['📦','Parts catalog','inventory.html#cat'],['🛍️','Online shop','shop.html'],['📣','Marketing','marketing.html']];
$('tl').innerHTML=TL.map(([i,l,h,f,m])=>`<button class="t ${m||''}" data-h="${h}" ${f?'data-f="1"':''}><i>${i}</i>${l}</button>`).join('');
document.querySelectorAll('.t').forEach(b=>b.onclick=()=>goPage(b.dataset.h,!!b.dataset.f));$('gp').onclick=()=>goPage('pos.html#pos',true);
addEventListener('keydown',e=>{if(e.key==='F1'){e.preventDefault();$('gp').click()}});
</script></body></html>
