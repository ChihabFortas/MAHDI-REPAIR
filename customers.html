<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mahdi Repair – Customers</title>
<link rel="stylesheet" href="common.css?v=24"><style>#tabs{display:none!important}
.cp{display:grid;grid-template-columns:340px 1fr;gap:14px;align-items:start}.lst{max-height:calc(100vh - 150px);overflow:auto;padding:6px}
.ci{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 12px;border-radius:12px;cursor:pointer;border:1px solid transparent}.ci:hover{background:color-mix(in srgb,var(--ac) 8%,transparent)}.ci.on{background:color-mix(in srgb,var(--ac) 15%,transparent);border-color:var(--ac)}.ci b{display:block}.ci small{color:var(--mut)}
.db{font-weight:800;white-space:nowrap}.db.z{color:var(--mut);font-weight:600}.db.r{color:#e5484d}.db.g{color:#16a34a}
.hd2{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start;margin-bottom:12px}.hd2 h2{margin:0}.hd2 small{color:var(--mut)}
.kp2{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}.kp2 div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card)}.kp2 span{color:var(--mut);font-size:12.5px}.kp2 b{display:block;font-size:20px}
table.lg2{width:100%;border-collapse:collapse}.lg2 th,.lg2 td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;font-size:14px}.lg2 th{position:sticky;top:0;background:var(--card);font-size:12.5px;color:var(--mut)}.lg2 td.n,.lg2 th.n{text-align:end;white-space:nowrap}.lg2 tr.rw{cursor:pointer}.lg2 tr.rw:hover{background:color-mix(in srgb,var(--ac) 8%,transparent)}
.tp{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}.tp.inv{background:#1c93c222;color:#1c93c2}.tp.pay{background:#16a34a22;color:#16a34a}.tp.ret{background:#f59e0b22;color:#d97706}.tp.op{background:#8882}
dialog.big{width:min(760px,96vw)}.el{display:grid;grid-template-columns:1fr 90px 70px 90px 34px;gap:6px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line)}.sr{position:absolute;inset-inline:0;top:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;max-height:220px;overflow:auto;z-index:20;display:none}.sr div{padding:8px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}.sr div:hover{background:color-mix(in srgb,var(--ac) 12%,transparent)}
.bk{display:none}@media(max-width:900px){.cp{grid-template-columns:1fr}.lst{max-height:none}.cp.sel .lcol{display:none}.cp:not(.sel) .dcol{display:none}.bk{display:inline-block}}</style></head><body><main>
<div class="cp" id="cp"><div class="lcol"><div class="bar"><input id="q" placeholder="Search by name or phone…"><button class="p" id="nc" style="flex:0 0 auto">+ New</button></div><div class="bar" style="margin-top:-4px"><select id="fl"><option value="">All customers</option><option value="debt">With a balance due</option><option value="w">Wholesale</option><option value="r">Retail</option></select></div><div class="card lst" id="ls"></div></div>
<div class="dcol" id="dt"><div class="card" style="padding:30px;text-align:center;color:var(--mut)">Select a customer to see their full history.</div></div></div></main>
<dialog id="pd"><form class="g" id="pf"><h2 id="pt">Payment</h2><div><label>Amount *</label><input name="amount" type="number" step="0.01" min="0.01" required></div><div><label>Date</label><input name="date" type="date" required></div><div><label>Note</label><input name="note" placeholder="optional"></div><div class="fa"><button type="button" id="pdl" class="d" hidden>Delete</button><button type="button" id="pc">Cancel</button><button class="p">Save</button></div></form></dialog>
<dialog id="cd"><form class="g" id="cf"><h2 id="ct">Customer</h2><div><label>Name *</label><input name="name" required></div><div><label>Phone</label><input name="phone"></div><div><label>Type</label><select name="type"><option value="r">Retail</option><option value="w">Wholesale</option></select></div><div class="fa"><button type="button" id="cdl" class="d" hidden>Delete</button><button type="button" id="cc">Cancel</button><button class="p">Save</button></div></form></dialog>
<dialog id="vd" class="big"><form id="vf" style="padding:22px;display:grid;gap:12px;grid-template-columns:1fr"><h2 id="vt">Invoice</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><label>Date</label><input name="date" type="date" required></div><div><label>Payment method</label><input name="method" readonly></div></div>
<h3 style="margin:8px 0 2px">Items</h3><div id="vl"></div><div style="position:relative"><input id="vs" placeholder="＋ Add an item: search name or code…" autocomplete="off"><div id="vr" class="sr"></div></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px"><div><label>Discount</label><input name="discount" type="number" min="0" step="0.01"></div><div><label>Paid at sale</label><input name="paid" type="number" min="0" step="0.01"></div></div><div style="text-align:end;font-size:18px;font-weight:800" id="vtt"></div>
<p style="color:var(--mut);font-size:13px;margin:0" id="vn"></p><div class="fa"><button type="button" id="vdl" class="d" hidden>Delete invoice</button><button type="button" id="vc">Close</button><button class="p" id="vsv">Save &amp; recalculate</button></div></form></dialog>
<dialog id="rd" class="big"><div style="padding:20px"><h2 id="rt" style="margin-top:0">Return</h2><div id="rb"></div><div class="fa" style="display:flex;justify-content:flex-end;margin-top:12px"><button id="rx">Close</button></div></div></dialog>
<script type="module">
import {$,esc,db,start,money,num,norm,gen,moveStock,logAudit,user,role,canManage} from "./common.js?v=36";
import {collection,onSnapshot,doc,setDoc,updateDoc,deleteDoc,getDocs,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const fm=money,today=()=>new Date().toISOString().slice(0,10),sec=x=>x&&x.createdAt&&x.createdAt.seconds||0;
let C=[],D=[],R=[],P=[],regs=[],sel=null,INV=null,EL=[],CAT=null,PE=null;
start(()=>{onSnapshot(collection(db,'customers'),s=>{C=s.docs.map(d=>({...d.data(),id:d.id}));draw()});
 onSnapshot(collection(db,'deliveries'),s=>{D=s.docs.map(d=>({...d.data(),_id:d.id}));draw()});
 onSnapshot(collection(db,'returns'),s=>{R=s.docs.map(d=>({...d.data(),_id:d.id}));draw()});
 onSnapshot(collection(db,'payments'),s=>{P=s.docs.map(d=>({...d.data(),_id:d.id}));draw()});
 onSnapshot(collection(db,'registers'),s=>{regs=s.docs.map(d=>({...d.data(),id:d.id}))},()=>{})});
/* ---- ledger ---- */
function ledger(c){const rows=[];
 D.filter(d=>d.customerId===c.id).forEach(d=>rows.push({k:'inv',d,date:d.date||'',s:sec(d),no:d.no,debit:num(d.total),credit:num(d.paid)}));
 R.filter(r=>r.kind==='sale'&&r.customerId===c.id).forEach(r=>rows.push({k:'ret',r,date:r.date||'',s:sec(r),no:r.no,debit:num(r.refund&&r.refund.amount),credit:num(r.total)}));
 P.filter(p=>p.customerId===c.id).forEach(p=>rows.push({k:'pay',p,date:p.date||'',s:sec(p),no:p.ref||'Payment',debit:0,credit:num(p.amount)}));
 rows.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.s-b.s||({inv:0,ret:1,pay:2}[a.k]-{inv:0,ret:1,pay:2}[b.k]));let bal=0;rows.forEach(r=>{bal+=r.debit-r.credit;r.bal=bal});return {rows,bal,inv:rows.filter(r=>r.k==='inv').reduce((a,r)=>a+r.debit,0),ret:rows.filter(r=>r.k==='ret').reduce((a,r)=>a+r.credit,0),paid:rows.reduce((a,r)=>a+(r.k==='inv'?r.credit:r.k==='pay'?r.credit:0),0)}}
const bcls=b=>b>0.004?'r':b<-0.004?'g':'z',btxt=b=>b>0.004?fm(b):b<-0.004?fm(-b)+' (credit)':fm(0);
/* ---- list ---- */
function draw(){const q=norm($('q').value),f=$('fl').value;const L=C.map(c=>({c,b:ledger(c).bal})).filter(({c,b})=>(!q||norm(c.name+' '+(c.phone||'')).includes(q))&&(!f||(f==='debt'?b>0.004:c.type===f))).sort((a,b)=>b.b-a.b||norm(a.c.name).localeCompare(norm(b.c.name)));
 $('ls').innerHTML=L.map(({c,b})=>`<div class="ci ${sel===c.id?'on':''}" data-c="${c.id}"><div><b>${esc(c.name)}</b><small>${esc(c.phone||'')} · ${c.type==='w'?'Wholesale':'Retail'}</small></div><span class="db ${bcls(b)}">${b>0.004?fm(b):b<-0.004?'+'+fm(-b):'—'}</span></div>`).join('')||'<p style="color:var(--mut);padding:10px">No customers found.</p>';
 $('ls').querySelectorAll('[data-c]').forEach(e=>{e.onclick=()=>{sel=e.dataset.c;$('cp').classList.add('sel');draw()};e.ondblclick=e.onclick});detail()}
$('q').oninput=draw;$('fl').onchange=draw;
/* ---- detail ---- */
function detail(){const c=C.find(x=>x.id===sel);if(!c){$('dt').innerHTML='<div class="card" style="padding:30px;text-align:center;color:var(--mut)">Select a customer to see their full history.</div>';return}const L=ledger(c);
 $('dt').innerHTML=`<div class="card" style="padding:14px"><div class="hd2"><div><button class="bk" id="bk">‹ Customers</button><h2>${esc(c.name)}</h2><small>${esc(c.phone||'')} · ${c.type==='w'?'Wholesale':'Retail'} · ${L.rows.filter(r=>r.k==='inv').length} invoices</small></div><div class="bar" style="margin:0"><button class="p" id="ap" style="flex:0 0 auto">+ Add payment</button><button id="ec" style="flex:0 0 auto">Edit customer</button></div></div>
 <div class="kp2"><div><span>Invoiced</span><b>${fm(L.inv)}</b></div><div><span>Returns</span><b>${fm(L.ret)}</b></div><div><span>Paid</span><b>${fm(L.paid)}</b></div><div><span>Balance due</span><b class="db ${bcls(L.bal)}" style="font-size:22px">${btxt(L.bal)}</b></div></div>
 <div style="overflow:auto;max-height:calc(100vh - 330px)"><table class="lg2"><thead><tr><th>Date</th><th>Type</th><th>No.</th><th class="n">Debit (owed)</th><th class="n">Credit (paid / returned)</th><th class="n">Balance</th></tr></thead><tbody>
 <tr><td colspan="2"><span class="tp op">Start</span></td><td></td><td class="n"></td><td class="n"></td><td class="n">${fm(0)}</td></tr>
 ${L.rows.map(r=>`<tr class="rw" data-k="${r.k}" data-i="${esc(r.k==='inv'?r.d._id:r.k==='ret'?r.r._id:r.p._id)}"><td>${esc(r.date)}</td><td><span class="tp ${r.k}">${r.k==='inv'?'Invoice':r.k==='ret'?'Return':'Payment'}</span></td><td>${esc(r.no)}${r.k==='inv'&&r.d.lines?'<br><small style="color:var(--mut)">'+r.d.lines.slice(0,3).map(l=>l.qty+'× '+esc(l.name)).join(', ')+(r.d.lines.length>3?'…':'')+'</small>':''}</td><td class="n">${r.debit?fm(r.debit):''}</td><td class="n">${r.credit?fm(r.credit):''}</td><td class="n"><b class="db ${bcls(r.bal)}">${r.bal<-0.004?'-':''}${fm(Math.abs(r.bal))}</b></td></tr>`).join('')||'<tr><td colspan="6" style="color:var(--mut)">No transactions yet.</td></tr>'}</tbody></table></div><p style="color:var(--mut);font-size:12.5px;margin:8px 0 0">Click a line to open it. Changing or removing an invoice or payment recalculates the whole history.</p></div>`;
 $('bk').onclick=()=>$('cp').classList.remove('sel');$('ap').onclick=()=>openPay(c);$('ec').onclick=()=>openCust(c);
 $('dt').querySelectorAll('.rw').forEach(r=>{const go=()=>{const k=r.dataset.k,id=r.dataset.i;if(k==='inv')openInv(D.find(x=>x._id===id));else if(k==='pay')openPay(c,P.find(x=>x._id===id));else openRet(R.find(x=>x._id===id))};r.onclick=go;r.ondblclick=go})}
/* ---- payments ---- */
function openPay(c,p){PE=p||null;const f=$('pf');f.reset();$('pt').textContent=(p?'Edit payment':'New payment')+' — '+c.name;f.amount.value=p?p.amount:'';f.date.value=p?p.date:today();f.note.value=p?p.note||'':'';$('pdl').hidden=!p||!canManage();f.dataset.c=c.id;f.amount.disabled=false;$('pd').showModal()}
const cashReg=()=>regs.find(x=>x.isDefault&&x.type==='cash')||regs.find(x=>x.type==='cash');
$('pf').onsubmit=async e=>{e.preventDefault();const f=e.target,a=num(f.amount.value);if(a<=0)return;
 try{if(PE){if(!canManage()){alert('Only a manager or admin can change a payment.');return}await updateDoc(doc(db,'payments',PE._id),{amount:a,date:f.date.value,note:f.note.value.trim(),editedBy:user.email,editedAt:serverTimestamp()});if(PE.ref)try{await updateDoc(doc(db,'cashEntries','PAYMENT_'+PE.ref),{amount:a,date:f.date.value})}catch(_){}logAudit('payment.edit',(C.find(x=>x.id===PE.customerId)||{}).name+' · '+fm(PE.amount)+' → '+fm(a))}
  else{const ref='PAY-'+gen('').slice(0,5),c=C.find(x=>x.id===f.dataset.c);await setDoc(doc(collection(db,'payments')),{customerId:c.id,amount:a,date:f.date.value,note:f.note.value.trim(),ref,by:user.email,createdAt:serverTimestamp()});const r=cashReg();if(r)try{await setDoc(doc(db,'cashEntries','PAYMENT_'+ref),{registerId:r.id,date:f.date.value,time:new Date().toTimeString().slice(0,8),kind:'in',amount:a,source:'PAYMENT',ref,mode:'Cash',remark:c.name,by:user.email,createdAt:serverTimestamp()})}catch(_){}logAudit('payment.received',c.name+' · '+fm(a))}
  $('pd').close()}catch(x){alert(x.message)}};
$('pdl').onclick=async()=>{if(!PE||!confirm('Remove this payment of '+fm(PE.amount)+'? The customer balance will increase.'))return;try{await deleteDoc(doc(db,'payments',PE._id));if(PE.ref)try{await deleteDoc(doc(db,'cashEntries','PAYMENT_'+PE.ref))}catch(_){}logAudit('payment.delete',(C.find(x=>x.id===PE.customerId)||{}).name+' · '+fm(PE.amount));$('pd').close()}catch(x){alert(x.message)}};$('pc').onclick=()=>$('pd').close();
/* ---- customer ---- */
let CE=null;function openCust(c){CE=c||null;const f=$('cf');f.reset();$('ct').textContent=c?'Edit customer':'New customer';f.name.value=c?c.name:'';f.phone.value=c?c.phone||'':'';f.type.value=c?c.type||'r':'r';$('cdl').hidden=!c||role!=='admin';$('cd').showModal()}
$('nc').onclick=()=>openCust(null);$('cc').onclick=()=>$('cd').close();
$('cf').onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));try{if(CE){await updateDoc(doc(db,'customers',CE.id),{name:v.name.trim(),phone:v.phone.trim(),type:v.type});logAudit('customer.edit',v.name)}else{const id=gen('C-');await setDoc(doc(db,'customers',id),{name:v.name.trim(),phone:v.phone.trim(),type:v.type,createdAt:serverTimestamp()});sel=id;$('cp').classList.add('sel')}$('cd').close()}catch(x){alert(x.message)}};
$('cdl').onclick=async()=>{if(!CE)return;const L=ledger(CE);if(L.rows.length){alert('This customer has transactions and cannot be deleted.');return}if(!confirm('Delete '+CE.name+'?'))return;try{await deleteDoc(doc(db,'customers',CE.id));sel=null;$('cd').close()}catch(x){alert(x.message)}};
/* ---- return (read only) ---- */
function openRet(r){if(!r)return;$('rt').textContent='Return '+r.no+' · '+r.date;$('rb').innerHTML=`<p>${esc(r.who||'')} · refund: ${esc((r.refund&&r.refund.mode)||'credit')} ${r.refund&&r.refund.amount?fm(r.refund.amount):''}</p><table class="lg2"><thead><tr><th>Item</th><th class="n">Qty</th><th class="n">Price</th><th class="n">Total</th></tr></thead><tbody>${(r.lines||[]).map(l=>`<tr><td>${esc(l.name)}</td><td class="n">${l.qty}</td><td class="n">${fm(l.price)}</td><td class="n">${fm(l.qty*l.price)}</td></tr>`).join('')}</tbody></table><p style="text-align:end"><b>${fm(r.total)}</b></p>`;$('rd').showModal()}$('rx').onclick=()=>$('rd').close();
/* ---- invoice edit ---- */
async function catalog(){if(!CAT){const [a,b]=await Promise.all([getDocs(collection(db,'parts')),getDocs(collection(db,'products'))]);CAT=[...a.docs.map(d=>({...d.data(),id:d.id,col:'parts'})),...b.docs.map(d=>({...d.data(),id:d.id,col:'products'}))]}return CAT}
function openInv(d){if(!d)return;INV=d;const f=$('vf'),edit=d.source==='pos'&&canManage();f.reset();$('vt').textContent='Invoice '+d.no+' — '+(d.who||'');f.date.value=d.date||today();f.method.value=d.method||'';f.discount.value=num(d.discount);f.paid.value=num(d.paid);EL=(d.lines||[]).map(x=>({...x}));f.dataset.ed=edit?'1':'';[...f.elements].forEach(e=>{if(e.id!=='vc'&&e.name!=='method')e.disabled=!edit&&e.type!=='button'});$('vc').disabled=false;$('vsv').hidden=!edit;$('vdl').hidden=!(d.source==='pos'&&role==='admin');$('vdl').disabled=false;$('vs').hidden=!edit;$('vn').textContent=edit?'Saving adjusts stock for changed quantities and the cash register entry, then the customer history is recalculated.':(d.source==='pos'?'Only a manager or admin can change invoices.':'This document comes from the inventory and cannot be edited here.');drawL(edit);$('vd').showModal()}
function drawL(ed){$('vl').innerHTML=EL.map((x,i)=>`<div class="el"><span>${esc(x.name)}<br><small>${esc(x.sku)}</small></span><input type="number" step="0.01" min="0" value="${x.price}" data-p="${i}" ${ed?'':'disabled'}><input type="number" step="1" min="1" value="${x.qty}" data-q="${i}" ${ed?'':'disabled'}><b style="text-align:end">${fm(x.price*x.qty)}</b><button type="button" data-x="${i}" ${ed?'':'disabled'}>✕</button></div>`).join('')||'<p style="color:var(--mut)">No items.</p>';
 $('vl').querySelectorAll('[data-p]').forEach(e=>e.oninput=()=>{EL[+e.dataset.p].price=num(e.value);tt()});$('vl').querySelectorAll('[data-q]').forEach(e=>e.oninput=()=>{EL[+e.dataset.q].qty=Math.max(1,Math.floor(num(e.value))||1);tt()});$('vl').querySelectorAll('[data-x]').forEach(e=>e.onclick=()=>{EL.splice(+e.dataset.x,1);drawL(ed)});tt()}
const subT=()=>EL.reduce((a,x)=>a+x.price*x.qty,0),totT=()=>Math.max(0,subT()-num($('vf').discount.value));function tt(){$('vtt').textContent='Total '+fm(totT())+' · balance on this invoice '+fm(totT()-num($('vf').paid.value))}$('vf').discount.oninput=tt;$('vf').paid.oninput=tt;
$('vs').oninput=async()=>{const q=norm($('vs').value),r=$('vr');if(q.length<2){r.style.display='none';return}const L=(await catalog()).filter(i=>norm(i.id+' '+i.name+' '+(i.model||'')).includes(q)).slice(0,10);r.innerHTML=L.map(i=>`<div data-i="${esc(i.col+'|'+i.id)}"><span>${esc(i.name)} <small>(${esc(i.id)})</small></span><span>${fm(i.normal)} · ${i.qty||0} in stock</span></div>`).join('')||'<div>No match</div>';r.style.display='block';r.querySelectorAll('[data-i]').forEach(d=>d.onclick=()=>{const [col,id]=d.dataset.i.split('|'),i=CAT.find(x=>x.id===id&&x.col===col),e=EL.find(x=>x.sku===id);if(e)e.qty++;else EL.push({sku:id,name:i.name,qty:1,price:num(i.normal),cost:num(i.buy),col});$('vs').value='';r.style.display='none';drawL(true)})};
$('vc').onclick=()=>$('vd').close();
$('vf').onsubmit=async e=>{e.preventDefault();const f=e.target,d=INV;if(!f.dataset.ed)return;if(!EL.length){alert('An invoice needs at least one item. Use "Delete invoice" to remove it.');return}const sb=subT(),tot=totT(),paid=Math.min(num(f.paid.value),tot);$('vsv').disabled=true;
 try{const m=new Map();(d.lines||[]).forEach(x=>m.set(x.sku,{...x,d:num(x.qty)}));EL.forEach(x=>{const o=m.get(x.sku);if(o)o.d-=x.qty;else m.set(x.sku,{...x,d:-x.qty})});const done=[];try{for(const x of m.values()){if(!x.d)continue;await moveStock(x.sku,x.d,x.d>0?'return':'sale',d.no,'Invoice edited',x.col||'parts');done.push(x)}}catch(err){for(const x of done)await moveStock(x.sku,-x.d,x.d>0?'sale':'return',d.no,'Edit rolled back',x.col||'parts').catch(()=>{});throw err}
  await updateDoc(doc(db,'deliveries',d._id),{lines:EL.map(x=>({sku:x.sku,name:x.name,qty:x.qty,price:x.price,cost:num(x.cost),col:x.col||'parts'})),subtotal:sb,discount:num(f.discount.value),total:tot,paid,date:f.date.value,editedBy:user.email,editedAt:serverTimestamp()});
  if(d.method==='Cash')try{await updateDoc(doc(db,'cashEntries','SALE_'+d.no),{amount:paid,date:f.date.value})}catch(_){}logAudit('invoice.edit',d.no+' · '+fm(d.total)+' → '+fm(tot));$('vd').close()}catch(x){alert(x.message)}$('vsv').disabled=false};
$('vdl').onclick=async()=>{const d=INV;if(!d||!confirm('Delete invoice '+d.no+'? Items go back to stock and the history is recalculated.'))return;try{for(const x of d.lines||[])await moveStock(x.sku,num(x.qty),'return',d.no,'Invoice deleted',x.col||'parts');await deleteDoc(doc(db,'deliveries',d._id));try{await deleteDoc(doc(db,'cashEntries','SALE_'+d.no))}catch(_){}logAudit('invoice.delete',d.no);$('vd').close()}catch(x){alert(x.message)}};
</script></body></html>
