<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mahdi Repair – Online orders</title>
<link rel="stylesheet" href="common.css?v=42"><style>#tabs{display:none!important}
.fl2{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.fl2 button{border-radius:99px;padding:7px 14px}.fl2 button.on{background:var(--ac);color:#fff;border-color:var(--ac)}.fl2 b{margin-inline-start:6px;opacity:.8}
.oc{display:grid;gap:8px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:10px}.oc.nw{border-color:var(--ac);box-shadow:0 0 0 2px color-mix(in srgb,var(--ac) 25%,transparent)}.oc .t{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}.oc small{color:var(--mut)}.oc .ac{display:flex;gap:8px;flex-wrap:wrap}
.sp{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--ac) 16%,transparent)}.sp.shipped,.sp.delivered{background:#16a34a22;color:#16a34a}.sp.cancelled{background:#e5484d22;color:#e5484d}.wr{color:#d97706;font-weight:600;font-size:13px}
.ln2{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:3px 0;border-bottom:1px dashed var(--line)}dialog.big{width:min(720px,96vw)}.g2e{display:grid;grid-template-columns:1fr 1fr;gap:10px}.el{display:grid;grid-template-columns:1fr 84px 70px 34px;gap:6px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line)}.sr{position:absolute;inset-inline:0;top:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;max-height:240px;overflow:auto;z-index:20;display:none}.sr div{padding:8px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}.sr div:hover{background:color-mix(in srgb,var(--ac) 12%,transparent)}.chp{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.chp button{border-radius:99px;padding:5px 12px;font-size:12.5px}@media(max-width:600px){.g2e{grid-template-columns:1fr}}</style></head><body>
<header><h1>Mahdi Repair – Online orders</h1><button onclick="location.href='dashboard.html'">Dashboard</button><button id="lo">Sign out</button></header>
<main><div class="bar"><input id="q" placeholder="Search code, name, phone…"><button id="sy" style="flex:0 0 auto" hidden>↻ Sync shop catalog</button><button id="cf" style="flex:0 0 auto" hidden>⚙ Shop settings</button><button id="no" class="p" style="flex:0 0 auto">+ New order</button><button id="op" style="flex:0 0 auto">🌐 Open shop</button></div>
<div class="fl2" id="fl"></div><div id="ls"></div></main>
<dialog id="cd"><form class="g" id="cfm"><h2>Shop settings</h2><div><label>Delivery fee</label><input name="fee" type="number" min="0" step="1"></div><div><label>Free delivery from (0 = never)</label><input name="freeOver" type="number" min="0" step="1"></div><div><label>Currency label</label><input name="currency"></div><div><label>Shop phone</label><input name="phone"></div><div><label>WhatsApp number</label><input name="whatsapp" placeholder="213562716304"></div><div><label>Address</label><input name="address"></div><div><label>Announcement bar (EN)</label><input name="announce"></div><div><label>Announcement (FR)</label><input name="announceFr"></div><div><label>Announcement (AR)</label><input name="announceAr"></div><div><label><input type="checkbox" name="pickup" style="width:auto"> Allow pickup at workshop</label></div><div><label><input type="checkbox" name="gg" style="width:auto"> Show “Continue with Facebook” (enable Facebook in Firebase first)</label></div><div><label><input type="checkbox" name="all" style="width:auto"> Also list stock that has no catalog details yet (basic listing)</label></div><div class="fa"><button type="button" id="cc">Cancel</button><button class="p">Save</button></div></form></dialog>
<dialog id="ed" class="big"><form class="g" id="ef"><h2 id="eh">Edit order</h2>
<div class="g2e"><div><label>Customer name *</label><input name="name" required></div><div><label>Phone *</label><input name="phone" required></div><div><label>Email</label><input name="email" type="email"></div><div><label>Delivery</label><select name="del"><option value="home">Home delivery</option><option value="pickup">Pickup at workshop</option></select></div><div><label>Wilaya</label><input name="wilaya"></div><div><label>City / commune</label><input name="city"></div><div style="grid-column:1/-1"><label>Address</label><input name="street"></div><div style="grid-column:1/-1"><label>Customer notes</label><input name="notes"></div></div>
<h3 style="margin:10px 0 4px">Items</h3><div id="el"></div><div style="position:relative"><input id="es" placeholder="＋ Add an item: search name or reference…" autocomplete="off"><div id="er" class="sr"></div></div>
<div class="g2e" style="margin-top:8px"><div><label>Delivery fee</label><input name="fee" type="number" min="0" step="1"></div><div style="align-self:end;text-align:end"><span id="et" style="font-size:18px;font-weight:800"></span></div></div>
<div><label>Message shown to the customer on the tracking page (what changed and why)</label><textarea name="note" rows="2" placeholder="e.g. The screen you ordered is out of stock — removed as agreed by phone."></textarea><div class="chp"><button type="button" data-n="An item was out of stock and has been removed, as agreed with you by phone.">Item removed</button><button type="button" data-n="Quantity updated according to our stock, as agreed with you by phone.">Quantity changed</button><button type="button" data-n="Order updated as agreed with you by phone.">Updated by phone</button></div></div>
<div class="fa"><button type="button" id="ec">Cancel</button><button class="p" id="esv">Save changes</button></div></form></dialog>
<dialog id="tkd"><form class="g" id="tkf"><h2>Mark as sent</h2><div><label>Carrier</label><select name="carrier"><option>Yalidine</option><option>ZR Express</option><option>Procolis</option><option>Maystro</option><option>Algérie Poste</option><option>Other</option></select></div><div><label>Tracking number *</label><input name="tn" required></div><div class="fa"><button type="button" id="tc">Cancel</button><button class="p">Mark as sent</button></div></form></dialog>
<script type="module">
import {$,esc,db,start,money,moveStock,logAudit,user,role,hit,listNav} from "./common.js?v=42";
import {syncAll} from "./shopsync.js?v=30";
import {collection,onSnapshot,doc,updateDoc,setDoc,getDoc,getDocs,deleteDoc,arrayUnion,serverTimestamp,query,orderBy,limit} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const ST=['new','confirmed','waiting','processing','shipped','delivered','cancelled'],LB={new:'New',confirmed:'Confirmed',waiting:'Waiting for stock',processing:'Preparing',shipped:'Sent',delivered:'Delivered',cancelled:'Cancelled'};let O=[],F='new',shop={},seen=null,tkc=null;
start(()=>{if(role==='admin'){$('sy').hidden=false;$('cf').hidden=false;getDocs(query(collection(db,'shopItems'),limit(1))).then(async r=>{if(r.empty){const b=$('sy');b.disabled=true;b.textContent='Publishing your stock to the shop…';try{const n=await syncAll(true,k=>b.textContent='Publishing… '+k);alert(n+' items are now on the online shop.')}catch(x){alert('Shop publish failed: '+x.message+'\nPublish the new firestore.rules first.')}b.disabled=false;b.textContent='↻ Sync shop catalog'}}).catch(()=>{})}
 onSnapshot(query(collection(db,'orders'),orderBy('createdAt','desc'),limit(300)),s=>{const prev=new Set(O.map(o=>o.code));O=s.docs.map(d=>({...d.data(),code:d.id}));if(seen&&O.some(o=>o.status==='new'&&!prev.has(o.code))){beep();document.title='🔔 New order!'}seen=true;draw()});
 onSnapshot(doc(db,'shopPublic','config'),s=>{shop=s.data()||{}},()=>{})});
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();setTimeout(()=>{o.stop();c.close()},300)}catch(e){}}
function draw(){const q=$('q').value.toLowerCase(),cnt=s=>O.filter(o=>o.status===s).length;
 $('fl').innerHTML=ST.map(s=>`<button data-s="${s}" class="${F===s?'on':''}">${LB[s]}<b>${cnt(s)}</b></button>`).join('')+`<button data-s="" class="${F===''?'on':''}">All<b>${O.length}</b></button>`;
 $('fl').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{F=b.dataset.s;draw()});
 const L=O.filter(o=>(!F||o.status===F)&&(!q||hit(JSON.stringify([o.code,o.customer,o.address]).toLowerCase(),q)));
 $('ls').innerHTML=L.map(o=>{const c=o.customer||{},a=o.address||{},d=o.createdAt?.toDate?.().toLocaleString()||'',wa=(c.phone||'').replace(/\D/g,'').replace(/^0/,'213');
  return `<div class="oc ${o.status==='new'?'nw':''}"><div class="t"><div><b>${esc(o.code)}</b> <small>· ${d}</small></div><span class="sp ${o.status}">${LB[o.status]}</span></div>
  <div><b>${esc(c.name)}</b> · <a href="tel:${esc(c.phone)}">📞 ${esc(c.phone)}</a> · <a href="https://wa.me/${wa}" target="_blank" rel="noopener">WhatsApp</a>${c.email?' · '+esc(c.email):''}${o.uid?' · <small>account</small>':' · <small>guest</small>'}<br><small>${o.delivery==='pickup'?'Pickup at workshop':'🚚 '+esc([a.street,a.city,a.wilaya].filter(Boolean).join(', '))}${o.notes?' · “'+esc(o.notes)+'”':''}</small></div>
  <div>${(o.items||[]).map(x=>`<div class="ln2"><span>${esc(x.title)} × ${x.qty} <small>(${esc(x.sid)})</small></span><span>${money(x.price*x.qty)}</span></div>`).join('')}</div>
  <div class="t"><span>Delivery ${o.fee?money(o.fee):'free'} · <b>Total ${money(o.total)}</b> · cash on delivery</span>${o.trackingNumber?`<span>📦 ${esc(o.carrier||'')} <b>${esc(o.trackingNumber)}</b></span>`:''}</div><div class="wr" data-w="${o.code}"></div><div class="ac">${acts(o)}</div></div>`}).join('')||'<p style="color:var(--mut)">Nothing to show.</p>';
 $('ls').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.c,b.dataset.a));if(F==='new'||F==='confirmed')check(L)}
const rnd=n=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint8Array(n));return [...r].map(x=>a[x%a.length]).join('')};
const btn=(o,a,l,p)=>`<button ${p?'class="p"':''} data-c="${o.code}" data-a="${a}">${l}</button>`;
function acts(o){const s=o.status;return (['new','waiting'].includes(s)?btn(o,'confirm','✓ Confirmed by phone',1):'')+(['new','confirmed'].includes(s)?btn(o,'wait','⏸ Waiting for stock'):'')+(s!=='cancelled'?btn(o,'edit','✎ Edit order'):'')+(s==='confirmed'?btn(o,'process','Start preparing (reserve stock)',1):'')+(s==='processing'?btn(o,'ship','📦 Add tracking → Mark as sent',1):'')+(s==='shipped'?btn(o,'deliver','✓ Delivered',1)+btn(o,'ship','Edit tracking'):'')+(['new','confirmed','waiting','processing'].includes(s)?btn(o,'cancel','Cancel'):'')+(role==='manager'||role==='admin'?btn(o,'del','🗑 Delete'):'')}
async function check(L){for(const o of L){const w=document.querySelector(`[data-w="${o.code}"]`);if(!w||w.dataset.d)continue;w.dataset.d=1;const bad=[];for(const x of o.items||[]){try{const s=await getDoc(doc(db,'shopItems',x.id));if(!s.exists())bad.push(x.title+': no longer listed');else{const i=s.data();if(i.price!==x.price)bad.push(`${x.title}: price now ${money(i.price)} (ordered at ${money(x.price)})`);if(i.qty<x.qty&&['new','confirmed'].includes(o.status))bad.push(`${x.title}: only ${i.qty} in stock`)}}catch(e){}}w.innerHTML=bad.map(b=>'⚠ '+esc(b)).join('<br>')}}
async function set(o,s,extra={}){const h={s,t:Date.now(),by:user.email},d={status:s,history:arrayUnion(h),updatedAt:serverTimestamp(),...extra};await updateDoc(doc(db,'orders',o.code),d);await setDoc(doc(db,'orderTrack',o.code),{status:s,history:arrayUnion(h),...(extra.modNote!==undefined?{modNote:extra.modNote}:{}),...(extra.trackingNumber!==undefined?{trackingNumber:extra.trackingNumber,carrier:extra.carrier||''}:{})},{merge:true});logAudit('order.'+s,o.code)}
async function act(code,a){const o=O.find(x=>x.code===code);if(!o)return;
 try{if(a==='confirm'){await set(o,'confirmed',{confirmedBy:user.email})}
  else if(a==='process'){const done=[];try{for(const x of o.items){await moveStock(x.sid,-x.qty,'out',o.code,'Online order',x.src);done.push(x)}}catch(e){for(const x of done)try{await moveStock(x.sid,x.qty,'in',o.code,'Rollback',x.src)}catch(_){}throw e}await set(o,'processing',{stockDeducted:true})}
  else if(a==='ship'){tkc=o;$('tkf').tn.value=o.trackingNumber||'';$('tkf').carrier.value=o.carrier||'Yalidine';$('tkd').showModal()}
  else if(a==='deliver'){await set(o,'delivered')}
  else if(a==='wait'){const n=prompt('Message for the customer (optional) — e.g. “waiting for the part to be restocked”','');if(n===null)return;await set(o,'waiting',{modNote:n||o.modNote||''})}
  else if(a==='edit'){openEdit(o)}
  else if(a==='del'){if(!confirm('Delete order '+o.code+' permanently? This cannot be undone.'))return;if(o.stockDeducted)for(const x of o.items)await moveStock(x.sid,x.qty,'in',o.code,'Order deleted',x.src);await deleteDoc(doc(db,'orders',o.code));try{await deleteDoc(doc(db,'orderTrack',o.code))}catch(e){}logAudit('order.delete',o.code)}
  else if(a==='cancel'){if(!confirm('Cancel order '+o.code+'?'))return;if(o.stockDeducted)for(const x of o.items)await moveStock(x.sid,x.qty,'in',o.code,'Order cancelled',x.src);await set(o,'cancelled',{stockDeducted:false})}}
 catch(e){alert(e.message)}}
$('tkf').onsubmit=async e=>{e.preventDefault();const f=e.target;try{await set(tkc,'shipped',{trackingNumber:f.tn.value.trim(),carrier:f.carrier.value});$('tkd').close()}catch(x){alert(x.message)}};$('tc').onclick=()=>$('tkd').close();
$('q').oninput=draw;$('op').onclick=()=>window.open('shop.html','_blank');
$('cf').onclick=()=>{const f=$('cfm'),c={fee:600,freeOver:0,currency:'DA',pickup:true,...shop};['fee','freeOver','currency','phone','whatsapp','address','announce','announceFr','announceAr'].forEach(k=>f[k].value=c[k]??'');f.pickup.checked=c.pickup!==false;f.all.checked=c.listAll!==false;f.gg.checked=!!c.authFacebook;$('cd').showModal()};$('cc').onclick=()=>$('cd').close();
$('cfm').onsubmit=async e=>{e.preventDefault();const f=e.target,v=Object.fromEntries(new FormData(f));try{await setDoc(doc(db,'shopPublic','config'),{fee:+v.fee||0,freeOver:+v.freeOver||0,currency:v.currency||'DA',phone:v.phone,whatsapp:v.whatsapp,address:v.address,announce:v.announce,announceFr:v.announceFr,announceAr:v.announceAr,pickup:f.pickup.checked,listAll:f.all.checked,authFacebook:f.gg.checked},{merge:true});logAudit('shop.config','');$('cd').close()}catch(x){alert(x.message)}};
$('sy').onclick=async()=>{const b=$('sy');b.disabled=true;b.textContent='Syncing…';try{const n=await syncAll(shop.listAll!==false,k=>b.textContent='Syncing… '+k);alert(n+' items are now on the shop.')}catch(x){alert(x.message)}b.disabled=false;b.textContent='↻ Sync shop catalog'};

/* ---- edit / create order ---- */
let EO=null,EL=[],CAT=null;
async function catalog(){if(!CAT){const r=await getDocs(collection(db,'shopItems'));CAT=r.docs.map(d=>({...d.data(),id:d.id}))}return CAT}
const feeFor=(del,sub)=>del==='pickup'||(+shop.freeOver>0&&sub>=+shop.freeOver)?0:(shop.fee??600);
function openEdit(o){EO=o||null;const f=$('ef');f.reset();$('eh').textContent=o?'Edit order '+o.code:'New order (phone / walk-in)';const c=(o&&o.customer)||{},a=(o&&o.address)||{};f.name.value=c.name||'';f.phone.value=c.phone||'';f.email.value=c.email||'';f.del.value=(o&&o.delivery)||'home';f.wilaya.value=a.wilaya||'';f.city.value=a.city||'';f.street.value=a.street||'';f.notes.value=(o&&o.notes)||'';f.fee.value=o?o.fee:feeFor('home',0);f.note.value='';EL=((o&&o.items)||[]).map(x=>({...x}));$('es').value='';$('er').style.display='none';drawEl();$('ed').showModal()}
function drawEl(){$('el').innerHTML=EL.map((x,i)=>`<div class="el"><span>${esc(x.title)}<br><small>${esc(x.sid)}</small></span><input type="number" min="0" step="1" value="${x.price}" data-p="${i}" title="Unit price"><input type="number" min="1" step="1" value="${x.qty}" data-q="${i}" title="Quantity"><button type="button" data-x="${i}" title="Remove from the order">✕</button></div>`).join('')||'<p style="color:var(--mut)">No items. Add one below.</p>';
 $('el').querySelectorAll('[data-p]').forEach(e=>e.oninput=()=>{EL[+e.dataset.p].price=+e.value||0;tot()});$('el').querySelectorAll('[data-q]').forEach(e=>e.oninput=()=>{EL[+e.dataset.q].qty=Math.max(1,Math.floor(+e.value||1));tot()});$('el').querySelectorAll('[data-x]').forEach(e=>e.onclick=()=>{EL.splice(+e.dataset.x,1);drawEl()});tot()}
const sub=()=>EL.reduce((a,x)=>a+x.price*x.qty,0);function tot(){$('et').textContent='Total '+money(sub()+(+$('ef').fee.value||0))}
$('ef').fee.oninput=tot;$('ef').del.onchange=()=>{$('ef').fee.value=feeFor($('ef').del.value,sub());tot()};
$('es').oninput=async()=>{const q=$('es').value.trim().toLowerCase(),r=$('er');if(q.length<2){r.style.display='none';return}const L=(await catalog()).filter(i=>hit((i.title+' '+i.sid+' '+(i.brand||'')+' '+(i.model||'')).toLowerCase(),q)).slice(0,10);r.innerHTML=L.map(i=>`<div data-i="${esc(i.id)}"><span>${esc(i.title)} <small>(${esc(i.sid)})</small></span><span>${money(i.price)} · ${i.qty} in stock</span></div>`).join('')||'<div>No match</div>';r.style.display='block';r.querySelectorAll('[data-i]').forEach(d=>d.onclick=()=>{const i=CAT.find(x=>x.id===d.dataset.i),e=EL.find(x=>x.id===i.id);if(e)e.qty++;else EL.push({id:i.id,src:i.src,sid:i.sid,title:i.title,price:i.price,qty:1});$('es').value='';r.style.display='none';drawEl()})};
document.querySelectorAll('.chp [data-n]').forEach(b=>b.onclick=()=>$('ef').note.value=b.dataset.n);$('ec').onclick=()=>$('ed').close();$('no').onclick=()=>openEdit(null);
$('ef').onsubmit=async e=>{e.preventDefault();const f=e.target;if(!EL.length){alert('Add at least one item (or cancel the order).');return}const b=$('esv');b.disabled=true;
 try{const sb=sub(),fee=+f.fee.value||0,cu={name:f.name.value.trim(),phone:f.phone.value.trim(),email:f.email.value.trim()},ad=f.del.value==='pickup'?{wilaya:'',city:'',street:''}:{wilaya:f.wilaya.value.trim(),city:f.city.value.trim(),street:f.street.value.trim()},items=EL.map(x=>({id:x.id,src:x.src,sid:x.sid,title:x.title,price:+x.price||0,qty:x.qty})),note=f.note.value.trim();
  if(!EO){const code='MR-'+rnd(8),h={s:'new',t:Date.now(),by:user.email,note:'Created by staff'};await setDoc(doc(db,'orders',code),{code,customer:cu,address:ad,delivery:f.del.value,notes:f.notes.value.trim(),items,subtotal:sb,fee,total:sb+fee,status:'new',payment:'cod',createdAt:serverTimestamp(),history:[h],lang:'fr',source:'staff'});await setDoc(doc(db,'orderTrack',code),{code,status:'new',name:cu.name.split(' ')[0],items:items.map(x=>({title:x.title,qty:x.qty,price:x.price})),total:sb+fee,delivery:f.del.value,createdAt:serverTimestamp(),history:[h]});logAudit('order.create',code)}
  else{const o=EO;if(o.stockDeducted){const m=new Map();(o.items||[]).forEach(x=>m.set(x.id,{...x,d:+x.qty}));items.forEach(x=>{const e=m.get(x.id);if(e)e.d-=x.qty;else m.set(x.id,{...x,d:-x.qty})});for(const x of m.values()){if(x.d>0)await moveStock(x.sid,x.d,'in',o.code,'Order edited',x.src);else if(x.d<0)await moveStock(x.sid,x.d,'out',o.code,'Order edited',x.src)}}
   const changed=JSON.stringify((o.items||[]).map(x=>[x.id,x.qty,x.price]))!==JSON.stringify(items.map(x=>[x.id,x.qty,x.price]))||fee!==o.fee,h={s:'modified',t:Date.now(),by:user.email,note},d={customer:cu,address:ad,delivery:f.del.value,notes:f.notes.value.trim(),items,subtotal:sb,fee,total:sb+fee,updatedAt:serverTimestamp()};
   if(changed||note){d.modified=true;d.modNote=note||o.modNote||'';d.modAt=Date.now();d.history=arrayUnion(h);if(!o.origItems)d.origItems=o.items||[]}
   await updateDoc(doc(db,'orders',o.code),d);const t={items:items.map(x=>({title:x.title,qty:x.qty,price:x.price})),total:sb+fee,delivery:f.del.value,name:cu.name.split(' ')[0]};if(d.modified){t.modified=true;t.modNote=d.modNote;t.modAt=d.modAt;t.history=arrayUnion(h)}await setDoc(doc(db,'orderTrack',o.code),t,{merge:true});logAudit('order.edit',o.code)}
  $('ed').close()}catch(x){alert(x.message)}b.disabled=false};
listNav('es','#er>div[data-i]');
</script></body></html>
