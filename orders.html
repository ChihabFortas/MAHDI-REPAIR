<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mahdi Repair – Online orders</title>
<link rel="stylesheet" href="common.css?v=24"><style>#tabs{display:none!important}
.fl2{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.fl2 button{border-radius:99px;padding:7px 14px}.fl2 button.on{background:var(--ac);color:#fff;border-color:var(--ac)}.fl2 b{margin-inline-start:6px;opacity:.8}
.oc{display:grid;gap:8px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:10px}.oc.nw{border-color:var(--ac);box-shadow:0 0 0 2px color-mix(in srgb,var(--ac) 25%,transparent)}.oc .t{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}.oc small{color:var(--mut)}.oc .ac{display:flex;gap:8px;flex-wrap:wrap}
.sp{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--ac) 16%,transparent)}.sp.shipped,.sp.delivered{background:#16a34a22;color:#16a34a}.sp.cancelled{background:#e5484d22;color:#e5484d}.wr{color:#d97706;font-weight:600;font-size:13px}
.ln2{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:3px 0;border-bottom:1px dashed var(--line)}dialog.big{width:min(680px,96vw)}</style></head><body>
<header><h1>Mahdi Repair – Online orders</h1><button onclick="location.href='dashboard.html'">Dashboard</button><button id="lo">Sign out</button></header>
<main><div class="bar"><input id="q" placeholder="Search code, name, phone…"><button id="sy" style="flex:0 0 auto" hidden>↻ Sync shop catalog</button><button id="cf" style="flex:0 0 auto" hidden>⚙ Shop settings</button><button id="op" style="flex:0 0 auto">🌐 Open shop</button></div>
<div class="fl2" id="fl"></div><div id="ls"></div></main>
<dialog id="cd"><form class="g" id="cfm"><h2>Shop settings</h2><div><label>Delivery fee</label><input name="fee" type="number" min="0" step="1"></div><div><label>Free delivery from (0 = never)</label><input name="freeOver" type="number" min="0" step="1"></div><div><label>Currency label</label><input name="currency"></div><div><label>Shop phone</label><input name="phone"></div><div><label>WhatsApp number</label><input name="whatsapp" placeholder="213562716304"></div><div><label>Address</label><input name="address"></div><div><label>Announcement bar (EN)</label><input name="announce"></div><div><label>Announcement (FR)</label><input name="announceFr"></div><div><label>Announcement (AR)</label><input name="announceAr"></div><div><label><input type="checkbox" name="pickup" style="width:auto"> Allow pickup at workshop</label></div><div><label><input type="checkbox" name="all" style="width:auto"> Also list stock that has no catalog details yet (basic listing)</label></div><div class="fa"><button type="button" id="cc">Cancel</button><button class="p">Save</button></div></form></dialog>
<dialog id="tkd"><form class="g" id="tkf"><h2>Mark as sent</h2><div><label>Carrier</label><select name="carrier"><option>Yalidine</option><option>ZR Express</option><option>Procolis</option><option>Maystro</option><option>Algérie Poste</option><option>Other</option></select></div><div><label>Tracking number *</label><input name="tn" required></div><div class="fa"><button type="button" id="tc">Cancel</button><button class="p">Mark as sent</button></div></form></dialog>
<script type="module">
import {$,esc,db,start,money,moveStock,logAudit,user,role} from "./common.js?v=30";
import {syncAll} from "./shopsync.js?v=30";
import {collection,onSnapshot,doc,updateDoc,setDoc,getDoc,arrayUnion,serverTimestamp,query,orderBy,limit} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const ST=['new','confirmed','processing','shipped','delivered','cancelled'],LB={new:'New',confirmed:'Confirmed',processing:'Preparing',shipped:'Sent',delivered:'Delivered',cancelled:'Cancelled'};let O=[],F='new',shop={},seen=null,tkc=null;
start(()=>{if(role==='admin'){$('sy').hidden=false;$('cf').hidden=false}
 onSnapshot(query(collection(db,'orders'),orderBy('createdAt','desc'),limit(300)),s=>{const prev=new Set(O.map(o=>o.code));O=s.docs.map(d=>({...d.data(),code:d.id}));if(seen&&O.some(o=>o.status==='new'&&!prev.has(o.code))){beep();document.title='🔔 New order!'}seen=true;draw()});
 onSnapshot(doc(db,'shopPublic','config'),s=>{shop=s.data()||{}},()=>{})});
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();setTimeout(()=>{o.stop();c.close()},300)}catch(e){}}
function draw(){const q=$('q').value.toLowerCase(),cnt=s=>O.filter(o=>o.status===s).length;
 $('fl').innerHTML=ST.map(s=>`<button data-s="${s}" class="${F===s?'on':''}">${LB[s]}<b>${cnt(s)}</b></button>`).join('')+`<button data-s="" class="${F===''?'on':''}">All<b>${O.length}</b></button>`;
 $('fl').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{F=b.dataset.s;draw()});
 const L=O.filter(o=>(!F||o.status===F)&&(!q||JSON.stringify([o.code,o.customer,o.address]).toLowerCase().includes(q)));
 $('ls').innerHTML=L.map(o=>{const c=o.customer||{},a=o.address||{},d=o.createdAt?.toDate?.().toLocaleString()||'',wa=(c.phone||'').replace(/\D/g,'').replace(/^0/,'213');
  return `<div class="oc ${o.status==='new'?'nw':''}"><div class="t"><div><b>${esc(o.code)}</b> <small>· ${d}</small></div><span class="sp ${o.status}">${LB[o.status]}</span></div>
  <div><b>${esc(c.name)}</b> · <a href="tel:${esc(c.phone)}">📞 ${esc(c.phone)}</a> · <a href="https://wa.me/${wa}" target="_blank" rel="noopener">WhatsApp</a>${c.email?' · '+esc(c.email):''}${o.uid?' · <small>account</small>':' · <small>guest</small>'}<br><small>${o.delivery==='pickup'?'Pickup at workshop':'🚚 '+esc([a.street,a.city,a.wilaya].filter(Boolean).join(', '))}${o.notes?' · “'+esc(o.notes)+'”':''}</small></div>
  <div>${(o.items||[]).map(x=>`<div class="ln2"><span>${esc(x.title)} × ${x.qty} <small>(${esc(x.sid)})</small></span><span>${money(x.price*x.qty)}</span></div>`).join('')}</div>
  <div class="t"><span>Delivery ${o.fee?money(o.fee):'free'} · <b>Total ${money(o.total)}</b> · cash on delivery</span>${o.trackingNumber?`<span>📦 ${esc(o.carrier||'')} <b>${esc(o.trackingNumber)}</b></span>`:''}</div><div class="wr" data-w="${o.code}"></div><div class="ac">${acts(o)}</div></div>`}).join('')||'<p style="color:var(--mut)">Nothing to show.</p>';
 $('ls').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.c,b.dataset.a));if(F==='new'||F==='confirmed')check(L)}
const btn=(o,a,l,p)=>`<button ${p?'class="p"':''} data-c="${o.code}" data-a="${a}">${l}</button>`;
function acts(o){const s=o.status;return (s==='new'?btn(o,'confirm','✓ Confirmed by phone',1):'')+(s==='confirmed'?btn(o,'process','Start preparing (reserve stock)',1):'')+(s==='processing'?btn(o,'ship','📦 Add tracking → Mark as sent',1):'')+(s==='shipped'?btn(o,'deliver','✓ Delivered',1)+btn(o,'ship','Edit tracking'):'')+(['new','confirmed','processing'].includes(s)?btn(o,'cancel','Cancel'):'')}
async function check(L){for(const o of L){const w=document.querySelector(`[data-w="${o.code}"]`);if(!w||w.dataset.d)continue;w.dataset.d=1;const bad=[];for(const x of o.items||[]){try{const s=await getDoc(doc(db,'shopItems',x.id));if(!s.exists())bad.push(x.title+': no longer listed');else{const i=s.data();if(i.price!==x.price)bad.push(`${x.title}: price now ${money(i.price)} (ordered at ${money(x.price)})`);if(i.qty<x.qty&&['new','confirmed'].includes(o.status))bad.push(`${x.title}: only ${i.qty} in stock`)}}catch(e){}}w.innerHTML=bad.map(b=>'⚠ '+esc(b)).join('<br>')}}
async function set(o,s,extra={}){const h={s,t:Date.now(),by:user.email},d={status:s,history:arrayUnion(h),updatedAt:serverTimestamp(),...extra};await updateDoc(doc(db,'orders',o.code),d);await setDoc(doc(db,'orderTrack',o.code),{status:s,history:arrayUnion(h),...(extra.trackingNumber!==undefined?{trackingNumber:extra.trackingNumber,carrier:extra.carrier||''}:{})},{merge:true});logAudit('order.'+s,o.code)}
async function act(code,a){const o=O.find(x=>x.code===code);if(!o)return;
 try{if(a==='confirm'){await set(o,'confirmed',{confirmedBy:user.email})}
  else if(a==='process'){const done=[];try{for(const x of o.items){await moveStock(x.sid,-x.qty,'out',o.code,'Online order',x.src);done.push(x)}}catch(e){for(const x of done)try{await moveStock(x.sid,x.qty,'in',o.code,'Rollback',x.src)}catch(_){}throw e}await set(o,'processing',{stockDeducted:true})}
  else if(a==='ship'){tkc=o;$('tkf').tn.value=o.trackingNumber||'';$('tkf').carrier.value=o.carrier||'Yalidine';$('tkd').showModal()}
  else if(a==='deliver'){await set(o,'delivered')}
  else if(a==='cancel'){if(!confirm('Cancel order '+o.code+'?'))return;if(o.stockDeducted)for(const x of o.items)await moveStock(x.sid,x.qty,'in',o.code,'Order cancelled',x.src);await set(o,'cancelled',{stockDeducted:false})}}
 catch(e){alert(e.message)}}
$('tkf').onsubmit=async e=>{e.preventDefault();const f=e.target;try{await set(tkc,'shipped',{trackingNumber:f.tn.value.trim(),carrier:f.carrier.value});$('tkd').close()}catch(x){alert(x.message)}};$('tc').onclick=()=>$('tkd').close();
$('q').oninput=draw;$('op').onclick=()=>window.open('shop.html','_blank');
$('cf').onclick=()=>{const f=$('cfm'),c={fee:600,freeOver:0,currency:'DA',pickup:true,...shop};['fee','freeOver','currency','phone','whatsapp','address','announce','announceFr','announceAr'].forEach(k=>f[k].value=c[k]??'');f.pickup.checked=c.pickup!==false;f.all.checked=!!c.listAll;$('cd').showModal()};$('cc').onclick=()=>$('cd').close();
$('cfm').onsubmit=async e=>{e.preventDefault();const f=e.target,v=Object.fromEntries(new FormData(f));try{await setDoc(doc(db,'shopPublic','config'),{fee:+v.fee||0,freeOver:+v.freeOver||0,currency:v.currency||'DA',phone:v.phone,whatsapp:v.whatsapp,address:v.address,announce:v.announce,announceFr:v.announceFr,announceAr:v.announceAr,pickup:f.pickup.checked,listAll:f.all.checked},{merge:true});logAudit('shop.config','');$('cd').close()}catch(x){alert(x.message)}};
$('sy').onclick=async()=>{const b=$('sy');b.disabled=true;b.textContent='Syncing…';try{const n=await syncAll(!!shop.listAll,k=>b.textContent='Syncing… '+k);alert(n+' items are now on the shop.')}catch(x){alert(x.message)}b.disabled=false;b.textContent='↻ Sync shop catalog'};
</script></body></html>
