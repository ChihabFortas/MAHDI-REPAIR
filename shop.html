<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mahdi Repair – Shop</title><meta name="theme-color" content="#050708">
<link rel="icon" href="logo.png">
<style>
:root{--bg:#f6f8fa;--card:#fff;--ink:#0b1217;--mut:#5d6c77;--line:#e3e9ee;--ac:#1c93c2;--ac2:#0f6f96;--ok:#16a34a;--bad:#e5484d;--warn:#f59e0b;--sh:0 1px 2px #0001,0 8px 24px #0b121710;--r:18px}
[data-t=dark]{--bg:#07090b;--card:#0f1418;--ink:#eef4f8;--mut:#8fa2ae;--line:#1c262d;--sh:0 1px 2px #0008,0 8px 30px #0006}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}img{max-width:100%}
button{cursor:pointer}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600;transition:.18s}.btn:hover{transform:translateY(-1px);box-shadow:var(--sh)}
.btn.p{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-color:transparent}.btn.dk{background:#fff;color:#000;border-color:#fff}.btn.sm{padding:8px 14px;font-size:14px}.btn[disabled]{opacity:.5;pointer-events:none}
input,select,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);outline:none}input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px #1c93c233}
label{font-size:13px;color:var(--mut);display:block;margin:0 0 4px}.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
/* header */
.ann{background:#050708;color:#cfe9f5;text-align:center;font-size:13px;padding:7px 12px}.ann:empty{display:none}
header.hd{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px);border-bottom:1px solid var(--line)}
.hd .in{display:flex;align-items:center;gap:14px;height:68px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:.2px}.brand img{width:40px;height:40px;border-radius:10px}
.sb{position:relative;flex:1;max-width:560px;margin-inline:auto}.sb input{padding-inline-start:44px;border-radius:999px;height:46px;background:color-mix(in srgb,var(--ink) 5%,var(--card))}.sb svg{position:absolute;inset-inline-start:15px;top:13px;width:20px;height:20px;color:var(--mut)}
.sg{position:absolute;top:52px;inset-inline:0;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);overflow:hidden;display:none;z-index:50}.sg.on{display:block}.sg a{display:flex;gap:10px;align-items:center;padding:9px 14px}.sg a:hover{background:color-mix(in srgb,var(--ac) 10%,transparent)}.sg img{width:38px;height:38px;object-fit:contain;border-radius:8px;background:#fff}.sg small{color:var(--mut)}
.ic{position:relative;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}.ic svg{width:21px;height:21px}.ic b{position:absolute;top:-4px;inset-inline-end:-4px;background:var(--ac);color:#fff;font-size:11px;min-width:19px;height:19px;border-radius:99px;display:grid;place-items:center;padding:0 4px}
.nav2{display:flex;gap:4px;font-weight:600;font-size:15px}.nav2 a{padding:8px 12px;border-radius:99px}.nav2 a:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
select.lg{width:auto;padding:9px 10px;border-radius:99px;height:44px}
/* hero */
.hero{position:relative;overflow:hidden;background:#050708;color:#fff;border-radius:0 0 36px 36px}.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(700px 420px at 85% 10%,#1c93c255,transparent 60%),radial-gradient(500px 360px at 5% 90%,#7c3aed33,transparent 60%)}
.hero .in{position:relative;display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;padding-block:64px 72px}.hero h1{font-size:clamp(36px,6vw,68px);line-height:1.02;margin:12px 0 16px;letter-spacing:-1.5px}.hero h1 em{font-style:normal;background:linear-gradient(90deg,#5cc8f2,#1c93c2 50%,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:#aebdc7;font-size:18px;max-width:520px}.pill{display:inline-flex;gap:8px;align-items:center;padding:6px 14px;border-radius:99px;border:1px solid #ffffff2a;background:#ffffff10;font-size:13px;color:#cfe9f5}.hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.hv{position:relative;aspect-ratio:1;max-width:460px;margin-inline:auto;width:100%}.hv .lg2{position:absolute;inset:6%;border-radius:36px;background:url(logo.png) center/cover;box-shadow:0 30px 80px #1c93c244;transform:rotate(-4deg)}.hv .fc{position:absolute;background:#ffffff14;border:1px solid #ffffff2a;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:16px;padding:10px 14px;font-size:13px;font-weight:600;animation:fl 5s ease-in-out infinite}.hv .fc:nth-child(2){top:6%;inset-inline-end:-2%}.hv .fc:nth-child(3){bottom:12%;inset-inline-start:-4%;animation-delay:1.5s}.hv .fc:nth-child(4){bottom:-2%;inset-inline-end:8%;animation-delay:3s}@keyframes fl{50%{transform:translateY(-10px)}}
/* sections */
section.s{padding:56px 0 8px}.sh{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:20px}.sh h2{margin:0;font-size:28px;letter-spacing:-.5px}.sh a{color:var(--ac);font-weight:600}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}.cat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 16px;display:grid;gap:8px;transition:.2s;position:relative;overflow:hidden}.cat:hover{transform:translateY(-4px);box-shadow:var(--sh);border-color:var(--ac)}.cat i{font-style:normal;font-size:34px}.cat b{font-size:16px}.cat small{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:.2s;position:relative}.card:hover{transform:translateY(-4px);box-shadow:var(--sh)}
.card .im{aspect-ratio:1;background:#fff;display:grid;place-items:center;position:relative;overflow:hidden}[data-t=dark] .card .im{background:#e9eff3}.card .im img{width:100%;height:100%;object-fit:contain;transition:.3s}.card:hover .im img{transform:scale(1.06)}.card .im .ph{font-size:56px}
.bd{position:absolute;top:10px;inset-inline-start:10px;background:#050708;color:#fff;font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px;letter-spacing:.3px}.bd.lo{background:var(--warn);color:#111}.bd.so{background:#6b7780}
.card .bx{padding:14px;display:flex;flex-direction:column;gap:4px;flex:1}.card small{color:var(--mut);font-size:12.5px}.card h3{margin:0;font-size:15px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.card .pr{font-weight:800;font-size:18px;margin-top:auto;padding-top:8px;display:flex;justify-content:space-between;align-items:center}.card .add{width:40px;height:40px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:22px;line-height:1;display:grid;place-items:center}.card .add:hover{background:var(--ac);color:#fff}
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.prop{padding:22px;border-radius:var(--r);background:var(--card);border:1px solid var(--line)}.prop i{font-style:normal;font-size:28px}.prop h4{margin:8px 0 4px}.prop p{margin:0;color:var(--mut);font-size:14px}
.bnr{margin-top:56px;border-radius:28px;background:linear-gradient(135deg,#050708,#0f3a4d);color:#fff;padding:40px;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}.bnr h2{margin:0 0 6px;font-size:28px}.bnr p{margin:0;color:#aebdc7}
.brs{display:flex;gap:10px;flex-wrap:wrap}.chip{padding:9px 16px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px}.chip:hover,.chip.on{border-color:var(--ac);color:var(--ac)}
/* catalog */
.cl{display:grid;grid-template-columns:260px 1fr;gap:26px;padding:28px 0}.fl{position:sticky;top:90px;align-self:start;display:grid;gap:18px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}.fl h4{margin:0 0 8px;font-size:14px}.fl .opt{display:flex;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:10px;cursor:pointer;font-size:14.5px}.fl .opt:hover{background:color-mix(in srgb,var(--ac) 9%,transparent)}.fl .opt.on{background:color-mix(in srgb,var(--ac) 16%,transparent);font-weight:700}.fl .opt small{color:var(--mut)}
.tb{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}.tb h1{margin:0;font-size:26px}.tb select{width:auto}.fb{display:none}
.crumb{font-size:13px;color:var(--mut);margin:20px 0 0}.crumb a:hover{color:var(--ac)}
/* product */
.pd{display:grid;grid-template-columns:1.05fr 1fr;gap:40px;padding:20px 0 40px}.gal .mn{aspect-ratio:1;background:#fff;border-radius:var(--r);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}.gal .mn img{width:100%;height:100%;object-fit:contain}.gal .th{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}.gal .th img{width:68px;height:68px;object-fit:contain;background:#fff;border:2px solid var(--line);border-radius:12px;cursor:pointer}.gal .th img.on{border-color:var(--ac)}
.pd h1{font-size:32px;line-height:1.15;margin:6px 0 8px;letter-spacing:-.5px}.pd .pp{font-size:34px;font-weight:800;margin:10px 0}.stk{display:inline-flex;gap:6px;align-items:center;font-size:14px;font-weight:600}.stk:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--ok)}.stk.lo:before{background:var(--warn)}.stk.so:before{background:var(--bad)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:99px;background:var(--card)}.qty button{width:42px;height:44px;border:0;background:none;font-size:20px}.qty span{min-width:30px;text-align:center;font-weight:700}
.tbl{width:100%;border-collapse:collapse;margin-top:14px}.tbl td{padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}.tbl td:first-child{color:var(--mut);width:36%}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips span{padding:4px 11px;border-radius:99px;background:color-mix(in srgb,var(--ac) 12%,transparent);font-size:13px}
/* drawer / modal */
.ov{position:fixed;inset:0;background:#0009;z-index:80;opacity:0;pointer-events:none;transition:.2s}.ov.on{opacity:1;pointer-events:auto}
.dr{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(440px,100%);background:var(--card);z-index:90;transform:translateX(105%);transition:.28s;display:flex;flex-direction:column;box-shadow:var(--sh)}[dir=rtl] .dr{transform:translateX(-105%)}.dr.on{transform:none}
.dr .h{padding:18px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.dr .h b{font-size:18px}.dr .bd2{flex:1;overflow:auto;padding:8px 20px}.dr .ft{padding:16px 20px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:grid;gap:10px}
.ln{display:grid;grid-template-columns:64px 1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}.ln img{width:64px;height:64px;object-fit:contain;background:#fff;border-radius:12px;border:1px solid var(--line)}.ln b{font-size:14.5px;display:block;line-height:1.25}.ln .qty{transform:scale(.8);transform-origin:start}.ln .rm{border:0;background:none;color:var(--mut);font-size:13px;padding:0}
.row{display:flex;justify-content:space-between;gap:10px}.tot{font-size:20px;font-weight:800}
dialog{border:0;border-radius:24px;padding:0;background:var(--card);color:var(--ink);width:min(440px,calc(100% - 24px));box-shadow:0 30px 90px #000a}dialog::backdrop{background:#000a;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}dialog .m{padding:26px;display:grid;gap:12px}
.tabs2{display:flex;background:color-mix(in srgb,var(--ink) 7%,transparent);border-radius:99px;padding:4px}.tabs2 button{flex:1;border:0;background:none;padding:9px;border-radius:99px;font-weight:600}.tabs2 button.on{background:var(--card);box-shadow:var(--sh)}
/* checkout / account */
.ck{display:grid;grid-template-columns:1.2fr .8fr;gap:26px;padding:26px 0 50px}.bx2{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:grid;gap:14px;align-content:start}.bx2 h3{margin:0}.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g2 .w{grid-column:1/-1}
.opt2{display:flex;gap:10px;align-items:center;padding:14px;border:1.5px solid var(--line);border-radius:14px;cursor:pointer}.opt2.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 8%,transparent)}.opt2 input{width:auto}
.ord{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:18px;display:grid;gap:12px}.ord .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.st{padding:4px 12px;border-radius:99px;font-size:12.5px;font-weight:700;background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac)}.st.shipped,.st.delivered{background:#16a34a22;color:var(--ok)}.st.cancelled{background:#e5484d22;color:var(--bad)}
.tl{display:flex;gap:0;margin:6px 0}.tl div{flex:1;text-align:center;font-size:12px;color:var(--mut);position:relative}.tl div:before{content:"";display:block;width:14px;height:14px;border-radius:50%;background:var(--line);margin:0 auto 6px;position:relative;z-index:1}.tl div:after{content:"";position:absolute;top:6px;inset-inline-start:-50%;width:100%;height:2px;background:var(--line)}.tl div:first-child:after{display:none}.tl .d{color:var(--ink);font-weight:600}.tl .d:before,.tl .d:after{background:var(--ac)}
.trk{background:color-mix(in srgb,var(--ok) 12%,transparent);border-radius:12px;padding:10px 14px;font-weight:600}
.empty{text-align:center;padding:60px 10px;color:var(--mut)}.empty i{font-size:56px;font-style:normal;display:block}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,30px);background:#050708;color:#fff;padding:12px 20px;border-radius:99px;z-index:120;opacity:0;transition:.25s;pointer-events:none;box-shadow:var(--sh)}.toast.on{opacity:1;transform:translate(-50%,0)}
footer{margin-top:60px;background:#050708;color:#aebdc7;padding:44px 0 30px}footer .fg{display:grid;grid-template-columns:2fr 1fr 1fr;gap:30px}footer h4{color:#fff;margin:0 0 10px}footer a{display:block;padding:3px 0}footer a:hover{color:#fff}footer .bb{border-top:1px solid #ffffff1a;margin-top:26px;padding-top:16px;font-size:13px}
.sk{background:linear-gradient(90deg,var(--line),color-mix(in srgb,var(--line) 40%,transparent),var(--line));background-size:200%;animation:sk 1.2s linear infinite;border-radius:var(--r);aspect-ratio:3/4}@keyframes sk{to{background-position:-200% 0}}
@media(max-width:900px){.hero .in{grid-template-columns:1fr;padding-block:40px 48px}.hv{max-width:300px;order:-1}.cl{grid-template-columns:1fr}.fl{position:static;display:none}.fl.on{display:grid}.fb{display:inline-flex}.pd,.ck{grid-template-columns:1fr}.nav2{display:none}footer .fg{grid-template-columns:1fr}.hd .in{gap:8px}.brand span{display:none}.g2{grid-template-columns:1fr}.bnr{padding:26px}}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}.wrap{padding:0 14px}.card .bx{padding:10px}.card h3{font-size:14px}.sh h2{font-size:23px}select.lg{padding:6px}}
</style></head><body>
<div class="ann" id="ann"></div>
<header class="hd"><div class="wrap in"><a href="#/" class="brand"><img src="logo.png" alt=""><span>Mahdi Repair</span></a>
<div class="sb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" autocomplete="off" enterkeyhint="search"><div class="sg" id="sg"></div></div>
<nav class="nav2"><a href="#/shop" data-i="all">All</a><a href="#/track" data-i="track">Track</a></nav>
<select class="lg" id="lg"><option value="en">EN</option><option value="fr">FR</option><option value="ar">AR</option></select>
<button class="ic" id="th" aria-label="theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
<a class="ic" href="#/account" id="ac" aria-label="account"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg></a>
<button class="ic" id="cb" aria-label="cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h15l-2 9H8L6 6zM6 6 5 3H2"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg><b id="cn" hidden>0</b></button></div></header>
<div id="view"></div>
<footer><div class="wrap"><div class="fg"><div><div class="brand" style="color:#fff"><img src="logo.png" alt=""><span style="display:inline">Mahdi Repair</span></div><p id="fa"></p></div><div><h4 id="fh1"></h4><a href="#/shop" id="fl1"></a><a href="#/track" id="fl2"></a><a href="#/account" id="fl3"></a></div><div><h4 id="fh2"></h4><a id="fp"></a><a id="fw"></a><a href="index.html" id="fs"></a></div></div><div class="bb">© <span id="yr"></span> Mahdi Repair</div></div></footer>
<div class="ov" id="ov"></div><aside class="dr" id="dr"></aside>
<dialog id="ad"><div class="m" id="am"></div></dialog><div class="toast" id="ts"></div>
<script type="module" src="shop.js?v=5"></script></body></html>
