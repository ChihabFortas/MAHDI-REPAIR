   return [T('Statement','Supplier statement',[s.name+(s.phone?' · '+s.phone:''),per(o)],['Date','Type','Number','Debit (bought)','Credit (paid / returned)','Balance'],[['','Opening balance','','','',r2(open)],...R.map(r=>{run+=r.debit-r.credit;return [r.d,r.t,r.ref||'',r2(r.debit),r2(r.credit),r2(run)]})],['','Totals for the period','',r2(sum(R,r=>r.debit)),r2(sum(R,r=>r.credit)),r2(run)])]}},
 suppliers:{g:'purchases',icon:'🏭',c:'#d97706',t:'Suppliers & balances',d:'Suppliers with what you bought, paid and still owe them.',

   return [T('Movements','Cash register movements',[per(o)],['Date','Time','Register','In / out','Amount','Source','Reference','Remark','By'],L.map(e=>[e.date,e.time||'',rn(e.registerId),e.kind==='in'?'In':'Out',r2(e.kind==='in'?e.amount:-num(e.amount)),e.source||'',e.ref||'',e.remark||'',e.by||'']),['Total','','','',r2(sum(L,e=>e.kind==='in'?e.amount:-num(e.amount))),'','','','']),

  async run(o){const TK=await load('tickets'),q=S(o.q),tq=S(o.tech),ST={received:'Reception',diagnose:'Diagnose',awaiting_approval:'Waiting approval',waiting_parts:'Waiting parts',repair:'Repair',ready:'Ready',no_repair:'No repair',returned:'Returned'};

const GROUPS=[['','All'],['sales','Sales'],['customers','Customers'],['purchases','Purchases'],['stock','Stock'],['money','Cash'],['repairs','Repairs']];
/* same rules as the Customers and Suppliers pages */
function cLedger(c,D,RT,P){const rows=[];D.filter(d=>OKD(d)&&d.customerId===c._id).forEach(d=>rows.push({k:'inv',d,date:d.date||'',s:sec(d),no:d.no,debit:num(d.total),credit:num(d.paid)}));
 RT.filter(r=>r.kind==='sale'&&r.customerId===c._id).forEach(r=>rows.push({k:'ret',date:r.date||'',s:sec(r),no:r.no,debit:num(r.refund&&r.refund.amount),credit:num(r.total)}));
 P.filter(p=>p.customerId===c._id).forEach(p=>rows.push({k:'pay',date:p.date||'',s:sec(p),no:p.ref||'Payment',debit:0,credit:num(p.amount)}));
 rows.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.s-b.s||({inv:0,ret:1,pay:2}[a.k]-{inv:0,ret:1,pay:2}[b.k]));const bal=rows.reduce((a,r)=>a+r.debit-r.credit,0);
 return {rows,bal,inv:sum(rows.filter(r=>r.k==='inv'),r=>r.debit),ret:sum(rows.filter(r=>r.k==='ret'),r=>r.credit),paid:sum(rows.filter(r=>r.k!=='ret'),r=>r.credit)}}
const mineS=(s,x)=>x.supplierId===s._id||(!x.supplierId&&norm(x.supplierName||x.who)===norm(s.name));
function sLedger(s,RV,PAY,RT){const r=[];RV.filter(x=>mineS(s,x)).forEach(x=>r.push({d:x.date,t:'Receiving note',ref:x.no,debit:num(x.total),credit:0}));PAY.filter(x=>mineS(s,x)).forEach(x=>r.push({d:x.date,t:'Payment',ref:x.ref,debit:0,credit:num(x.amount)}));
 RT.filter(x=>x.kind==='purchase'&&mineS(s,x)).forEach(x=>{r.push({d:x.date,t:'Purchase return',ref:x.no,debit:0,credit:num(x.total)});if(num(x.refund&&x.refund.amount))r.push({d:x.date,t:'Refund received',ref:x.no,debit:num(x.refund.amount),credit:0})});
 r.sort((a,b)=>a.d>b.d?1:-1);return {rows:r,bal:num(s.initial)+r.reduce((a,x)=>a+x.debit-x.credit,0),buy:sum(r.filter(x=>x.t==='Receiving note'),x=>x.debit),paid:sum(r.filter(x=>x.t==='Payment'),x=>x.credit),ret:sum(r.filter(x=>x.t==='Purchase return'),x=>x.credit)}}
const pick=(L,v)=>{v=String(v||'').trim();if(!v)return null;const n=norm(v),d=v.replace(/\D/g,'');return L.find(x=>norm(x.name)===n)||(d.length>=6&&L.find(x=>String(x.phone||'').replace(/\D/g,'').endsWith(d.slice(-9))))||L.find(x=>norm(x.name).includes(n))||null};

const aoa=t=>[[SHOP.name+' — '+t.title],...t.meta.map(m=>[m]),['Exported '+new Date().toLocaleString()],[],t.head,...t.rows,...(t.foot?[[],t.foot]:[])];
const fileName=(k,ext)=>k+'-'+today()+'.'+ext;
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function toCSV(k,tables){const q=v=>{const s=String(v??'');return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};dl(new Blob(['﻿'+tables.map(t=>aoa(t).map(r=>r.map(q).join(',')).join('\r\n')).join('\r\n\r\n')],{type:'text/csv;charset=utf-8'}),fileName(k,'csv'))}
function toXLSX(k,tables){if(!window.XLSX)throw new Error('Excel library not loaded (check the internet connection), use CSV');const wb=XLSX.utils.book_new();
 tables.forEach(t=>{const rows=aoa(t),ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=t.head.map((_,i)=>({wch:Math.min(45,Math.max(8,...[t.head,...t.rows.slice(0,400)].map(r=>String(r[i]??'').length+2)))}));XLSX.utils.book_append_sheet(wb,ws,t.name.slice(0,31))});XLSX.writeFile(wb,fileName(k,'xlsx'))}
/* PDF: pages are laid out in HTML and drawn by the browser (Arabic stays correct), then placed on A4 pages. */
/* each page is drawn by the browser itself (SVG foreignObject), so Arabic is shaped exactly as on screen */
async function snap(el,scale=2){const w=Math.ceil(el.offsetWidth),h=Math.ceil(el.offsetHeight),xml=new XMLSerializer().serializeToString(el),img=new Image();
 img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><foreignObject width="100%" height="100%">${xml}</foreignObject></svg>`);
 await new Promise((ok,ko)=>{img.onload=ok;img.onerror=()=>ko(new Error('Could not draw the PDF page'))});const cv=document.createElement('canvas');cv.width=w*scale;cv.height=h*scale;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.scale(scale,scale);x.drawImage(img,0,0);return cv}
async function toPDF(k,tables){if(!window.jspdf)await loadJS('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
 const land=tables.some(t=>t.head.length>7),W=land?297:210,H=land?210:297,per=land?24:36,pdf=new jspdf.jsPDF({unit:'mm',format:'a4',orientation:land?'landscape':'portrait'});
 const fmt=v=>typeof v==='number'?v.toLocaleString('en-US',{maximumFractionDigits:2}):esc(String(v??'')),num1=v=>typeof v==='number';
 const pages=[];tables.forEach(t=>{for(let i=0;i<Math.max(1,t.rows.length);i+=per)pages.push({t,rows:t.rows.slice(i,i+per),last:i+per>=t.rows.length})});
 const box=document.createElement('div');box.style.cssText=`position:fixed;left:-20000px;top:0;width:${W}mm;background:#fff`;document.body.append(box);
 try{for(let p=0;p<pages.length;p++){const {t,rows,last}=pages[p];
  box.innerHTML=`<div style="width:${W}mm;height:${H}mm;padding:10mm 10mm 8mm;box-sizing:border-box;font:11px/1.35 Tahoma,'Noto Sans Arabic',Arial,sans-serif;color:#111;background:#fff;display:flex;flex-direction:column">
   <div style="display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #111;padding-bottom:5px;margin-bottom:6px"><div><div style="font-size:16px;font-weight:700">${esc(t.title)}</div><div style="color:#444">${t.meta.map(esc).join(' · ')}</div></div><div style="text-align:right"><b>${esc(SHOP.name)}</b><br><span style="color:#555">${new Date().toLocaleString()}</span></div></div>
   <table style="width:100%;border-collapse:collapse"><thead><tr>${t.head.map(h=>`<th style="background:#eef2f6;border:1px solid #c7ced8;padding:4px 5px;text-align:start;font-size:10.5px">${esc(h)}</th>`).join('')}</tr></thead>
   <tbody>${rows.map((r,i)=>`<tr style="background:${i%2?'#fafbfc':'#fff'}">${r.map(v=>`<td dir="auto" style="border:1px solid #dde2e8;padding:3px 5px;${num1(v)?'text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap':''}">${fmt(v)}</td>`).join('')}</tr>`).join('')}
   ${last&&t.foot?`<tr>${t.foot.map(v=>`<td dir="auto" style="border:1px solid #c7ced8;padding:4px 5px;font-weight:700;background:#eef2f6;${num1(v)?'text-align:right;white-space:nowrap':''}">${fmt(v)}</td>`).join('')}</tr>`:''}</tbody></table>
   ${!rows.length?'<p style="color:#666">Nothing for these filters.</p>':''}<div style="margin-top:auto;text-align:center;color:#777;font-size:10px">${esc(t.name)} · page ${p+1} / ${pages.length}</div></div>`;
  const cv=await snap(box.firstElementChild);if(p)pdf.addPage('a4',land?'landscape':'portrait');pdf.addImage(cv.toDataURL('image/jpeg',.92),'JPEG',0,0,W,H)}}
 finally{box.remove()}dl(pdf.output('blob'),fileName(k,'pdf'))}
