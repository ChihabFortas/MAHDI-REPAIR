 $('ch').querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>ask(b.dataset.q))}
const card=c=>{const [ic,nm,col]=CAT[c.cat],u=URG[c.urg],dn=!!done()[c.id];
 return `<button type="button" class="cd ${dn?'done':''}" data-id="${c.id}" style="--u:${u[1]};--c:${col}"><div class="tg">${ic} <b>${esc(nm)}</b><span class="u">${dn?'✅ '+L('Handled','Traité','تمت'):(c.type==='idea'?'💡':c.sev==='low'?'🔵':u[2])}</span></div><div class="tx">${esc(c.text)}</div></button>`};
/* ---------- detail ---------- */
function dlg(head,col,body,foot){$('dt').style.setProperty('--c',col);$('dth').innerHTML=head;$('dtb').innerHTML=body;$('dtf').innerHTML=foot;$('dt').showModal()}
$('dt').addEventListener('click',e=>{if(e.target===$('dt'))$('dt').close()});
function openCard(c){if(!c)return;const [ic,nm,col]=CAT[c.cat],u=URG[c.urg],dn=!!done()[c.id];
 const kind=c.type==='idea'?L('Idea','Idée','فكرة'):L('Alert','Alerte','تنبيه');
 dlg(`<small>${ic} ${esc(nm)} · ${u[2]} ${esc(u[0])} · ${kind}</small><h3>${esc(c.text)}</h3>`,col,
  (c.rec?`<div class="rec">👉 <b>${L('What to do','Que faire','ما العمل')}:</b> ${esc(c.rec)}</div>`:'')
  +(c.codes&&c.codes.length?`<div><b>${L('Tickets concerned','Tickets concernés','التذاكر المعنية')} (${c.codes.length})</b><div class="codes" style="margin-top:6px">${c.codes.slice(0,40).map(x=>`<span>${esc(x)}</span>`).join('')}</div></div>`:'')
  +`<p style="color:var(--mut);font-size:13px">${esc(u[3])}</p>`,
  `<button type="button" id="dAsk">🤖 ${L('Ask the AI advisor','Demander au conseiller IA','اسأل المستشار الذكي')}</button>${c.href?`<button type="button" id="dGo">${L('Open page','Ouvrir la page','فتح الصفحة')} →</button>`:''}<button type="button" class="p" id="dDone">${dn?L('↺ Not handled','↺ Non traité','↺ لم تُعالج'):L('✓ Mark as handled','✓ Marquer comme traité','✓ تمت المعالجة')}</button>`);
 $('dDone').onclick=()=>{setDone(c.id,!dn);$('dt').close();draw()};
 if($('dGo'))$('dGo').onclick=()=>{$('dt').close();goPage(c.href)};
 $('dAsk').onclick=()=>{$('dt').close();$('aip').scrollIntoView({behavior:'smooth'});ask(L(`About this point: "${c.text}". What exactly should I do, step by step?`,`À propos de ce point : « ${c.text} ». Que dois-je faire exactement, étape par étape ?`,`بخصوص هذه النقطة: «${c.text}». ماذا أفعل بالضبط خطوة بخطوة؟`))}}
function openCat(k){const [ic,nm,col]=CAT[k],K=catKpis(k),sec=R.sections.find(s=>s.key===k),my=CARDS.filter(c=>c.cat===k);
 dlg(`<small>📝 ${L('Monthly report','Rapport mensuel','التقرير الشهري')} · ${esc(R.month)}</small><h3>${ic} ${esc(nm)}</h3>`,col,
  `<div class="kg2">${K.kp.map(([l,v])=>`<div><span>${esc(l)}</span><b>${esc(String(v))}</b></div>`).join('')}</div>`
  +(sec?sec.ps.map(p=>`<p>${esc(p)}</p>`).join(''):'')
  +(my.length?`<div><b>${L('Alerts and ideas','Alertes et idées','التنبيهات والأفكار')}</b><div class="mini" style="margin-top:6px">${my.map(c=>`<button type="button" data-o="${c.id}">${URG[c.urg][2]} ${esc(c.text)}</button>`).join('')}</div></div>`:`<p>✅ ${L('No alerts in this area.','Aucune alerte dans ce domaine.','لا تنبيهات في هذا المجال.')}</p>`),
  `<button type="button" id="dAsk">🤖 ${L('Ask the AI advisor','Demander au conseiller IA','اسأل المستشار الذكي')}</button><button type="button" class="p" id="dCl">${L('Close','Fermer','إغلاق')}</button>`);
 $('dtb').querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>openCard(CARDS.find(c=>c.id===b.dataset.o)));
 $('dCl').onclick=()=>$('dt').close();
 $('dAsk').onclick=()=>{$('dt').close();$('aip').scrollIntoView({behavior:'smooth'});ask(L(`How can I improve ${nm} next month? Use this month's numbers.`,`Comment améliorer « ${nm} » le mois prochain ? Utilise les chiffres de ce mois.`,`كيف أحسّن «${nm}» الشهر القادم؟ استخدم أرقام هذا الشهر.`))}}
addEventListener('resize',()=>{if(R)draw()});
const bub=(t,c)=>{const e=document.createElement('div');e.className='m '+c;e.textContent=t;$('cb').append(e);$('cb').scrollTop=1e9;return e};
async function ask(q){q=(q||$('q').value).trim();if(!q||!R)return;$('q').value='';$('em').textContent='';bub(q,'u');const w=bub('…','a');$('sd').disabled=true;
 try{const fn=httpsCallable(getFunctions(auth.app,'europe-west1'),'advisor'),r=await fn({question:q,facts:R.facts,lang:S.lang,history:HIST});const t=(r.data&&r.data.text)||'';w.textContent=t||'–';HIST.push({role:'user',content:q},{role:'assistant',content:t})}
 catch(e){w.remove();const nf=/not-found|internal|unavailable|CORS|Failed to fetch/i.test(e.code+' '+e.message);$('em').textContent=(nf?L('The AI function is not reachable. Deploy it first (see README → “AI advisor”). ','La fonction IA est inaccessible. Déployez-la d’abord (README → « AI advisor »). ','دالة الذكاء الاصطناعي غير متاحة. انشرها أولاً (README ← «AI advisor»). '):'')+(e.message||'')}
 $('sd').disabled=false}
$('sd').onclick=()=>ask();$('q').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}};
$('mo').onchange=draw;$('rf').onclick=load;
window.__an={setData:d=>{DATA=d;draw()}};
start(load);
</script><script type="module">import {reportTools} from "../../js/report.js?v=72";reportTools();</script></body></html>
