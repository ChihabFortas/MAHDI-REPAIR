</style></head><body><main>

</div><div class="nfa"><button type="button" id="ncl">Cancel</button><button class="p" id="nsv">Create staff member</button></div></form></dialog>
</main><script type="module">
import {$,esc,db,auth,start,user,role,num,money,logAudit,slugName,STAFF_DOMAIN,askYes} from "../../js/common.js?v=72";
import {firebaseConfig} from "../../js/firebase-config.js?v=72";
import {openProfile} from "../../js/profileform.js?v=72";
import {STAFF} from "../../js/schemas.js?v=72";
import {ymd,fmtH,atMs,monthStats,rating} from "../../js/attlib.js?v=72";
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,sendPasswordResetEmail,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFunctions,httpsCallable} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";
import {collection,onSnapshot,query,where,doc,getDoc,getDocs,setDoc,addDoc,updateDoc,deleteDoc,serverTimestamp,Timestamp,limit} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {S} from "../../js/ui.js?v=72";
/* Team (v74): every staff member as a card; click for their file, attendance, work, bonuses, login and an AI coach.
   Managers add reception / sales / technician / inventory staff; only an admin changes roles. */
const STAFF_ROLES=['reception','sales','technician','inventory'],ALL_ROLES=[...STAFF_ROLES,'manager','admin'];
const RC={reception:'#0891b2',sales:'#16a34a',technician:'#2563eb',inventory:'#d97706',manager:'#7c3aed',admin:'#be123c'};
let U=[],SF=[],SC={},CFG={shifts:[],holidays:[]},LV=[],LG=[],TKM=[],TKO=[],DL=[],AU=[],BN={rates:[0,0,0,0],overrides:{}},unsub=[],CUR=null,CTAB='ov';
const T=()=>ymd(new Date()),M=()=>$('mo').value||T().slice(0,7),isAdmin=()=>role==='admin';
$('mo').value=T().slice(0,7);
$('rf').innerHTML+=ALL_ROLES.map(r=>`<option value="${r}">${r[0].toUpperCase()+r.slice(1)}</option>`).join('');
const who=u=>u.name||u.email||u.id,ini=u=>(who(u).split(/\s+/).map(w=>w[0]).join('').slice(0,2)||'?').toUpperCase();
const fileOf=u=>SF.find(p=>p.uid===u.id)||SF.find(p=>p.loginName&&u.username&&slugName(p.loginName)===u.username)||null;
start(()=>{const c=n=>collection(db,n);
 onSnapshot(c('users'),s=>{U=s.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>who(a).localeCompare(who(b)));draw()});
 onSnapshot(c('staffProfiles'),s=>{SF=s.docs.map(d=>({...d.data(),id:d.id}));draw()},()=>{});
 onSnapshot(c('staffSchedules'),s=>{SC={};s.docs.forEach(d=>SC[d.id]=d.data());draw()},()=>{});
 onSnapshot(doc(db,'settings','attendance'),s=>{CFG={shifts:[],holidays:[],...(s.exists()?s.data():{})};draw()},()=>{});
 onSnapshot(c('leaves'),s=>{LV=s.docs.map(d=>({...d.data(),id:d.id}));draw()},()=>{});
 onSnapshot(doc(db,'settings','bonus'),s=>{BN={rates:[0,0,0,0],overrides:{},...(s.data()||{})};draw()},()=>{});
 onSnapshot(query(c('tickets'),where('status','in',['received','diagnose','awaiting_approval','waiting_parts','repair'])),s=>{TKO=s.docs.map(d=>d.data());draw()},()=>{});
 sub()});
function sub(){unsub.forEach(f=>f());unsub=[];const m=M(),a=m+'-01',b=m+'-31',[y,mo]=m.split('-').map(Number),s0=new Date(y,mo-1,1).getTime(),s1=new Date(y,mo,1).getTime(),c=n=>collection(db,n);
 unsub.push(onSnapshot(query(c('attendanceLogs'),where('date','>=',a),where('date','<=',b)),s=>{LG=s.docs.map(d=>d.data());draw()},()=>{}));
 unsub.push(onSnapshot(query(c('tickets'),where('repairedAt','>=',s0),where('repairedAt','<',s1)),s=>{TKM=s.docs.map(d=>d.data());draw()},()=>{}));
 unsub.push(onSnapshot(query(c('deliveries'),where('date','>=',a),where('date','<=',b)),s=>{DL=s.docs.map(d=>d.data());draw()},()=>{}));
 unsub.push(onSnapshot(query(c('audit'),where('at','>=',Timestamp.fromMillis(s0)),where('at','<',Timestamp.fromMillis(s1)),limit(4000)),s=>{AU=s.docs.map(d=>d.data());draw()},()=>{}))}
$('mo').onchange=sub;['q','rf','sf'].forEach(id=>$(id)[id==='q'?'oninput':'onchange']=draw);
/* ---------- numbers per person ---------- */
const rate=(uid,l)=>{const o=(BN.overrides||{})[uid];return num(o&&o[l]!=null?o[l]:(BN.rates||[])[l])};
function met(u){const m=M(),att=monthStats(m,LG.filter(l=>l.uid===u.id),SC[u.id],CFG.shifts||[],CFG.holidays||[],LV.filter(l=>l.uid===u.id),CFG,T());
 const rp=TKM.filter(t=>t.repairedBy===u.id),lv=[0,0,0,0];rp.forEach(t=>{const l=Math.min(3,Math.max(0,+t.repairLevel||+t.level||0));lv[l]++});
 const bonus=lv.reduce((a,n,l)=>a+n*rate(u.id,l),0),hrs=rp.map(t=>{const c=atMs(t.createdAt)||((t.history||[])[0]||{}).t;return c&&t.repairedAt?(t.repairedAt-c)/36e5:null}).filter(x=>x!==null&&x>=0);
 const sl=DL.filter(d=>d.by===u.email&&!['cancelled','draft','held'].includes(d.status)),au=AU.filter(a=>a.by===u.email);
 const today=LG.filter(l=>l.uid===u.id&&l.date===T()).sort((a,b)=>atMs(a.at)-atMs(b.at)),last=today[today.length-1];
 const now=!today.length?'':last.type==='out'?'out':last.type==='breakStart'?'br':'in';
 return {att,repairs:rp.length,lv,bonus,avgH:hrs.length?Math.round(hrs.reduce((a,b)=>a+b,0)/hrs.length*10)/10:null,open:TKO.filter(t=>t.techId===u.id).length,
  sales:sl.length,rev:sl.reduce((a,d)=>a+num(d.total),0),created:au.filter(a=>a.action==='ticket.create').length,msgs:au.filter(a=>/^customer\./.test(a.action||'')).length,actions:au.length,
  lastLogin:AU.filter(a=>a.by===u.email&&a.action==='login').map(a=>atMs(a.at)).sort((a,b)=>b-a)[0]||null,now}}
const teamAvg=(k,list)=>{const v=list.map(x=>x[k]).filter(x=>x!==null&&x!==undefined);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null};
/* ---------- recommendations (always available, no AI needed) ---------- */
function recs(u,x,peers){const r=[],A=x.att,add=(k,t)=>r.push([k,t]);
 if(A.score===null)add('tip','No work schedule is assigned, so attendance cannot be scored. Set their shift in Staff attendance → Shifts & schedule.');
 else{if(A.score>=90)add('good',`Excellent attendance this month (score ${A.score}). Say thank you; recognition keeps good people.`);
  if(A.absent)add(A.absent>=3?'bad':'warn',`${A.absent} unexplained absence(s). Talk with them privately, ask the reason, and agree on how to warn you in advance.`);
  if(A.late>=3)add(A.late>=6?'bad':'warn',`Late ${A.late} times (${A.lateMin} min in total). Check if the shift start fits them; if it does, set a clear rule (e.g. 3 late arrivals = warning).`);
  if(A.incomplete)add('warn',`${A.incomplete} day(s) without clock-out. Remind them to clock out at the kiosk so hours and overtime are correct.`);
  if(A.overtime>600)add('warn',`High overtime (${fmtH(A.overtime)}). Watch for tiredness and mistakes; spread the work or pay the extra hours.`)}
 if(u.role==='technician'){const avgR=teamAvg('repairs',peers),avgH=teamAvg('avgH',peers),avgO=teamAvg('open',peers);
  if(!x.repairs)add('warn','No finished repairs this month. Check that they are given devices and that they mark repairs as done in the app.');
  else if(avgR&&x.repairs>=avgR*1.3)add('good',`Finished ${x.repairs} repairs, above the team average (${Math.round(avgR)}). Bonus earned: ${money(x.bonus)}.`);
  else if(avgR&&x.repairs<avgR*0.6)add('warn',`Finished ${x.repairs} repairs, well below the team average (${Math.round(avgR)}). Look at the type of devices they get and whether they need training.`);
  if(x.avgH!==null&&avgH&&x.avgH>avgH*1.4)add('warn',`Repairs take ${x.avgH} h on average vs ${Math.round(avgH)} h for the team. Find the slow step (waiting for parts? diagnosis?).`);
  if(avgO&&x.open>Math.max(4,avgO*1.7))add('tip',`${x.open} devices waiting with them now, much more than others. Move some devices to another technician.`);
  if(x.lv[2]+x.lv[3]>=3)add('good',`Handles difficult repairs (${x.lv[2]+x.lv[3]} at level 2–3). Consider them for training others.`)}
 if(u.role==='sales'){const avg=teamAvg('rev',peers.filter(p=>p.sales));if(!x.sales)add('warn','No sales recorded under their name this month. Make sure they sell with their own login.');
  else if(avg&&x.rev>=avg*1.3)add('good',`Sales of ${money(x.rev)} (${x.sales} notes), above the team average. Reward it.`);else if(avg&&x.rev<avg*0.6)add('warn',`Sales of ${money(x.rev)}, below the team average (${money(avg)}). Coach them on offering accessories and screen protection with every sale.`)}
 if(u.role==='reception'){if(x.created)add('good',`Created ${x.created} repair tickets this month.`);if(x.created&&!x.msgs)add('tip','No WhatsApp messages sent to customers this month. Ask them to use the WhatsApp button so customers are kept informed.')}
 if(!x.lastLogin&&u.active!==false)add('tip','No sign-in recorded this month. If they still work here, check they use their own login.');
 return r}
/* ---------- list ---------- */
function draw(){if(!U.length)return;const q=($('q').value||'').toLowerCase(),rf=$('rf').value,sf=$('sf').value;
 const L=U.filter(u=>(!rf||u.role===rf)&&(sf===''||(sf==='on'?u.active!==false:u.active===false))&&(!q||[who(u),u.username,u.email,u.phone,(fileOf(u)||{}).phone].join(' ').toLowerCase().includes(q)));
 const X=new Map(U.map(u=>[u.id,met(u)])),act=U.filter(u=>u.active!==false),sc=act.map(u=>X.get(u.id).att.score).filter(s=>s!==null);
 $('kk').innerHTML=[['Active staff',act.length,'#2563eb'],['Working now',act.filter(u=>X.get(u.id).now==='in').length,'#16a34a'],['Avg attendance score',sc.length?Math.round(sc.reduce((a,b)=>a+b,0)/sc.length):'—','#7c3aed'],['Repairs this month',TKM.length,'#0891b2'],['Bonuses this month',money(act.reduce((a,u)=>a+X.get(u.id).bonus,0)),'#d97706']].map(([l,v,c])=>`<div style="--c:${c}"><span>${l}</span><b>${esc(String(v))}</b></div>`).join('');
 $('gr').innerHTML=L.map(u=>{const x=X.get(u.id),f=fileOf(u)||{},s=x.att.score,col=s===null?'#94a3b8':s>=90?'#16a34a':s>=75?'#2563eb':s>=60?'#f59e0b':'#dc2626';
  const now=u.active===false?'':x.now==='in'?'<span class="now in">● Working</span>':x.now==='br'?'<span class="now br">☕ Break</span>':x.now==='out'?'<span class="now out">Left</span>':'';
  const work=u.role==='technician'?[['Repairs',x.repairs],['Bonus',money(x.bonus)],['Waiting',x.open]]:u.role==='sales'?[['Sales',x.sales],['Revenue',money(x.rev)],['Actions',x.actions]]:u.role==='reception'?[['Tickets',x.created],['Messages',x.msgs],['Actions',x.actions]]:[['Actions',x.actions],['Late',x.att.late],['Absent',x.att.absent]];
  return `<div class="sc ${u.active===false?'off':''}" role="button" tabindex="0" data-u="${u.id}" style="--rc:${RC[u.role]||'#64748b'};--sc:${col}">${now}<div class="sh"><div class="av">${esc(ini(u))}</div><div><b>${esc(who(u))}</b><span class="rb">${esc(u.role||'')}</span> <small>${esc(f.jobTitle||'')}</small><br><small>${esc(u.username?'@'+u.username:'')}${u.active===false?' · switched off':''}</small></div></div>
   <div><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px"><span>Attendance score</span><b style="color:${col}">${s===null?'—':s+' · '+rating(s)}</b></div><div class="bar2"><i style="width:${s===null?0:s}%"></i></div></div>
   <div class="ms">${work.map(([l,v])=>`<div><span>${l}</span><b>${esc(String(v))}</b></div>`).join('')}</div></div>`}).join('')||'<div style="color:var(--mut)">No staff match.</div>';
 $('gr').querySelectorAll('[data-u]').forEach(b=>{b.onclick=()=>openP(b.dataset.u);b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openP(b.dataset.u)}}});
 if(CUR&&$('pf').open)drawP()}
/* ---------- profile ---------- */
const TABS=[['ov','Overview'],['at','Attendance'],['wk','Work & bonuses'],['lg','Login & access'],['ai','🤖 AI coach']];
function openP(id){CUR=id;CTAB='ov';drawP();$('pf').showModal()}
$('pf').addEventListener('click',e=>{if(e.target===$('pf'))$('pf').close()});
function drawP(){const u=U.find(x=>x.id===CUR);if(!u)return;const x=met(u),f=fileOf(u);$('pf').style.setProperty('--rc',RC[u.role]||'#64748b');
 $('ph').innerHTML=`<div class="av">${esc(ini(u))}</div><div><h3>${esc(who(u))}</h3><small>${esc((u.role||'')+(f&&f.jobTitle?' · '+f.jobTitle:'')+(u.username?' · @'+u.username:''))}${u.active===false?' · switched off':''}</small></div><button type="button" id="pcl">✕</button>`;
 $('pcl').onclick=()=>$('pf').close();
 $('pt').innerHTML=TABS.map(([k,l])=>`<button type="button" class="${CTAB===k?'on':''}" data-t="${k}">${l}</button>`).join('');
 $('pt').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{CTAB=b.dataset.t;drawP()});
 ({ov:pOv,at:pAt,wk:pWk,lg:pLg,ai:pAi})[CTAB](u,x,f)}
const g2=a=>`<div class="g2">${a.map(([l,v])=>`<div><span>${esc(l)}</span><b>${esc(String(v??'—')||'—')}</b></div>`).join('')}</div>`;
function pOv(u,x,f){const A=x.att;
 $('pb').innerHTML=`${g2([['Attendance score',A.score===null?'—':A.score+' · '+rating(A.score)],['Worked this month',fmtH(A.worked)],['Late / absent',A.late+' / '+A.absent],u.role==='technician'?['Repairs · bonus',x.repairs+' · '+money(x.bonus)]:u.role==='sales'?['Sales · revenue',x.sales+' · '+money(x.rev)]:['Actions in the app',x.actions]])}
 <div class="box"><h4>🪪 Staff file</h4>${f?g2([['Phone',f.phone||u.phone],['Job title',f.jobTitle],['Department',f.department],['Hire date',f.hireDate],['Contract',f.contract],['Status',f.status],['National ID',f.nationalId],['Base salary',f.salary!=null&&f.salary!==''?money(f.salary):'—'],['Emergency contact',[f.emName,f.emPhone].filter(Boolean).join(' · ')]]):'<p style="color:var(--mut);margin:0">No staff file yet.</p>'}
 <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="p" type="button" id="pfE">${f?'✎ Edit full file':'＋ Create staff file'}</button></div></div>
 <div class="box"><h4>💡 Top recommendations</h4>${recs(u,x,U.filter(o=>o.role===u.role&&o.active!==false).map(met)).slice(0,3).map(([k,t])=>`<div class="rc ${k}">${{good:'✅',warn:'⚠️',bad:'⛔',tip:'💡'}[k]} <span>${esc(t)}</span></div>`).join('')||'<p style="margin:0;color:var(--mut)">Nothing to flag.</p>'}</div>`;
 $('pfE').onclick=()=>editFile(u,f)}
function editFile(u,f){const nm=who(u).split(' ');openProfile({title:'Staff file — '+who(u),sections:STAFF,data:f||{firstName:nm[0],lastName:nm.slice(1).join(' '),phone:u.phone||'',status:'active',contract:'cdi',department:'workshop',payType:'monthly',nationality:'Algerian',appRole:u.role,loginName:u.username||''},
 onSave:async v=>{const d={...v,uid:u.id,fullName:((v.firstName||'')+' '+(v.lastName||'')).trim(),updatedAt:serverTimestamp(),updatedBy:user.email};if(f){await updateDoc(doc(db,'staffProfiles',f.id),d);logAudit('staffFile.edit',d.fullName)}else{await addDoc(collection(db,'staffProfiles'),{...d,createdAt:serverTimestamp()});logAudit('staffFile.create',d.fullName)}}})}
function pAt(u,x){const A=x.att,days=A.days.filter(d=>d.c.worked||d.flags.length).slice().reverse();
 $('pb').innerHTML=`${g2([['Score',A.score===null?'—':A.score],['Attendance',A.attendance===null?'—':Math.round(A.attendance)+'%'],['Punctuality',A.punctuality===null?'—':Math.round(A.punctuality)+'%'],['Worked',fmtH(A.worked)],['Expected',fmtH(A.expected)],['Overtime',fmtH(A.overtime)],['Late arrivals',A.late+(A.lateMin?' ('+A.lateMin+' min)':'')],['Absences',A.absent],['Leave days',A.leaveDays],['No clock-out',A.incomplete]])}
 <div class="box"><h4>📅 Days</h4><table class="t4"><thead><tr><th>Date</th><th>Planned</th><th>Worked</th><th>Notes</th></tr></thead><tbody>${days.map(d=>`<tr><td>${d.date}</td><td>${d.ex.kind==='work'?esc(d.ex.shift.name||'')+' '+(d.ex.shift.start||'')+'–'+(d.ex.shift.end||''):esc(d.ex.label||d.ex.kind)}</td><td>${fmtH(d.c.worked)}</td><td style="color:${d.flags.some(f=>/absent|late/.test(f))?'#b91c1c':'var(--mut)'}">${esc(d.flags.join(', '))}</td></tr>`).join('')||'<tr><td colspan="4" style="color:var(--mut)">No attendance this month.</td></tr>'}</tbody></table></div>`}
function pWk(u,x){const lvl=['Basic','Normal','Difficult','Most difficult'];
 $('pb').innerHTML=(u.role==='technician'||x.repairs?`<div class="box"><h4>🔧 Repairs this month</h4>${g2([['Finished',x.repairs],['Average time',x.avgH===null?'—':x.avgH+' h'],['Waiting with them now',x.open],['Bonus earned',money(x.bonus)]])}
  <table class="t4" style="margin-top:10px"><thead><tr><th>Level</th><th>Repairs</th><th>Rate</th><th>Bonus</th></tr></thead><tbody>${x.lv.map((n,l)=>`<tr><td>${l} – ${lvl[l]}</td><td>${n}</td><td>${money(rate(u.id,l))}</td><td>${money(n*rate(u.id,l))}</td></tr>`).join('')}</tbody></table>
  <p style="color:var(--mut);font-size:13px;margin:8px 0 0">Bonus rates are set by the admin in System → Repair bonuses.</p></div>`:'')
  +`<div class="box"><h4>🛒 Sales & activity</h4>${g2([['Sales (delivery notes)',x.sales],['Revenue',money(x.rev)],['Tickets created',x.created],['Customer messages',x.msgs],['Actions in the app',x.actions],['Last sign-in',x.lastLogin?new Date(x.lastLogin).toLocaleString():'—']])}</div>`}
function pLg(u){const canEdit=isAdmin()||STAFF_ROLES.includes(u.role),mail=(u.email||'').endsWith('@'+STAFF_DOMAIN)?'':u.email;
 $('pb').innerHTML=`<div class="box"><h4>🔑 Login</h4><div class="g2" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">
  <div><span>Display name</span><input id="lgN" value="${esc(u.name||'')}" ${canEdit?'':'disabled'}></div>
  <div><span>Login name</span><input id="lgU" value="${esc(u.username||'')}" ${canEdit?'':'disabled'} autocapitalize="none"></div>
  <div><span>Phone</span><input id="lgP" value="${esc(u.phone||'')}" ${canEdit?'':'disabled'}></div>
  <div><span>Login email</span><b>${esc(mail||'— (signs in with the login name)')}</b></div></div>
  <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">${canEdit?'<button class="p" type="button" id="lgS">Save login details</button>':''}<span id="lgM" style="color:var(--mut);align-self:center"></span></div></div>
 <div class="box"><h4>🔒 Password</h4>${canEdit&&u.id!==(user&&user.uid)?`<div style="display:flex;gap:8px;flex-wrap:wrap"><input id="lgW" type="text" placeholder="New password (6+ characters)" style="flex:1 1 220px" autocapitalize="none"><button type="button" class="p" id="lgWs">Set new password</button>${mail?'<button type="button" id="lgR">Send reset email</button>':''}</div><small style="color:var(--mut)">Tell the staff member their new password in person.</small><div id="lgWm" style="margin-top:6px"></div>`:'<p style="margin:0;color:var(--mut)">Only an admin can change the password of a manager or admin.</p>'}</div>
 <div class="box"><h4>🛡 Access</h4><div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center"><span>Role:</span>${isAdmin()&&u.id!==(user&&user.uid)?`<select id="lgRo" style="width:auto">${ALL_ROLES.map(r=>`<option value="${r}" ${r===u.role?'selected':''}>${r}</option>`).join('')}</select>`:`<span class="rb" style="--rc:${RC[u.role]}">${esc(u.role)}</span><small style="color:var(--mut)">Only an admin can change roles.</small>`}
  ${canEdit&&u.id!==(user&&user.uid)?`<label class="ck" style="margin:0"><input type="checkbox" id="lgA" ${u.active!==false?'checked':''}> Can sign in</label>`:''}</div></div>`;
 if($('lgS'))$('lgS').onclick=async()=>{const name=$('lgN').value.trim(),un=slugName($('lgU').value),ph=$('lgP').value.trim();if(!name||!un){$('lgM').textContent='Enter a name and a login name.';return}
  try{if(un!==u.username){const ex=await getDoc(doc(db,'usernames',un));if(ex.exists()&&ex.data().uid!==u.id){$('lgM').textContent='This login name is already used.';return}await setDoc(doc(db,'usernames',un),{email:u.email,uid:u.id});if(u.username)try{await deleteDoc(doc(db,'usernames',u.username))}catch(_){}}
   await updateDoc(doc(db,'users',u.id),{name,username:un,phone:ph,updatedAt:serverTimestamp()});if(u.role==='technician')try{await setDoc(doc(db,'technicians',u.id),{name,active:u.active!==false,email:u.email})}catch(_){}
   logAudit('user.edit',u.email+' · @'+un);$('lgM').textContent='Saved ✓'}catch(e){$('lgM').textContent=e.message}};
 if($('lgWs'))$('lgWs').onclick=async()=>{const pw=$('lgW').value;if(pw.length<6){$('lgWm').textContent='At least 6 characters.';return}$('lgWm').textContent='…';
  try{await httpsCallable(getFunctions(auth.app,'europe-west1'),'staffLogin')({uid:u.id,password:pw});$('lgW').value='';$('lgWm').innerHTML='<span style="color:#15803d">✓ New password set.</span>'}
  catch(e){$('lgWm').innerHTML=`<span style="color:#b91c1c">${esc(/not-found|internal|unavailable|Failed to fetch|CORS/i.test(e.code+' '+e.message)?'The server function for passwords is not deployed yet. Run: firebase deploy --only functions':e.message)}</span>`}};
 if($('lgR'))$('lgR').onclick=async()=>{try{await sendPasswordResetEmail(getAuth(),u.email);logAudit('user.reset',u.email);$('lgWm').textContent='Reset email sent.'}catch(e){$('lgWm').textContent=e.message}};
 if($('lgA'))$('lgA').onchange=async e=>{try{await updateDoc(doc(db,'users',u.id),{active:e.target.checked,updatedAt:serverTimestamp()});if(u.role==='technician')try{await setDoc(doc(db,'technicians',u.id),{name:u.name,active:e.target.checked,email:u.email})}catch(_){}logAudit(e.target.checked?'user.enable':'user.disable',u.email)}catch(x){alert(x.message);e.target.checked=!e.target.checked}};
 if($('lgRo'))$('lgRo').onchange=async e=>{if(!(await askYes(`Change the role of ${who(u)} to ${e.target.value}? This changes what they can see and do.`))){e.target.value=u.role;return}try{await updateDoc(doc(db,'users',u.id),{role:e.target.value});logAudit('user.role',u.email+' → '+e.target.value)}catch(x){alert(x.message)}}}
function pAi(u,x,f){const peers=U.filter(o=>o.role===u.role&&o.active!==false).map(met),R=recs(u,x,peers);
 $('pb').innerHTML=`<div class="box"><h4>💡 Recommendations from this month's numbers</h4>${R.map(([k,t])=>`<div class="rc ${k}">${{good:'✅',warn:'⚠️',bad:'⛔',tip:'💡'}[k]} <span>${esc(t)}</span></div>`).join('')||'<p style="margin:0;color:var(--mut)">Nothing to flag this month.</p>'}</div>
 <div class="box"><h4>🤖 Full AI review</h4><p style="margin:0 0 10px;color:var(--mut)">The AI reads this person's attendance and work numbers (no salary, no ID) and writes strengths, problems and next steps.</p><button class="p" type="button" id="aiG">Analyse ${esc(who(u))}</button><div id="aiO" style="margin-top:12px"></div></div>`;
 $('aiG').onclick=async()=>{const A=x.att,avg=k=>{const v=teamAvg(k,peers);return v===null?null:Math.round(v*10)/10};
  const facts={staffReview:true,month:M(),person:{role:u.role,jobTitle:f&&f.jobTitle||'',hireDate:f&&f.hireDate||'',active:u.active!==false},
   attendance:{score:A.score,attendancePct:A.attendance&&Math.round(A.attendance),punctualityPct:A.punctuality&&Math.round(A.punctuality),workedHours:Math.round(A.worked/6)/10,expectedHours:Math.round(A.expected/6)/10,overtimeHours:Math.round(A.overtime/6)/10,lateArrivals:A.late,lateMinutes:A.lateMin,absences:A.absent,leaveDays:A.leaveDays,missingClockOut:A.incomplete},
   work:{repairsFinished:x.repairs,repairsByLevel:x.lv,avgRepairHours:x.avgH,devicesWaitingNow:x.open,bonus:Math.round(x.bonus),sales:x.sales,salesRevenue:Math.round(x.rev),ticketsCreated:x.created,customerMessages:x.msgs,appActions:x.actions},
   teamAverageSameRole:{repairs:avg('repairs'),avgRepairHours:avg('avgH'),salesRevenue:avg('rev'),devicesWaiting:avg('open')},ruleBasedNotes:R.map(r=>r[1])};
  const q='This is a STAFF REVIEW, not a shop review. Using only these numbers, review this '+u.role+': 1) strengths, 2) problems (attendance, punctuality, speed, quality, workload), 3) 3–5 concrete recommendations for the manager, 4) 2–3 short goals for the employee for next month. Be fair and respectful; say when data is missing.';
  $('aiO').innerHTML='<div class="ai">…</div>';
  try{const r=await httpsCallable(getFunctions(auth.app,'europe-west1'),'advisor')({question:q,facts,lang:S.lang,history:[]});$('aiO').innerHTML=`<div class="ai">${esc((r.data&&r.data.text)||'–')}</div>`;logAudit('staff.aiReview',u.email)}
  catch(e){$('aiO').innerHTML=`<div class="rc warn">⚠️ <span>${esc(/not-found|internal|unavailable|Failed to fetch|CORS/i.test(e.code+' '+e.message)?'The AI function is not reachable. Deploy it first (README → “AI advisor”). The recommendations above still work without it.':e.message)}</span></div>`}}}
/* ---------- add staff ---------- */
$('nrole').innerHTML=(isAdmin()?ALL_ROLES:STAFF_ROLES).map(r=>`<option value="${r}">${r[0].toUpperCase()+r.slice(1)}</option>`).join('');
$('add').onclick=()=>{$('nfm').reset();$('nrole').innerHTML=(isAdmin()?ALL_ROLES:STAFF_ROLES).map(r=>`<option value="${r}">${r[0].toUpperCase()+r.slice(1)}</option>`).join('');$('nmsg').style.color='';$('nmsg').textContent='They sign in with the login name and password. Only an admin can change a role later.';$('nd').showModal()};
$('ncl').onclick=()=>$('nd').close();
const nf=$('nfm');['firstName','lastName'].forEach(k=>nf[k].addEventListener('input',()=>{if(!nf.uname.dataset.touched)nf.uname.value=slugName((nf.firstName.value+' '+nf.lastName.value).trim())}));nf.uname.addEventListener('input',()=>nf.uname.dataset.touched='1');
nf.onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(nf)),say=(t,bad)=>{$('nmsg').textContent=t;$('nmsg').style.color=bad?'#b91c1c':''};
 if(!isAdmin()&&!STAFF_ROLES.includes(v.role)){say('Managers can add reception, sales, technician and inventory staff only.',1);return}
 const un=slugName(v.uname),name=(v.firstName+' '+v.lastName).trim();if(!un){say('Enter a login name.',1);return}$('nsv').disabled=true;say('Creating…');
 try{const ex=await getDoc(doc(db,'usernames',un));if(ex.exists()){say('This login name is already used. Choose another one.',1);$('nsv').disabled=false;return}
  const em=(v.email||'').trim()||(un+'.'+Math.random().toString(36).slice(2,7)+'@'+STAFF_DOMAIN),sec=initializeApp(firebaseConfig,'sec'+Date.now()),sa=getAuth(sec),c=await createUserWithEmailAndPassword(sa,em,v.pw);await signOut(sa);
  await setDoc(doc(db,'users',c.user.uid),{email:em,name,username:un,role:v.role,active:true,phone:v.phone||'',createdAt:serverTimestamp(),createdBy:user.email});
  await setDoc(doc(db,'usernames',un),{email:em,uid:c.user.uid});
  if(v.role==='technician')await setDoc(doc(db,'technicians',c.user.uid),{name,active:true,email:em});
  await addDoc(collection(db,'staffProfiles'),{uid:c.user.uid,firstName:v.firstName,lastName:v.lastName,fullName:name,phone:v.phone||'',email:v.pemail||'',nationalId:v.nationalId||'',birthDate:v.birthDate||'',jobTitle:v.jobTitle||'',department:v.department,hireDate:v.hireDate||'',contract:v.contract,salary:v.salary===''?null:+v.salary,status:'active',appRole:v.role,loginName:un,nationality:'Algerian',payType:'monthly',createdAt:serverTimestamp(),updatedBy:user.email});
  logAudit('user.create',un+' · '+v.role);$('nd').close();$('nsv').disabled=false;setTimeout(()=>openP(c.user.uid),400)}
 catch(x){$('nsv').disabled=false;say(x.code==='auth/email-already-in-use'?'This login already exists in the system.':x.message,1)}};
</script></body></html>
