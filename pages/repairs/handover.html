<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><!--boot--><style id="fouc">html{visibility:hidden}</style><script>setTimeout(function(){var f=document.getElementById('fouc');f&&f.remove()},5000)</script><link rel="modulepreload" href="../../js/common.js?v=72"><link rel="modulepreload" href="../../js/ui.js?v=72"><link rel="modulepreload" href="../../js/firebase-config.js?v=72"><link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"><link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"><link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"><!--/boot--><title>Mahdi Repair – Hand over</title>
<link rel="stylesheet" href="../../css/common.css?v=72"><style>#tabs{display:none!important}main{max-width:1100px!important;padding:12px 14px!important}
.sb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:14px}.sb input{flex:1;min-width:200px;font-size:20px;padding:12px 14px;letter-spacing:.5px}.sb button{padding:12px 16px}
.gd{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;align-items:start}@media(max-width:860px){.gd{grid-template-columns:1fr}}
.pn{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}.pn h3{margin:0 0 10px}.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:15px}.kv span{color:var(--mut)}
.big{font-size:30px;font-weight:800}.warn{background:#f59e0b1f;border:1px solid #f59e0b;border-radius:12px;padding:10px 12px;margin-bottom:10px}.okb{background:#16a34a1f;border:1px solid #16a34a;border-radius:12px;padding:10px 12px;margin-bottom:10px}
.tl{margin:0;padding:0;list-style:none}.tl li{padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}.rg{display:grid;gap:10px}.stars{display:flex;gap:4px;font-size:28px;cursor:pointer;user-select:none}.stars b{color:#cbd5e1;font-weight:400}.stars b.on{color:#f59e0b}
#hv{width:100%;max-height:50vh;border-radius:12px;background:#000;display:none}.rs{display:grid;gap:6px;margin-top:8px}.rs button{text-align:start}
</style></head><body><main>
<div class="sb"><b style="font-size:18px">📤 Hand over</b><input id="sc" placeholder="Scan the barcode here (or type code / phone / name)…" autocomplete="off" autofocus><button class="p" id="go">Open ticket</button><button id="cm">📷 Camera</button></div>
<video id="hv" playsinline muted></video><div class="rs" id="rs"></div><div id="vw"><div class="pn" style="text-align:center;color:var(--mut)"><div style="font-size:48px">📱</div>Scan the barcode on the receipt or on the sticker behind the device.<br>The ticket opens here and you can hand the device over and collect the payment.</div></div>
</main><script type="module">
import {loadPhotos,lightbox} from "../../js/photos.js?v=72";
import {nativeScan} from "../../js/native.js?v=72";
import {printCert} from "../../js/certificate.js?v=72";
import {$,esc,db,start,money,num,user,role,logAudit,gen,goPage,askYes,STATUS,chip,devLine} from "../../js/common.js?v=72";
import {collection,onSnapshot,doc,getDoc,setDoc,updateDoc,query,where,arrayUnion,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
let CERTX=null,LOST=false,T=null,OPEN=[],CU=[],RG=[],rating=0,stream=null,timer=null;const fm=money,dg=s=>String(s||'').replace(/\D/g,''),today=()=>new Date().toISOString().slice(0,10),dt=ms=>ms?new Date(ms).toLocaleString():'';
start(()=>{onSnapshot(query(collection(db,'tickets'),where('status','!=','returned')),s=>{OPEN=s.docs.map(d=>d.data())},()=>{});onSnapshot(collection(db,'customers'),s=>{CU=s.docs.map(d=>({...d.data(),id:d.id}))},()=>{});onSnapshot(collection(db,'registers'),s=>{RG=s.docs.map(d=>({...d.data(),id:d.id}))},()=>{});
 const c=new URLSearchParams(location.search).get('code')||decodeURIComponent(location.hash.slice(1).replace(/^code:/,''));if(c)find(c);$('sc').focus()});
const fromScan=v=>{v=String(v).trim();const m=/[?&]code=([A-Za-z0-9-]+)/.exec(v);return (m?m[1]:v).toUpperCase()};
async function find(raw,viaList){const code=fromScan(raw);if(!code)return;LOST=!!viaList||!/^RD-[A-Z0-9]{4,}$/.test(code);$('rs').innerHTML='';
 if(/^RD-[A-Z0-9]{4,}$/.test(code)){try{const s=await getDoc(doc(db,'tickets',code));if(s.exists()){show(s.data());return}}catch(e){alert(e.message)}$('vw').innerHTML='<div class="pn warn">Ticket '+esc(code)+' not found.</div>';return}
 const q=raw.trim().toLowerCase(),L=OPEN.filter(t=>[t.code,t.firstName,t.lastName,t.phone,t.model].join(' ').toLowerCase().includes(q)).slice(0,8);
 if(L.length===1){LOST=true;show(L[0]);return}$('rs').innerHTML=L.map(t=>`<button data-c="${t.code}"><b>${esc(t.code)}</b> · ${esc(t.model)} · ${esc(t.firstName)} ${esc(t.lastName)} · ${esc(t.phone)} ${chip(t.status)}</button>`).join('')||'<div class="pn warn">Nothing found for “'+esc(raw)+'”.</div>';
 $('rs').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{$('rs').innerHTML='';find(b.dataset.c,true)})}
$('sc').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();const v=$('sc').value;$('sc').value='';find(v)}};$('go').onclick=()=>{const v=$('sc').value;$('sc').value='';find(v)};
const baseDue=t=>t.status==='no_repair'?num(t.noRepairFee):num(t.price),dueOf=t=>Math.max(0,baseDue(t)-num(t.paidTotal));
function show(t){T=t;rating=0;const h=(t.history||[]).slice().sort((a,b)=>a.t-b.t),done=t.status==='returned',due=dueOf(t),ready=['ready','no_repair'].includes(t.status),cash=RG.filter(r=>r.type==='cash'),dr=cash.find(r=>r.isDefault)||cash[0];
 const first=h[0]?h[0].t:null,nm=((t.firstName||'')+' '+(t.lastName||'')).trim();
 $('vw').innerHTML=`<div class="gd"><div class="pn"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><div class="big">${esc(t.model||'')} <small style="font-size:16px;color:var(--mut)">${esc(t.color||'')}</small></div><b>${esc(t.code)}</b> ${chip(t.status)}</div><div style="text-align:end"><div class="big">${t.price!=null&&t.price!==''?fm(t.price):'–'}</div><small>${t.estDelivery?'Est. '+esc(t.estDelivery):''}</small></div></div>
 <div class="kv" style="margin-top:12px"><span>Customer</span><b>${esc(nm)} · <a href="tel:${esc(t.phone)}">${esc(t.phone)}</a></b><span>Problem</span><div>${esc(t.problem||'')}</div><span>Device</span><div>${esc(devLine(t)||'–')}${(t.device&&t.device.brand)?' · '+esc(t.device.brand):''}</div><span>Technician</span><div>${esc(t.techName||'–')}</div><span>Received</span><div>${dt(first)||esc(t.receivedDate||'')}</div>${t.note?`<span>Note</span><div>${esc(t.note)}</div>`:''}${t.noRepair?`<span>No repair</span><div>${esc(t.noRepair.reason||'')} ${esc(t.noRepair.note||'')}</div>`:''}</div>
 ${(t.items||[]).length?`<h4 style="margin:14px 0 6px">Parts used</h4>${t.items.map(i=>`<div style="display:flex;justify-content:space-between;font-size:14px"><span>${esc(i.name)} × ${i.qty}</span><span>${fm(i.price*i.qty)}</span></div>`).join('')}`:''}
 <h4 style="margin:14px 0 6px">Movements</h4><ul class="tl">${h.map(x=>`<li>${chip(x.s)} <small>${dt(x.t)}</small></li>`).join('')}</ul></div>
 <div class="pn" id="pp">${done?`<h3>✅ Already handed over</h3><div class="okb">Returned ${dt(t.handover&&t.handover.at)} by ${esc((t.handover&&t.handover.by)||'')}<br>Paid ${fm(num(t.paidTotal))}${num(t.handover&&t.handover.credit)>0?` · <b>On account: ${fm(t.handover.credit)}</b>`:''}${t.rating?`<br>Rating: ${'★'.repeat(t.rating)}${'☆'.repeat(5-t.rating)}`:''}</div><button id="pc" style="margin-bottom:8px">🖨 Print hand-over certificate</button> <button class="p" id="nx">Scan next device</button>`
 :`<h3>Hand over to customer</h3>${ready?'':`<div class="warn">⚠ This device is <b>${esc((STATUS[t.status]||[t.status])[0])}</b>, not ready yet.<br><label style="display:flex;gap:8px;align-items:center;margin-top:6px"><input type="checkbox" id="fo" style="width:auto"> Hand over anyway</label></div>`}
 <div class="kv"><span>Amount due</span><b class="big" style="font-size:24px">${fm(due)}</b></div>
 <div class="rg" style="margin-top:10px"><div><label>Amount collected now</label><input id="am" type="number" min="0" step="0.01" value="${due}"></div><div><label>Payment method</label><select id="pm"><option value="Cash">Cash</option><option value="Transfer">Transfer</option><option value="Cheque">Cheque</option><option value="CCP">CCP</option></select></div>
 <div id="rgw"><label>Cash register</label><select id="rg">${cash.map(r=>`<option value="${r.id}" ${dr&&r.id===dr.id?'selected':''}>${esc(r.name)}</option>`).join('')}</select></div>
 <div id="cw" class="warn" hidden></div><div id="dw" hidden><label>Customer will pay by (date)</label><input id="dd" type="date"></div>
 <div class="pn" style="padding:10px 12px"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="ls" style="width:auto" ${LOST?'checked':''}> Customer has no receipt (lost / forgotten) → sign a certificate</label><div id="lw" ${LOST?'':'hidden'} class="rg" style="margin-top:8px"><div><label>National ID number *</label><input id="idn" inputmode="numeric" autocomplete="off"></div><div><label>IMEI / serial (optional)</label><input id="imei" autocomplete="off"></div><div><label>Repair done</label><input id="rpd" value="${esc(t.problem||'')}"></div></div></div>
 <div><label>Customer rating (optional)</label><div class="stars" id="st">${[1,2,3,4,5].map(i=>`<b data-s="${i}">★</b>`).join('')}</div></div>
 <button class="p" id="ho" style="padding:14px;font-size:17px">✔ Hand over the device</button><button id="fc" type="button">Put the whole amount on credit (pay next time)</button></div>`}</div></div>`;
 if(t.photoCount){const bx=document.createElement('div');bx.className='pn';bx.innerHTML='<h3>📷</h3><div id="phs" style="display:flex;gap:8px;flex-wrap:wrap"></div>';document.querySelector('#vw .gd').append(bx);loadPhotos(db,t.code).then(l=>{$('phs').innerHTML=l.map((p,i)=>`<img src="${p.thumb}" data-v="${i}" style="width:84px;height:84px;object-fit:cover;border-radius:10px;cursor:zoom-in">`).join('');$('phs').querySelectorAll('[data-v]').forEach(e=>e.onclick=()=>lightbox(l,+e.dataset.v))})}
 if(done){$('nx').onclick=()=>{$('vw').innerHTML='';$('sc').focus()};$('pc').onclick=()=>printCert(t,{idNo:(t.handover&&t.handover.idNo)||'',imei:(t.handover&&t.handover.imei)||'',repair:(CERTX&&CERTX.repair)||t.problem||'',date:t.handover&&t.handover.at});return}
 const upd=()=>{ const a=Math.min(Math.max(0,num($('am').value)),due),rem=Math.max(0,due-a),cw=$('cw');cw.hidden=rem<0.005;cw.innerHTML=`On the customer's account (credit): <b>${fm(rem)}</b>`;$('dw').hidden=rem<0.005;$('rgw').hidden=$('pm').value!=='Cash'||a<=0};
 $('am').oninput=upd;$('pm').onchange=upd;$('fc').onclick=()=>{$('am').value=0;upd()};upd();
 $('st').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{rating=rating===+b.dataset.s?0:+b.dataset.s;$('st').querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',+x.dataset.s<=rating))});
 $('ls').onchange=()=>{$('lw').hidden=!$('ls').checked};$('ho').onclick=()=>handOver(due,ready)}
async function handOver(due,ready){const t=T,fo=$('fo');if(!ready&&!(fo&&fo.checked)){alert('This device is not ready. Tick “Hand over anyway” to continue.');return}
 const lost=$('ls').checked,rp=($('rpd')&&$('rpd').value||'').trim(),idNo=($('idn')&&$('idn').value||'').trim();if(lost&&!idNo){alert('Enter the customer’s national ID number for the certificate.');$('idn').focus();return}
 const a=Math.min(Math.max(0,num($('am').value)),due),rem=Math.round((due-a)*100)/100,m=$('pm').value,nm=((t.firstName||'')+' '+(t.lastName||'')).trim();
 if(rem>0.004&&!(await askYes(`${fm(rem)} will be put on ${nm}'s account (credit). Continue?`)))return;
 const b=$('ho');b.disabled=true;
 try{let cid=null,no=null;
  if(due>0||a>0){let c=CU.find(x=>dg(x.phone)&&dg(x.phone)===dg(t.phone));if(!c){cid=gen('C-');await setDoc(doc(db,'customers',cid),{name:nm||t.phone,firstName:t.firstName||'',lastName:t.lastName||'',phone:t.phone||'',type:'r',status:'active',source:'walkin',createdAt:serverTimestamp()});c={id:cid}}cid=c.id;
   if(due>0){no='REP-'+t.code;const date=today();await setDoc(doc(db,'deliveries',no),{no,status:'validated',who:nm,customerId:cid,date,subtotal:due,discount:0,total:due,paid:a,method:rem>0.004&&a<=0?'Credit':m,seller:user.email,note:'Repair '+t.code+' – '+(t.model||''),dueDate:($('dd')&&$('dd').value)||'',lines:[{sku:'',name:'Repair '+(t.model||'')+' ('+t.code+')',qty:1,price:due,cost:0,col:'repair'}],source:'repair',channel:'repair',ticket:t.code,by:user.email,createdAt:serverTimestamp()});
    if(m==='Cash'&&a>0){const r=RG.find(x=>x.id===($('rg')&&$('rg').value))||RG.find(x=>x.type==='cash');if(r)try{await setDoc(doc(db,'cashEntries','SALE_'+no),{registerId:r.id,date,time:new Date().toTimeString().slice(0,8),kind:'in',amount:a,source:'SALE',ref:no,mode:'Cash',remark:nm,by:user.email,createdAt:serverTimestamp()})}catch(e){console.warn('cash entry',e.message)}}}}
  const now=Date.now(),paidTotal=num(t.paidTotal)+a;
  await updateDoc(doc(db,'tickets',t.code),{status:'returned',paidTotal,handover:{at:now,by:user.email,paid:a,credit:rem,method:m,invoice:no||'',customerId:cid||'',...(lost?{noReceipt:true,idNo,imei:($('imei').value||'').trim()}:{})},...(rating?{rating,ratedAt:now}:{}),history:arrayUnion({s:'returned',t:now}),updatedAt:serverTimestamp()});
  try{await setDoc(doc(db,'tracking',t.code),{status:'returned'},{merge:true})}catch(_){}
  logAudit('ticket.handover',t.code+' · paid '+a+(rem>0?' · credit '+rem:''));
  const s=await getDoc(doc(db,'tickets',t.code)),d2=s.data();CERTX={idNo,imei:(d2.handover&&d2.handover.imei)||'',repair:rp};show(d2);if(lost){try{await printCert(d2,CERTX)}catch(er){alert('Print failed: '+er.message)}}}
 catch(e){alert('Could not complete the hand-over: '+e.message);b.disabled=false}}
/* camera */
$('cm').onclick=async()=>{if(stream){stop();return}
 try{const nc=await nativeScan(['CODE_128','QR_CODE']);if(nc!==null){if(nc)find(nc);return}}catch(e){alert('Camera not available: '+e.message);return}if(!('BarcodeDetector' in window)){alert('Camera scanning is not supported in this browser. Use a barcode scanner (it types the code here) or type the code.');return}
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=$('hv');v.srcObject=stream;v.style.display='block';await v.play();const det=new BarcodeDetector({formats:['code_128','qr_code']});timer=setInterval(async()=>{try{const r=await det.detect(v);if(r.length){const c=r[0].rawValue;stop();find(c)}}catch(_){}},400)}catch(e){alert('Camera not available: '+e.message);stop()}};
function stop(){clearInterval(timer);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('hv').style.display='none'}
</script></body></html>
