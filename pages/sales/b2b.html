<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><!--boot--><style id="fouc">html{visibility:hidden}</style><script>setTimeout(function(){var f=document.getElementById('fouc');f&&f.remove()},5000)</script><link rel="modulepreload" href="../../js/common.js?v=72"><link rel="modulepreload" href="../../js/ui.js?v=72"><link rel="modulepreload" href="../../js/firebase-config.js?v=72"><link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"><link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"><link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"><!--/boot--><title>Mahdi Repair – Wholesale clients</title>
<link rel="stylesheet" href="../../css/common.css?v=72"><style>#tabs{display:none!important}main{max-width:none!important;padding:10px 14px!important}
.bh{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.bh h2{margin:0 12px 0 0}.bh input,.bh select{width:auto;min-width:140px}.vt button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}.kc{--c:#2563eb;background:color-mix(in srgb,var(--c) 11%,var(--card));border:1px solid color-mix(in srgb,var(--c) 22%,var(--line));border-radius:14px;padding:12px 16px;cursor:pointer}.kc.on{box-shadow:0 0 0 2px var(--c)}.kc span{color:var(--mut);font-size:13.5px;display:block}.kc b{font-size:28px}
.pill{display:inline-block;padding:2px 11px;border-radius:99px;font-size:12.5px;font-weight:700;color:#fff;background:#64748b}.pill.pending{background:#f59e0b}.pill.approved{background:#16a34a}.pill.blocked{background:#dc2626}
td small{color:var(--mut)}.acts{display:flex;gap:6px;flex-wrap:wrap}.acts button{padding:5px 10px;font-size:13px}table input[type=number],table select{width:auto;min-width:0}
.note{background:color-mix(in srgb,var(--ac) 9%,var(--card));border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:14px;line-height:1.5}
</style></head><body><main>
<div class="bh"><h2>🏢 Wholesale clients</h2><span class="vt"><button data-v="cl" class="on">Clients &amp; requests</button> <button data-v="ac">Shop accounts</button> <button data-v="pl">Price lists</button></span><div style="flex:1"></div><input id="q" placeholder="Search name, company, phone…"></div>
<div id="vw"></div></main>
<script type="module">
import {$,waBtn,esc,db,start,money,hit,norm,logAudit,user,num,askYes,priceOf} from "../../js/common.js?v=72";
import {syncAll,tierOps} from "../../js/shopsync.js?v=72";
import {collection,onSnapshot,doc,setDoc,updateDoc,deleteDoc,getDocs,writeBatch,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const TI=[['r','Retail price'],['w','Wholesale price'],['p','Repair price']];let B=[],SC=[],TP=[],SI=[],view='cl',sf='',busy=false;
start(()=>{onSnapshot(collection(db,'b2b'),s=>{B=s.docs.map(d=>({...d.data(),id:d.id}));draw()},e=>console.warn(e.message));
 onSnapshot(collection(db,'shopCustomers'),s=>{SC=s.docs.map(d=>({...d.data(),id:d.id}));draw()},e=>console.warn(e.message));
 onSnapshot(collection(db,'tierPrices'),s=>{TP=s.docs.map(d=>({...d.data(),id:d.id}));if(view==='pl')draw()},e=>console.warn(e.message));
 onSnapshot(collection(db,'shopItems'),s=>{SI=s.docs.map(d=>({...d.data(),id:d.id}));if(view==='pl')draw()},e=>console.warn(e.message))});
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;document.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('on',x===b));draw()});$('q').oninput=draw;
const ts=c=>c&&c.toDate?c.toDate().toLocaleDateString():'',inv=id=>SC.find(x=>x.id===id)||{};
const set=async(id,d,log)=>{try{await updateDoc(doc(db,'b2b',id),{...d,updatedBy:user.email,updatedAt:serverTimestamp()});logAudit('b2b.update',(B.find(x=>x.id===id)||{}).name+' · '+(log||Object.keys(d).join(',')))}catch(e){alert(e.message)}};
function draw(){const q=norm($('q').value),v=$('vw');
 if(view==='cl'){const n=s=>B.filter(b=>b.status===s).length,L=B.filter(b=>(!sf||b.status===sf)&&(!q||hit(norm([b.name,b.company,b.phone,b.email].join(' ')),q))).sort((a,b)=>(a.status==='pending'?0:1)-(b.status==='pending'?0:1)||((b.createdAt&&b.createdAt.seconds)||0)-((a.createdAt&&a.createdAt.seconds)||0));
  v.innerHTML=`<div class="kp">${[['','All clients',B.length,'#2563eb'],['pending','Waiting approval',n('pending'),'#f59e0b'],['approved','Approved',n('approved'),'#16a34a'],['blocked','Blocked',n('blocked'),'#dc2626']].map(([k,l,c,col])=>`<div class="kc ${sf===k?'on':''}" style="--c:${col}" data-f="${k}"><span>${l}</span><b>${c}</b></div>`).join('')}</div>
  <div class="note">Guests and clients without approval only see the <b>retail price</b>. For an approved client choose which price list they see (<b>Wholesale</b>, <b>Repair</b> or Retail) and optionally a % discount on top. Changes apply the next time the client opens the shop.</div>
  <div class="card"><table><thead><tr><th>Client</th><th>Contact</th><th>Status</th><th>Price list</th><th>Extra discount %</th><th>Since</th><th>Actions</th></tr></thead><tbody>${L.map(b=>`<tr><td><b>${esc(b.name||'–')}</b><br><small>${esc(b.company||'')}</small></td><td>${esc(b.phone||'')}${waBtn(b.phone)}<br><small>${esc(b.email||'')}</small></td><td><span class="pill ${b.status}">${b.status==='pending'?'Waiting':b.status==='approved'?'Approved':'Blocked'}</span></td>
  <td><select data-t="${b.id}">${TI.map(([k,l])=>`<option value="${k}" ${b.tier===k?'selected':''}>${l}</option>`).join('')}</select></td><td><input type="number" min="0" max="90" step="0.5" style="width:80px" data-d="${b.id}" value="${num(b.discount)}"></td><td><small>${ts(b.createdAt)}</small></td>
  <td><div class="acts">${b.status!=='approved'?`<button class="p" data-a="${b.id}">Approve</button>`:''}${b.status!=='blocked'?`<button data-b="${b.id}">Block</button>`:''}<button class="d" data-x="${b.id}">Delete</button></div></td></tr>`).join('')||'<tr><td colspan="7">No wholesale requests yet. Clients request access from their account page in the online shop.</td></tr>'}</tbody></table></div>`;
  v.querySelectorAll('[data-f]').forEach(e=>e.onclick=()=>{sf=e.dataset.f;draw()});
  v.querySelectorAll('[data-a]').forEach(e=>e.onclick=()=>{const b=B.find(x=>x.id===e.dataset.a);set(b.id,{status:'approved',tier:b.tier==='r'?'w':b.tier,approvedBy:user.email,approvedAt:serverTimestamp()},'approved')});
  v.querySelectorAll('[data-b]').forEach(e=>e.onclick=()=>set(e.dataset.b,{status:'blocked'},'blocked'));
  v.querySelectorAll('[data-t]').forEach(e=>e.onchange=()=>set(e.dataset.t,{tier:e.value},'price list '+e.value));
  v.querySelectorAll('[data-d]').forEach(e=>e.onchange=()=>set(e.dataset.d,{discount:Math.min(90,Math.max(0,num(e.value)))},'discount '+e.value));
  v.querySelectorAll('[data-x]').forEach(e=>e.onclick=async()=>{const b=B.find(x=>x.id===e.dataset.x);if(!(await askYes('Remove wholesale access of '+(b.name||b.email)+'?')))return;try{await deleteDoc(doc(db,'b2b',b.id));logAudit('b2b.delete',b.name||b.email)}catch(x){alert(x.message)}})}
 else if(view==='ac'){const have=new Set(B.map(b=>b.id)),L=SC.filter(c=>!have.has(c.id)&&(!q||hit(norm([c.name,c.phone,c.email].join(' ')),q)));
  v.innerHTML=`<div class="note">Online-shop customers who do not have wholesale access yet. Give access to a customer you know — they will then see the price list you choose.</div><div class="card"><table><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th></th></tr></thead><tbody>${L.map(c=>`<tr><td><b>${esc(c.name||'–')}</b></td><td>${esc(c.phone||'')}</td><td>${esc(c.email||'')}</td><td><button class="p" data-g="${c.id}">Give wholesale access</button></td></tr>`).join('')||'<tr><td colspan="4">Nothing to show.</td></tr>'}</tbody></table></div>`;
  v.querySelectorAll('[data-g]').forEach(e=>e.onclick=async()=>{const c=SC.find(x=>x.id===e.dataset.g);try{await setDoc(doc(db,'b2b',c.id),{name:c.name||'',phone:c.phone||'',company:'',email:c.email||'',status:'approved',tier:'w',discount:0,createdAt:serverTimestamp(),approvedBy:user.email,approvedAt:serverTimestamp()});logAudit('b2b.grant',c.name||c.email)}catch(x){alert(x.message)}})}
 else{const bt={w:{},p:{}};TP.forEach(t=>{if(bt[t.tier])bt[t.tier][t.sid]=num(t.price)});const L=SI.filter(i=>!q||hit(norm([i.title,i.brand,i.category,i.model].join(' ')),q)).slice(0,300);
  v.innerHTML=`<div class="note">Prices come from your stock (<b>Normal</b>, <b>Wholesale</b> and <b>Repair</b> price of each part/accessory). Press <b>Publish</b> after changing prices in stock. An item without a price in a list is shown at retail price. <b>Buying prices are never published.</b><br>
  <button class="p" id="pub" style="margin-top:8px" ${busy?'disabled':''}>${busy?'Publishing…':'↻ Publish price lists to the shop'}</button> <small id="pg"></small></div>
  <div class="card"><table><thead><tr><th>Item</th><th>Retail (guests)</th><th>Wholesale</th><th>Repair</th></tr></thead><tbody>${L.map(i=>`<tr><td>${esc(i.title)}<br><small>${esc(i.brand||'')} ${esc(i.category||'')}</small></td><td>${money(i.price)}</td><td>${bt.w[i.id]!=null?money(bt.w[i.id]):'<small>= retail</small>'}</td><td>${bt.p[i.id]!=null?money(bt.p[i.id]):'<small>= retail</small>'}</td></tr>`).join('')||'<tr><td colspan="4">No shop items yet. Publish your catalog from the Online orders page first.</td></tr>'}</tbody></table><small>${SI.length} items online · ${Object.keys(bt.w).length} wholesale prices · ${Object.keys(bt.p).length} repair prices${SI.length>300?' · showing 300':''}</small></div>`;
  $('pub').onclick=async()=>{busy=true;draw();try{const n=await syncAll(true,k=>{const e=$('pg');if(e)e.textContent=k+'…'});logAudit('b2b.publish',n+' items');alert('Published: '+n+' items.')}catch(x){alert('Publish failed: '+x.message)}busy=false;draw()}}}
</script></body></html>
