const fm=money,today=()=>new Date().toISOString().slice(0,10),sec=x=>x&&x.createdAt&&x.createdAt.seconds||0,day=x=>x&&x.toDate?x.toDate().toISOString().slice(0,10):'';
let C=[],D=[],R=[],P=[],T=[],SC=[],O=[],B=[],regs=[],LOY=cleanLoyalty(LOYALTY_DEFAULT),TK=()=>[],sel=null,seg=null,want=null,ready=false,INV=null,EL=[],CAT=null,PE=null;
/* who sees which client database (follows the database rules: tickets = reception side, shop accounts and orders = sales side) */

const sub=(n,f)=>onSnapshot(collection(db,n),s=>{f(s.docs.map(d=>({...d.data(),_id:d.id,id:d.id})));draw()},e=>console.warn(n,e.message));

 sub('customers',x=>C=x);sub('deliveries',x=>D=x);sub('returns',x=>R=x);sub('payments',x=>P=x);

/* ---- ledger (invoices, returns, payments) ---- */
function ledger(c){const rows=[];
 D.filter(d=>d.customerId===c.id).forEach(d=>rows.push({k:'inv',d,date:d.date||'',s:sec(d),no:d.no,debit:num(d.total),credit:num(d.paid)}));
 R.filter(r=>r.kind==='sale'&&r.customerId===c.id).forEach(r=>rows.push({k:'ret',r,date:r.date||'',s:sec(r),no:r.no,debit:num(r.refund&&r.refund.amount),credit:num(r.total)}));
 P.filter(p=>p.customerId===c.id).forEach(p=>rows.push({k:'pay',p,date:p.date||'',s:sec(p),no:p.ref||'Payment',debit:0,credit:num(p.amount)}));
 rows.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.s-b.s||({inv:0,ret:1,pay:2}[a.k]-{inv:0,ret:1,pay:2}[b.k]));let bal=0;rows.forEach(r=>{bal+=r.debit-r.credit;r.bal=bal});return {rows,bal,inv:rows.filter(r=>r.k==='inv').reduce((a,r)=>a+r.debit,0),ret:rows.filter(r=>r.k==='ret').reduce((a,r)=>a+r.credit,0),paid:rows.reduce((a,r)=>a+(r.k==='inv'?r.credit:r.k==='pay'?r.credit:0),0)}}
const bcls=b=>b>0.004?'r':b<-0.004?'g':'z',btxt=b=>b>0.004?fm(b):b<-0.004?fm(-b)+' (credit)':fm(0),bsh=b=>b>0.004?fm(b):b<-0.004?'+'+fm(-b):'';
function ledgerHtml(L){return `<div style="overflow:auto;max-height:calc(100vh - 330px)"><table class="lg2"><thead><tr><th>Date</th><th>Type</th><th>No.</th><th class="n">Debit (owed)</th><th class="n">Credit (paid / returned)</th><th class="n">Balance</th></tr></thead><tbody>
 <tr><td colspan="2"><span class="tp op">Start</span></td><td></td><td class="n"></td><td class="n"></td><td class="n">${fm(0)}</td></tr>
 ${L.rows.map(r=>`<tr class="rw" data-k="${r.k}" data-i="${esc(r.k==='inv'?r.d._id:r.k==='ret'?r.r._id:r.p._id)}"><td>${esc(r.date)}</td><td><span class="tp ${r.k}">${r.k==='inv'?'Invoice':r.k==='ret'?'Return':'Payment'}</span></td><td>${esc(r.no)}${r.k==='inv'&&r.d.lines?'<br><small style="color:var(--mut)">'+r.d.lines.slice(0,3).map(l=>l.qty+'× '+esc(l.name)).join(', ')+(r.d.lines.length>3?'…':'')+'</small>':''}</td><td class="n">${r.debit?fm(r.debit):''}</td><td class="n">${r.credit?fm(r.credit):''}</td><td class="n"><b class="db ${bcls(r.bal)}">${r.bal<-0.004?'-':''}${fm(Math.abs(r.bal))}</b></td></tr>`).join('')||'<tr><td colspan="6" style="color:var(--mut)">No transactions yet.</td></tr>'}</tbody></table></div><p style="color:var(--mut);font-size:12.5px;margin:8px 0 0">Click a line to open it. Changing or removing an invoice or payment recalculates the whole history.</p>`}

 const used=new Set(),L=SC.map(sc=>{const c=C.find(x=>segOf(x)==='online'&&x.shopUid===sc.id);if(c)used.add(c.id);return {key:'u:'+sc.id,sc,c,name:(c&&fullName(c))||sc.name||sc.email||'–',phone:(c&&c.phone)||sc.phone||'',email:(c&&c.email)||sc.email||''}});
 C.filter(c=>segOf(c)==='online'&&!used.has(c.id)).forEach(c=>L.push({key:c.id,c,name:fullName(c),phone:c.phone||'',email:c.email||''}));return L}

 $('ls').innerHTML=L.slice(0,400).map(it=>{const {i,c}=it;let sub,right;

   g.t.forEach(t=>ops.push(b=>b.update(doc(db,'tickets',t.id),{customerId:id})));if(ops.length>=400)await flush()}
  await flush();logAudit('customer.import',nNew+' new · '+un.length+' tickets');alert(`Done: ${nNew} new client(s), ${un.length} ticket(s) linked.`)}
