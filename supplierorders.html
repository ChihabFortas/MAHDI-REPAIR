<script type="module">
import {$,esc,db,start,money,num,norm,gen,nextNo,logAudit,user,role,profile,canManage,watchParts,SHOP,hit,listNav,askYes,goPage} from "./js/common.js?v=72";
import {collection,onSnapshot,doc,setDoc,deleteDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
let D=[],S=[],parts=[],prods=[],ready=0,sid='';
let cur=null,mode='new',L=[],sel=-1,sup=null,fi=0,FR=[],busy=false;
const fm=money,today=()=>new Date().toISOString().slice(0,10),sec=d=>d.createdAt?.seconds||9e9;
const usr=d=>String(d.by||'').split('@')[0].toUpperCase(),colOf=s=>prods.some(p=>p.id===s)?'products':'parts';
const items=()=>[...prods.map(p=>({...p,col:'products'})),...parts.map(p=>({...p,col:'parts'}))];
const lget=(col,id)=>(col==='products'?prods:parts).find(p=>p.id===id);
const ST={open:'Open',partial:'Partly received',received:'Received',cancelled:'Cancelled'},poStat=o=>o.status==='cancelled'?'cancelled':(o.lines||[]).every(l=>num(l.received)>=num(l.qty))?'received':(o.lines||[]).some(l=>num(l.received)>0)?'partial':'open';
const toast=m=>{const t=$('ts');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2600)};
start(()=>{if(!canManage()){alert('Supplier orders are for managers and admins.');return}
 onSnapshot(collection(db,'purchaseOrders'),s=>{D=s.docs.map(d=>({...d.data(),_id:d.id}));lst();if(!ready++)route();else if(!$('vE').hidden)recalc()});
 onSnapshot(collection(db,'suppliers'),s=>{S=s.docs.map(d=>({...d.data(),id:d.id}));if(!$('vE').hidden)recalc()});
 onSnapshot(collection(db,'products'),s=>{prods=s.docs.map(d=>({...d.data(),id:d.id})).filter(p=>!p.hidden)});watchParts(p=>{parts=p})});
function route(){const h=decodeURIComponent(location.hash.slice(1));if(h==='new')openNew();else if(h&&D.find(d=>d.no===h))openNote(D.find(d=>d.no===h));else showL()}
addEventListener('hashchange',()=>{if(ready)route()});
const foc=f=>{try{if(parent!==window)parent.postMessage({rdGo:'supplierorders.html',focus:f},location.origin)}catch(_){}};
function showL(){$('vE').hidden=true;$('vL').hidden=false;foc(false);lst()}
function showE(){$('vL').hidden=true;$('vE').hidden=false;foc(true)}
/* journal */
function setPeriod(){const v=$('pe').value,t=today(),dt=n=>{const x=new Date();x.setDate(x.getDate()-n);return x.toISOString().slice(0,10)};let a=$('df').value,b=$('dt2').value;
 if(v==='today')a=b=t;else if(v==='yest')a=b=dt(1);else if(v==='week'){a=dt(6);b=t}else if(v==='month'){a=t.slice(0,8)+'01';b=t}else if(v==='all')a=b='';if(v!=='custom'){$('df').value=a;$('dt2').value=b}lst()}
$('pe').onchange=setPeriod;$('df').onchange=$('dt2').onchange=()=>{$('pe').value='custom';lst()};$('pe').value='all';$('df').value=$('dt2').value='';
function fillSel(id,vals,lab,map){const el=$(id),v=el.value,k=[...new Set(vals.filter(Boolean))].sort();el.innerHTML=`<option value="">${lab}</option>`+k.map(x=>`<option value="${esc(x)}">${esc(map?map[x]||x:x)}</option>`).join('');el.value=k.includes(v)?v:''}
function view(){const q=norm($('lq').value),u=$('fu').value,c=$('fc').value,m=$('fm').value,a=$('df').value,b=$('dt2').value;
 return D.filter(d=>(!a||d.date>=a)&&(!b||d.date<=b)&&(!u||usr(d)===u)&&(!c||(d.supplierName||'')===c)&&(!m||d.status===m)&&(!q||hit(norm(d.no+' '+d.supplierName+' '+(d.lines||[]).map(l=>l.name+' '+l.sku).join(' ')),q)))
  .sort((x,y)=>x.date>y.date?1:x.date<y.date?-1:sec(x)-sec(y)||(x.no>y.no?1:-1))}
const qty0=x=>(x.lines||[]).reduce((a,l)=>a+num(l.qty),0),rec0=x=>(x.lines||[]).reduce((a,l)=>a+num(l.received),0),left0=x=>x.status==='cancelled'?0:(x.lines||[]).reduce((a,l)=>a+Math.max(0,num(l.qty)-num(l.received))*num(l.price),0);
function lst(){if($('vL').hidden)return;fillSel('fu',D.map(usr),'All users');fillSel('fc',D.map(d=>d.supplierName),'All suppliers');fillSel('fm',D.map(d=>d.status),'All statuses',ST);
 const V=view();if(!V.find(d=>d._id===sid))sid=V.length?V[V.length-1]._id:'';
 $('mt').innerHTML=`<table class="gt"><thead><tr><th>N°</th><th>Date</th><th>Expected</th><th>Supplier</th><th>Items</th><th>Qty ordered</th><th>Qty received</th><th>Total</th><th>Status</th><th>User</th></tr></thead><tbody>`+
  V.map(d=>`<tr data-id="${esc(d._id)}" class="${d._id===sid?'on':''}"><td><b>${esc(d.no)}</b></td><td>${esc(d.date||'')}</td><td>${esc(d.expected||'')}</td><td class="l">${esc(d.supplierName||'')}</td><td>${(d.lines||[]).length}</td><td>${qty0(d)}</td><td>${rec0(d)}</td><td class="n"><b>${fm(d.total)}</b></td><td><span class="st ${d.status}">${ST[d.status]||d.status}</span></td><td>${esc(usr(d))}</td></tr>`).join('')+(V.length?'':'<tr><td colspan="10" style="padding:30px;color:var(--mut)">No supplier orders for this selection.</td></tr>')+'</tbody></table>';
 $('mt').querySelectorAll('tbody tr[data-id]').forEach(r=>{r.onclick=()=>{sid=r.dataset.id;$('mt').querySelectorAll('tr.on').forEach(x=>x.classList.remove('on'));r.classList.add('on');detail()};r.ondblclick=()=>{sid=r.dataset.id;openSel()}});
 const on=$('mt').querySelector('tr.on');if(on)on.scrollIntoView({block:'nearest'});detail();
 $('t1').value=fm(V.filter(x=>x.status!=='cancelled').reduce((a,x)=>a+num(x.total),0));$('t3').value=fm(V.reduce((a,x)=>a+left0(x),0));$('t4').value=V.filter(x=>['open','partial'].includes(x.status)).length;
 $('sb1').innerHTML=`<span>Orders: <b>${V.length}</b></span><span>Products: <b>${V.reduce((a,x)=>a+(x.lines||[]).length,0)}</b></span><span>Total quantity: <b>${V.reduce((a,x)=>a+qty0(x),0)}</b></span>`}
function detail(){const d=D.find(x=>x._id===sid);if(!d){$('dw').innerHTML='<div class="dh">Select an order to see its lines.</div>';return}
 $('dw').innerHTML=`<div class="dh"><b>${esc(d.no)}</b> · ${esc(d.supplierName||'')} · ${esc(d.date||'')}${d.notes?' · 📝 '+esc(d.notes):''}</div><table class="gt"><thead><tr><th>N°</th><th>Code</th><th>Designation</th><th>Ordered</th><th>Received</th><th>Purchase price</th><th>Amount</th></tr></thead><tbody>`+
  (d.lines||[]).map((l,i)=>`<tr><td>${i+1}</td><td>${esc(l.sku)}</td><td class="l">${esc(l.name)}</td><td><b>${num(l.qty)}</b></td><td>${num(l.received)}</td><td class="n">${fm(l.price)}</td><td class="n">${fm(num(l.qty)*num(l.price))}</td></tr>`).join('')+'</tbody></table>'}
['lq','fu','fc','fm'].forEach(i=>$(i).oninput=$(i).onchange=lst);$('bRef').onclick=()=>{$('lq').value='';['fu','fc','fm'].forEach(i=>$(i).value='');$('pe').value='all';setPeriod()};
const nav=k=>{const V=view();if(!V.length)return;let i=V.findIndex(d=>d._id===sid);i=Math.min(V.length-1,Math.max(0,i+(k==='n'?1:-1)));sid=V[i]._id;lst()};
function openSel(){const d=D.find(x=>x._id===sid);if(d)openNote(d)}
const recv=d=>{if(!d)return;if(!['open','partial'].includes(d.status)){alert('This order has nothing left to receive.');return}goPage('receiving.html#po:'+d._id,true)};
$('bNew').onclick=()=>openNew();$('bOpen').onclick=openSel;$('bRecv').onclick=()=>recv(D.find(x=>x._id===sid));$('bPrint').onclick=()=>{const d=D.find(x=>x._id===sid);if(d)printNote(d)};
$('bCan').onclick=async()=>{const d=D.find(x=>x._id===sid);if(!d)return;if(d.status==='received'||d.status==='cancelled'){alert('This order cannot be cancelled.');return}if(!(await askYes('Cancel order '+d.no+'?','Cancel order','Keep')))return;try{await setDoc(doc(db,'purchaseOrders',d._id),{status:'cancelled'},{merge:true});logAudit('po.cancel',d.no)}catch(e){alert(e.message)}};
$('bDel').onclick=async()=>{const d=D.find(x=>x._id===sid);if(!d)return;if(role!=='admin'){alert('Only an admin can delete supplier orders.');return}if(!(await askYes('Delete order '+d.no+'?')))return;try{await deleteDoc(doc(db,'purchaseOrders',d._id));logAudit('po.delete',d.no);toast('Deleted '+d.no)}catch(e){alert(e.message)}};
$('bCsv').onclick=()=>{const V=view(),q=x=>'"'+String(x??'').replace(/"/g,'""')+'"',rows=[['No','Date','Expected','Supplier','Items','Qty ordered','Qty received','Total','Status','User'].map(q).join(',')];
 V.forEach(d=>rows.push([d.no,d.date,d.expected||'',d.supplierName,(d.lines||[]).length,qty0(d),rec0(d),num(d.total),ST[d.status]||d.status,usr(d)].map(q).join(',')));
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+rows.join('\r\n')],{type:'text/csv'}));a.download='supplier-orders-'+today()+'.csv';a.click()};
/* editor */
const editable=()=>mode!=='view';
const tot=()=>L.reduce((a,l)=>a+num(l.qty)*num(l.price),0);
function resetForm(){cur=null;mode='new';L=[];sel=-1;sup=null;$('dd').value=today();$('ex').value='';$('note').value='';$('cq').value='';$('cqty').value=1;$('fr').style.display='none'}
function openNew(){resetForm();$('no').value='(assigned on validation)';showE();lock();drawE();$('cq').focus()}
function openNote(d){resetForm();cur=d;mode='view';L=(d.lines||[]).map(x=>({...x,col:x.col||colOf(x.sku),received:num(x.received)}));sup=S.find(s=>s.id===d.supplierId)||{id:d.supplierId||null,name:d.supplierName,_ghost:1};
 $('no').value=d.no;$('dd').value=d.date||today();$('ex').value=d.expected||'';$('note').value=d.notes||'';showE();lock();drawE()}
function lock(){const ed=editable();document.querySelectorAll('#vE .lk').forEach(e=>e.disabled=!ed);$('eSave').disabled=!ed;$('eEdit').hidden=!(mode==='view'&&cur&&cur.status==='open');$('eRecv').hidden=!(cur&&['open','partial'].includes(cur.status));$('eNP').disabled=!ed;$('bIns').disabled=$('bMod').disabled=$('bRm').disabled=!ed}
function drawE(){if($('vE').hidden)return;
 $('lt').innerHTML=`<table class="gt"><thead><tr><th>N°</th><th>Product code</th><th>Designation</th><th>Qty</th><th>Received</th><th>Purchase price</th><th>Amount</th><th>Stock</th><th></th></tr></thead><tbody>`+
  L.map((l,i)=>{const p=lget(l.col,l.sku);return `<tr data-i="${i}" class="${i===sel?'on':''}"><td>${i+1}</td><td>${esc(l.sku)}</td><td class="l">${esc(l.name)}</td><td><input type="number" min="1" step="1" value="${l.qty}" data-q="${i}" ${editable()?'':'disabled'}></td><td>${num(l.received)}</td><td><input type="number" min="0" step="0.01" value="${l.price}" data-p="${i}" ${editable()?'':'disabled'}></td><td class="n am">${fm(num(l.qty)*num(l.price))}</td><td>${p?num(p.qty):'?'}</td><td class="ex"><button type="button" data-x="${i}" ${editable()?'':'disabled'}>✕</button></td></tr>`}).join('')+(L.length?'':'<tr><td colspan="9" style="padding:40px;color:var(--mut)">Scan a barcode or search a product above to add lines.</td></tr>')+'</tbody></table>';
 const T=$('lt');T.querySelectorAll('tbody tr[data-i]').forEach(r=>r.onclick=()=>{sel=+r.dataset.i;T.querySelectorAll('tr.on').forEach(x=>x.classList.remove('on'));r.classList.add('on')});
 T.querySelectorAll('[data-q]').forEach(x=>x.oninput=()=>{L[+x.dataset.q].qty=Math.max(1,Math.floor(num(x.value))||1);upd(x)});
 T.querySelectorAll('[data-p]').forEach(x=>x.oninput=()=>{L[+x.dataset.p].price=num(x.value);upd(x)});
 T.querySelectorAll('[data-x]').forEach(x=>x.onclick=()=>{L.splice(+x.dataset.x,1);sel=Math.min(sel,L.length-1);drawE()});recalc()}
function upd(x){const i=+(x.dataset.q??x.dataset.p),tr=x.closest('tr'),l=L[i];tr.querySelector('.am').textContent=fm(num(l.qty)*num(l.price));recalc()}
function recalc(){$('tp').value=fm(tot());if(sup){$('cn').value=sup.name;$('cinfo').innerHTML=esc(sup.phone||'')}else{$('cn').value='— choose a supplier —';$('cinfo').textContent=''}
 $('stt').innerHTML=cur?`<span class="st ${cur.status}">${ST[cur.status]||cur.status}</span>`:'<span class="st open">New</span>';
 $('sb2').innerHTML=`<span>User: <b>${esc(((profile&&profile.name)||(user&&user.email)||'').toUpperCase())}</b></span><span>Products: <b>${L.length}</b></span><span>Total quantity: <b>${L.reduce((a,l)=>a+num(l.qty),0)}</b></span>`}
function add(p,col,q=1){if(!editable())return;const l=L.find(x=>x.sku===p.id&&x.col===col);if(l){l.qty+=q;sel=L.indexOf(l)}else{L.push({col,sku:p.id,name:p.name,qty:q,price:num(p.buy),received:0});sel=L.length-1}$('cq').value='';$('cqty').value=1;$('fr').style.display='none';drawE();$('cq').focus();const r=$('lt').querySelector('tr.on');if(r)r.scrollIntoView({block:'nearest'})}
function find(q){q=norm(q);if(!q)return[];return items().filter(p=>hit(norm(p.id+' '+p.name+' '+(p.model||'')+' '+(p.brand||'')+' '+(p.aliases||[]).join(' ')),q)).slice(0,14)}
function drawFr(){FR=find($('cq').value);fi=Math.min(fi,Math.max(0,FR.length-1));const f=$('fr');if(!FR.length||!$('cq').value){f.style.display='none';return}
 f.innerHTML=FR.map((p,i)=>`<div class="${i===fi?'on':''}" data-i="${i}"><span><b>${esc(p.name)}</b> <small>${esc(p.id)} · ${esc(p.model||'')}</small></span><span><b>buy ${fm(p.buy)}</b> <small>${num(p.qty)} in stock</small></span></div>`).join('');f.style.display='block';
 f.querySelectorAll('[data-i]').forEach(d=>d.onmousedown=e=>{e.preventDefault();const p=FR[+d.dataset.i];add(p,p.col,Math.max(1,Math.floor(num($('cqty').value))||1))})}
$('cq').oninput=()=>{fi=0;drawFr()};$('cq').onblur=()=>setTimeout(()=>$('fr').style.display='none',120);
$('cq').onkeydown=e=>{if(e.key==='ArrowDown'){e.preventDefault();fi=Math.min(FR.length-1,fi+1);drawFr()}else if(e.key==='ArrowUp'){e.preventDefault();fi=Math.max(0,fi-1);drawFr()}else if(e.key==='Enter'){e.preventDefault();insert()}else if(e.key==='Escape'&&$('fr').style.display==='block'){e.stopPropagation();$('fr').style.display='none'}};
function insert(){const v=norm($('cq').value),q=Math.max(1,Math.floor(num($('cqty').value))||1);if(!v)return;const ex=items().find(p=>norm(p.id)===v||(p.aliases||[]).some(a=>norm(a)===v)),r=ex||find($('cq').value)[fi]||null;if(r)add(r,r.col,q);else toast('No product found for "'+$('cq').value+'" — use New product (Ctrl+N)')}
$('bIns').onclick=insert;$('bMod').onclick=()=>{if(sel<0&&L.length)sel=L.length-1;const i=$('lt').querySelector(`[data-q="${sel}"]`);if(i){i.focus();i.select()}};
$('bRm').onclick=()=>{if(sel>=0&&L[sel]){L.splice(sel,1);sel=Math.min(sel,L.length-1);drawE()}};
function drawC(){const q=norm($('cs').value),a=S.filter(c=>!q||hit(norm(c.name+' '+(c.phone||'')),q)).sort((x,y)=>String(x.name).localeCompare(y.name)).slice(0,60);
 $('cpk').innerHTML=a.map(c=>`<div data-c="${esc(c.id)}"><span><b>${esc(c.name)}</b> <small>${esc(c.phone||'')}</small></span></div>`).join('')||'<div>No suppliers</div>';
 $('cpk').querySelectorAll('[data-c]').forEach(d=>d.onclick=()=>{sup=S.find(c=>c.id===d.dataset.c);$('cdlg').close();recalc();$('cq').focus()})}
function pickS(){if(!editable())return;$('cs').value='';drawC();$('cdlg').showModal();$('cs').focus()}
$('cBtn').onclick=pickS;$('cs').oninput=drawC;$('cx').onclick=()=>$('cdlg').close();
$('nsv').onclick=async()=>{const n=$('nn').value.trim();if(!n)return;const id=gen('S-');try{await setDoc(doc(db,'suppliers',id),{name:n,phone:$('np').value.trim(),initial:0,createdAt:serverTimestamp()});sup={id,name:n,phone:$('np').value.trim(),initial:0};$('nn').value=$('np').value='';$('cdlg').close();recalc()}catch(e){alert(e.message)}};
$('eNP').onclick=()=>{if(!editable())return;$('npf').reset();$('npd').showModal()};$('npx').onclick=()=>$('npd').close();
$('npf').onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target)),id=(v.id||'').trim()||gen('A-'),d={name:v.name.trim(),model:v.model.trim(),brand:v.brand||'',buy:num(v.buy),wholesale:num(v.wholesale),normal:num(v.normal),minQty:num(v.minQty),qty:0,createdAt:serverTimestamp()};
 try{await setDoc(doc(db,'products',id),d);$('npd').close();add({...d,id},'products',1)}catch(x){alert(x.message)}};
async function save(){if(!editable()||busy)return;if(!sup||(!sup.id&&!sup._ghost)){alert('Choose a supplier (F4).');return}if(!L.length){alert('Add at least one product.');return}
 for(const l of L)if(num(l.qty)<num(l.received)){alert('"'+l.name+'": quantity cannot be lower than what was already received ('+num(l.received)+').');return}
 busy=true;$('eSave').disabled=true;
 try{const no=mode==='new'?await nextNo('PO'):cur.no,id=mode==='new'?gen('PO'):cur._id,lines=L.map(l=>({sku:l.sku,name:l.name,col:l.col,qty:num(l.qty),price:num(l.price),received:num(l.received)})),o={no,date:$('dd').value||today(),expected:$('ex').value||'',supplierId:sup.id||null,supplierName:sup.name,lines,total:tot(),notes:$('note').value.trim(),by:user.email};
  o.status=poStat({...o,lines});await setDoc(doc(db,'purchaseOrders',id),{...o,...(mode==='new'?{createdAt:serverTimestamp()}:{editedBy:user.email,editedAt:serverTimestamp()})},{merge:true});
  logAudit(mode==='new'?'po.create':'po.edit',no);toast('✔ Saved '+no+' — '+fm(o.total));if(mode==='new')openNew();else{sid=id;showL()}
 }catch(e){alert('Not saved: '+e.message)}busy=false;if(!$('vE').hidden)$('eSave').disabled=!editable()}
$('eSave').onclick=save;$('eNew').onclick=async()=>{if(L.length&&editable()&&!(await askYes('Discard the current order?')))return;openNew()};
$('eEdit').onclick=()=>{mode='edit';lock();drawE();$('cq').focus()};$('eRecv').onclick=()=>recv(cur);
$('ePrint').onclick=()=>{if(cur)printNote(mode==='view'?cur:{...cur,lines:L,total:tot()});else alert('Validate the order first, then print it.')};
$('eQuit').onclick=async()=>{if(editable()&&L.length&&!(await askYes('Leave without saving this order?')))return;showL()};
function printNote(d){const sp=S.find(s=>s.id===d.supplierId)||{};$('pa').innerHTML=`<div class="a4"><div class="h"><div><b style="font-size:20px">${esc(SHOP.name)}</b><br>${esc(SHOP.address||'')}<br>${esc(SHOP.phone||'')}</div><div style="text-align:end"><b style="font-size:18px">PURCHASE ORDER</b><br>N° <b>${esc(d.no)}</b><br>Date: ${esc(d.date||'')}${d.expected?'<br>Expected: '+esc(d.expected):''}</div></div><hr><div><b>Supplier:</b> ${esc(d.supplierName||'')}<br>${esc(sp.phone||'')} ${esc(sp.address||'')}</div>
 <table><thead><tr><th>N°</th><th>Code</th><th>Designation</th><th class="n">Qty</th><th class="n">Price</th><th class="n">Amount</th></tr></thead><tbody>${(d.lines||[]).map((l,i)=>`<tr><td>${i+1}</td><td>${esc(l.sku)}</td><td>${esc(l.name)}</td><td class="n">${num(l.qty)}</td><td class="n">${fm(l.price)}</td><td class="n">${fm(num(l.qty)*num(l.price))}</td></tr>`).join('')}</tbody></table>
 <div style="margin-inline-start:auto;width:240px"><div class="h"><b>TOTAL</b><b>${fm(d.total)}</b></div></div>${d.notes?`<p>Notes: ${esc(d.notes)}</p>`:''}<div class="sg"><span>Supplier</span><span>Buyer</span></div></div>`;
 let st=$('ps');if(!st){st=document.createElement('style');st.id='ps';document.head.appendChild(st)}st.textContent='@page{size:A4;margin:12mm}';setTimeout(()=>rdPrint('invoice'),150)}
addEventListener('keydown',e=>{if(document.querySelector('dialog[open]'))return;const inp=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName),L1=!$('vL').hidden,k=e.key;
 if(e.ctrlKey&&(k==='n'||k==='N')&&!L1){e.preventDefault();$('eNP').click();return}
 const fn={F1:()=>L1?openNew():$('eNew').click(),F2:()=>L1?openSel():$('eEdit').click(),F3:()=>L1||save(),F4:()=>L1||pickS(),F5:()=>L1?$('bPrint').click():$('ePrint').click(),F6:()=>L1?$('bRecv').click():$('eRecv').click(),F7:()=>L1||$('bMod').click()}[k];
 if(fn){e.preventDefault();fn();return}
 if(k==='Escape'&&!L1){e.preventDefault();$('eQuit').click();return}
 if(L1&&!inp){if(k==='ArrowDown'){e.preventDefault();nav('n')}else if(k==='ArrowUp'){e.preventDefault();nav('p')}else if(k==='Enter')openSel();else if(k==='Delete')$('bDel').click()}
 if(!L1&&!inp){if(k==='Delete')$('bRm').click();else if(k==='ArrowDown'&&sel<L.length-1){sel++;drawE()}else if(k==='ArrowUp'&&sel>0){sel--;drawE()}else if(k.length===1&&!e.ctrlKey&&!e.metaKey&&editable()){$('cq').focus()}}});
listNav('cs','#cpk [data-c]');
</script></body></html>
