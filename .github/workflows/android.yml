name: Build Android app
# Builds the Android app on every push and publishes it as the "android-latest" release.
# Download link for staff:  https://github.com/<owner>/<repo>/releases/download/android-latest/mahdi-repair.apk
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
concurrency: { group: android, cancel-in-progress: true }
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Site address (Pages URL of this repository, or the SITE_URL variable)
        env: { SITE: "${{ vars.SITE_URL || secrets.SITE_URL }}" }
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"; REPO="${GITHUB_REPOSITORY##*/}"
          URL="${SITE:-https://${OWNER,,}.github.io/${REPO}/app.html}"
          node -e "const f='capacitor.config.json',c=JSON.parse(require('fs').readFileSync(f));c.server.url='$URL';require('fs').writeFileSync(f,JSON.stringify(c,null,2));console.log('App opens',c.server.url)"
      - run: npm install --no-audit --no-fund
      - name: Create the native Android project
        run: npx cap add android
      - name: Same signing key every build (so phones update in place)
        run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
      - name: Firebase config for push notifications
        env: { GS: "${{ secrets.GOOGLE_SERVICES_JSON }}" }
        run: |
          if [ -n "$GS" ]; then echo "$GS" > android/app/google-services.json; else echo "No GOOGLE_SERVICES_JSON secret: building without push notifications"; fi
      - run: npx capacitor-assets generate --android --iconBackgroundColor '#0a0e11' --splashBackgroundColor '#0a0e11' || true
      - run: npx cap sync android
      - name: Camera and notification permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' $M || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' $M
      - name: Build APK
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk mahdi-repair.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest mahdi-repair.apk --title "Android app (latest)" --notes "Install this file on Android phones. Built from commit ${GITHUB_SHA::7}."
