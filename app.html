<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mahdi Repair</title>
<link rel="stylesheet" href="common.css"><style>
html,body{height:100%;margin:0;overflow:hidden}.app{display:grid;grid-template-columns:var(--sw,256px) 1fr;grid-template-rows:62px 1fr;height:100vh;height:100dvh;transition:grid-template-columns .25s ease}.app.mini{--sw:78px}
.side{grid-row:1/3;background:#1a2030;color:#cfd7ea;display:flex;flex-direction:column;overflow:hidden;z-index:40}
.brand{display:flex;align-items:center;gap:12px;padding:16px 18px;font-weight:800;font-size:17px;color:#fff;white-space:nowrap}.logo{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 55%,#8b5cf6));color:#fff;font-size:20px}
.nav{flex:1;overflow-y:auto;padding:6px 12px 12px}.ni{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;cursor:pointer;color:#cfd7ea;text-decoration:none;white-space:nowrap;margin:2px 0;user-select:none}.ni:hover{background:rgba(255,255,255,.07)}.ni.on{background:color-mix(in srgb,var(--ac) 32%,transparent);color:#fff;box-shadow:inset 3px 0 0 var(--ac)}
.ic{flex:none;width:26px;text-align:center;font-size:18px}.ch{margin-inline-start:auto;transition:transform .2s;opacity:.6}.grp.open>.gh .ch{transform:rotate(90deg)}.sub{display:none;padding-inline-start:16px}.grp.open>.sub{display:block}.si{display:block;padding:8px 12px 8px 26px;border-radius:10px;cursor:pointer;color:#a9b5cf;font-size:14px;white-space:nowrap}.si:hover{background:rgba(255,255,255,.07)}.si.on{color:#fff;background:rgba(255,255,255,.1)}
.app.mini .tx,.app.mini .ch,.app.mini .sub,.app.mini .bt{display:none}.app.mini .ni{justify-content:center}.foot{padding:12px 14px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px;color:#fff;font-size:13px;white-space:nowrap}.av{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--ac);font-weight:700}
.top{display:flex;align-items:center;gap:10px;padding:0 18px;background:var(--card);border-bottom:1px solid var(--line);z-index:20}.top h1{font-size:19px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top button,.top select{min-height:38px}
.main{position:relative;overflow:hidden}.fr{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:transparent}.fr.on{display:block}.ld{position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);pointer-events:none}
.app.focus{grid-template-columns:0 1fr;grid-template-rows:0 1fr}.app.focus .side,.app.focus .top{display:none}#fx{display:none;position:fixed;top:8px;inset-inline-end:12px;z-index:60;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:color-mix(in srgb,var(--card) 88%,transparent);color:var(--ink);box-shadow:0 4px 16px #0003;cursor:pointer;font-weight:600}.app.focus ~ #fx{display:block}
.scrim{display:none}@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:fixed;inset:0 auto 0 0;width:272px;transform:translateX(-102%);transition:transform .25s}.app.open .side{transform:none}.app.open~.scrim{display:block;position:fixed;inset:0;background:#0006;z-index:35}.top .hide-m{display:none}html[dir=rtl] .side{inset:0 0 0 auto;transform:translateX(102%)}html[dir=rtl] .app.open .side{transform:none}}
html[data-skin=glass] .side{background:rgba(18,22,40,.55);-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);border-inline-end:1px solid rgba(255,255,255,.14)}html[data-skin=glass] .top{background:rgba(255,255,255,.4);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);border-color:rgba(255,255,255,.5)}html[data-skin=glass][data-theme=dark] .top{background:rgba(24,30,48,.5);border-color:rgba(255,255,255,.12)}
html[data-skin=material] .side{background:color-mix(in srgb,var(--ac) 10%,var(--card));color:var(--ink)}html[data-skin=material] .ni,html[data-skin=material] .si{color:var(--ink)}html[data-skin=material] .ni.on{background:color-mix(in srgb,var(--ac) 30%,var(--card));color:var(--ink);box-shadow:none;border-radius:999px}html[data-skin=material] .top{background:color-mix(in srgb,var(--ac) 6%,var(--bg));border:0}html[data-skin=material] .foot{color:var(--ink);border-color:var(--line)}html[data-skin=material] .brand{color:var(--ink)}

header.top [hidden]{display:none!important}
header.top{color:var(--ink);gap:10px;padding:0 18px;overflow:visible!important;flex-wrap:nowrap!important;white-space:normal}
header.top h1{color:var(--ink);flex:1 1 auto!important;min-width:0;font-size:19px!important;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;width:42px;height:42px;min-height:42px;padding:0;display:inline-grid;place-items:center;flex:none;cursor:pointer}
header.top button:hover{background:color-mix(in srgb,var(--ac) 12%,var(--card))}
header.top button.p{background:var(--ac);border-color:var(--ac);color:#fff;width:auto;padding:0 16px;display:inline-flex;align-items:center;gap:8px;font-weight:600}
header.top select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;height:42px;min-height:42px;padding:0 10px;width:auto;flex:none}
.ic{display:grid;place-items:center}.ic svg{display:block}.ni .ic svg{opacity:.92}
@media(max-width:900px){header.top{padding:0 10px;gap:8px}header.top button.p{width:42px;padding:0;border-radius:12px}header.top .lbl{display:none}header.top h1{font-size:17px!important}}
</style></head><body>
<div class="app" id="app"><aside class="side"><div class="brand"><div class="logo">M</div><span class="tx" id="sn"></span></div><nav class="nav" id="nav"></nav><div class="foot"><div class="av" id="av"></div><div class="tx"><b id="un"></b><br><small id="ur" style="opacity:.7"></small></div></div></aside>
<header class="top"><button id="hb" title="Menu" aria-label="Menu"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><h1 id="tt">Dashboard</h1><button class="p" id="nt" title="New ticket" aria-label="New ticket"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M12 5v14M5 12h14"/></svg><span class="lbl">New ticket</span></button><button id="th" title="Theme" aria-label="Theme"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button><select id="lg" aria-label="Language"><option value="en">EN</option><option value="fr">FR</option><option value="ar">AR</option></select><button id="so" title="Sign out" aria-label="Sign out"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 8l-4 4 4 4M6 12h10"/></svg></button></header>
<div class="main" id="fm"><div class="ld" id="ld">…</div></div></div><button id="fx">✕ Exit POS</button><div class="scrim" id="sc"></div>
<script type="module">
if(window.self!==window.top){window.top.location.replace(location.href)}
import {$,auth,start,role,profile,user,PAGES,SHOP} from "./common.js";
import {S,save,apply,setLang} from "./ui.js";
import {signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const IC={"dash": "<path d=\"M3 3h8v8H3zM13 3h8v5h-8zM13 10h8v11h-8zM3 13h8v8H3z\"/>", "wrench": "<path d=\"M14.7 6.3a4 4 0 0 0-5.4 5.2L3 17.8V21h3.2l6.3-6.3a4 4 0 0 0 5.2-5.4l-2.6 2.6-2.4-.6-.6-2.4z\"/>", "cart": "<circle cx=\"9\" cy=\"20\" r=\"1.5\"/><circle cx=\"18\" cy=\"20\" r=\"1.5\"/><path d=\"M2 3h3l2.7 12.4a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L21 7H6\"/>", "box": "<path d=\"M21 8 12 3 3 8v8l9 5 9-5zM3 8l9 5 9-5M12 13v8\"/>", "users": "<circle cx=\"9\" cy=\"8\" r=\"3.5\"/><path d=\"M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5\"/><circle cx=\"17.5\" cy=\"9\" r=\"2.5\"/><path d=\"M17 14.6c2.4.2 4 1.7 4.5 4.4\"/>", "wallet": "<path d=\"M3 7a2 2 0 0 1 2-2h13v4\"/><path d=\"M3 7v11a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2z\"/><circle cx=\"16.5\" cy=\"14.5\" r=\"1.2\"/>", "gear": "<circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3 7 7M17 17l1.7 1.7M18.7 5.3 17 7M7 17l-1.7 1.7\"/>", "shield": "<path d=\"M12 3 4 6v6c0 4.5 3.2 7.8 8 9 4.8-1.2 8-4.5 8-9V6z\"/><path d=\"m9 12 2 2 4-4\"/>", "menu": "<path d=\"M4 6h16M4 12h16M4 18h16\"/>", "logout": "<path d=\"M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 8l-4 4 4 4M6 12h10\"/>", "moon": "<path d=\"M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z\"/>", "sun": "<circle cx=\"12\" cy=\"12\" r=\"4\"/><path d=\"M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6 19 19M5 19l1.4-1.4M17.6 6.4 19 5\"/>", "plus": "<path d=\"M12 5v14M5 12h14\"/>"},svg=(n,w=22)=>`<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" width="${w}" height="${w}">${IC[n]}</svg>`;
const MENU=[['dash','Dashboard','dashboard.html'],['wrench','Workshop',[['Reception desk','reception.html'],['New quote','quotes.html'],['Technician board','technician.html'],['Parts queue','partsqueue.html']]],
 ['cart','Sales',[['POS','pos.html#pos',1],['Customers & debts','pos.html#cus'],['Returns','pos.html#ret'],['Invoices','invoices.html']]],
 ['box','Inventory',[['Parts catalog','inventory.html#cat'],['Accessories','pos.html#acc'],['Receiving notes','inventory.html#rc'],['Movements','inventory.html#mv'],['Storage map','locations.html'],['Stock counts','stockmgmt.html'],['Suppliers','suppliers.html']]],
 ['users','Customers',[['CRM dashboard','crm.html'],['Customers & debts','pos.html#cus'],['Customer messages','admin.html#ms']]],['wallet','Finance',[['Treasury','treasury.html'],['Statistics','statistics.html'],['Bonus report','techreport.html']]],['gear','Settings','settings.html'],['shield','Admin panel','admin.html']];
const DEFP={reception:'dashboard.html',manager:'dashboard.html',admin:'dashboard.html',technician:'technician.html',inventory:'partsqueue.html'},frames={},app=$('app');
const ok=h=>{const a=PAGES[h.split('#')[0].split('?')[0]];return !a||a.includes(role)};let TITLES={};
function build(){$('sn').textContent=SHOP.name;$('un').textContent=(profile&&profile.name)||user.email;$('ur').textContent=role[0].toUpperCase()+role.slice(1);$('av').textContent=(((profile&&profile.name)||user.email)[0]||'?').toUpperCase();
 $('nav').innerHTML=MENU.map(([ic,l,t])=>{if(typeof t==='string'){return ok(t)?`<a class="ni" data-h="${t}"><span class="ic">${svg(ic)}</span><span class="tx">${l}</span></a>`:''}
  const L=t.filter(x=>ok(x[1]));if(!L.length)return '';return `<div class="grp"><a class="ni gh"><span class="ic">${svg(ic)}</span><span class="tx">${l}</span><span class="ch">›</span></a><div class="sub">${L.map(x=>`<a class="si" data-h="${x[1]}" ${x[2]?'data-f="1"':''}>${x[0]}</a>`).join('')}</div></div>`}).join('');
 MENU.forEach(m=>{if(typeof m[2]==='string')TITLES[m[2]]=m[1];else m[2].forEach(x=>TITLES[x[1]]=x[0])});
 document.querySelectorAll('.gh').forEach(g=>g.onclick=()=>{if(app.classList.contains('mini'))app.classList.remove('mini');g.parentElement.classList.toggle('open')});
 document.querySelectorAll('[data-h]').forEach(a=>a.onclick=()=>{show(a.dataset.h,!!a.dataset.f);app.classList.remove('open')});$('nt').hidden=!ok('reception.html')||role==='technician'}
function show(href,focus){const u=new URL(href,location.href),key=u.pathname.split('/').pop(),hash=u.hash.slice(1);let f=frames[key];
 if(!f){f=document.createElement('iframe');f.name='rd:'+key;f.className='fr';f.dataset.s=u.search;f.src=key+u.search+(focus?(u.search?'&':'?')+'focus=1':'')+(hash?'#'+hash:'');f.onload=()=>{$('ld').style.display='none';try{const d=f.contentDocument.title.replace(/^Mahdi Repair – /,'');if(!TITLES[href])$('tt').textContent=d}catch(e){}};frames[key]=f;$('fm').append(f);$('ld').style.display='grid'}
 else{if(u.search!==f.dataset.s){f.dataset.s=u.search;f.src=key+u.search+(hash?'#'+hash:'')}else if(hash){try{f.contentWindow.location.hash=hash}catch(e){}}if(key==='pos.html'){try{f.contentDocument.documentElement.classList.toggle('pos-focus',!!focus)}catch(e){}}}
 Object.values(frames).forEach(x=>x.classList.toggle('on',x===f));
 document.querySelectorAll('[data-h]').forEach(a=>{const h=a.dataset.h,hk=h.split('#')[0].split('?')[0],on=hk===key&&(!h.includes('#')||h.split('#')[1]===hash||(!hash&&false));a.classList.toggle('on',on)});
 const act=document.querySelector('.si.on,.ni.on[data-h]');if(act){const g=act.closest('.grp');if(g)g.classList.add('open')}
 $('tt').textContent=TITLES[href]||TITLES[key]||$('tt').textContent;app.classList.toggle('focus',!!focus);
 if(focus){document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{})}else if(document.fullscreenElement){document.exitFullscreen().catch(()=>{})}
 history.replaceState(null,'','#'+encodeURIComponent(href))}
start(()=>{build();$('lg').value=S.lang;let h='';try{h=decodeURIComponent(location.hash.slice(1))}catch(e){}show(h&&ok(h)?h:DEFP[role]||'dashboard.html')});
addEventListener('message',e=>{if(e.origin!==location.origin||!e.data||!e.data.rdGo)return;const h=e.data.rdGo;if(ok(h))show(h,!!e.data.focus)});
$('fx').onclick=()=>show(DEFP[role]||'dashboard.html');$('hb').onclick=()=>{if(innerWidth<=900)app.classList.toggle('open');else app.classList.toggle('mini')};$('sc').onclick=()=>app.classList.remove('open');
$('nt').onclick=()=>show('reception.html#new');$('so').onclick=()=>signOut(auth);$('lg').onchange=()=>setLang($('lg').value);
const setTh=()=>{$('th').innerHTML=svg(S.theme==='dark'?'sun':'moon')};setTh();addEventListener('storage',e=>{if(e.key==='rd_settings')setTh()});
$('th').onclick=()=>{S.theme=S.theme==='dark'?'light':'dark';save();apply();setTh()};
</script></body></html>
