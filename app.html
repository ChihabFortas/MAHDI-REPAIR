<link rel="stylesheet" href="common.css?v=24"><style>
html,body{height:100%;margin:0;overflow:hidden}.app{display:grid;grid-template-rows:auto auto 1fr auto;height:100vh;height:100dvh}
.sh-top{display:flex;align-items:center;gap:6px;padding:0 10px;min-height:46px;background:var(--card);border-bottom:1px solid var(--line);position:relative;z-index:50}

.sh-rib a:hover,.sh-rq a:hover{background:color-mix(in srgb,var(--ac) 16%,transparent)}.sh-rib a.on{background:color-mix(in srgb,var(--ac) 28%,transparent);border-color:var(--ac)}.sh-shop{margin:0 10px;flex:none;font-weight:800;font-size:19px;letter-spacing:.4px;color:var(--ac);white-space:nowrap;padding:0 16px}.sh-rq{display:flex;gap:2px}
.app.rc .sh-tabs,.app.rc .sh-ribbon{display:none}
.main{position:relative;overflow:hidden}.fr{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:transparent}.fr.on{display:block}.ld{position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);pointer-events:none}

.app.focus{grid-template-rows:0 0 1fr 0}.app.focus .sh-top,.app.focus .sh-tabs,.app.focus .sh-ribbon,.app.focus .sh-status{display:none}

#mm{display:none;position:fixed;inset:48px 0 0 0;background:var(--card);overflow:auto;z-index:80;padding:8px 12px 24px}#mm.open{display:block}.mg>b{display:flex;justify-content:space-between;padding:13px 6px;border-bottom:1px solid var(--line);cursor:pointer;color:var(--ink)}.mg .mi{display:none;padding:2px 0 6px}.mg.open .mi{display:block}.mg .mi a{display:block;padding:11px 14px;color:var(--ink);text-decoration:none;border-radius:8px}.mg .mi a:hover{background:color-mix(in srgb,var(--ac) 12%,transparent)}
@media(max-width:1500px){.sh-shop{display:none}}@media(max-width:1180px){.sh-who{display:none}}
@media(max-width:900px){.sh-menubar,.sh-tabs,.sh-ribbon,.sh-who,.sh-status{display:none!important}.sh-hb{display:inline-grid!important}.sh-brand span{font-size:15px}}
html[data-skin=pme] .sh-tabs{background:#b7d1f2}html[data-skin=pme] .sh-tabs span{color:#123}html[data-skin=pme] .sh-ribbon{background:linear-gradient(#eaf3fe,#c3d9f4);border-color:#8aa}html[data-skin=pme] .sh-top{background:#f3f3f3}html[data-skin=pme] .sh-status{background:#d6e6fa}html[data-skin=pme] .sh-rib a,html[data-skin=pme] .sh-rq a{color:#0b2a66}html[data-skin=pme] .sh-shop{color:#0a2a8a}
html[data-skin=glass] .sh-top,html[data-skin=glass] .sh-tabs,html[data-skin=glass] .sh-ribbon,html[data-skin=glass] .sh-status{background:rgba(255,255,255,.42);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}html[data-skin=glass][data-theme=dark] .sh-top,html[data-skin=glass][data-theme=dark] .sh-tabs,html[data-skin=glass][data-theme=dark] .sh-ribbon,html[data-skin=glass][data-theme=dark] .sh-status{background:rgba(24,30,48,.5)}

.sh-top{display:flex;align-items:center;gap:8px;padding:6px 10px 0;background:color-mix(in srgb,var(--ac) 9%,var(--card));border-bottom:1px solid var(--line);position:relative;z-index:50}
.sh-top .sh-tabs{flex:1;min-width:0;overflow-x:auto;padding:0;background:none;border:0;align-self:flex-end}.sh-tabs span{padding:9px 20px}

.sh-top .sh-user{padding-bottom:6px}.app.rc .sh-ribbon{display:none}.app.rc .sh-tabs{display:flex!important}
@media(max-width:900px){.sh-tabs,.sh-ribbon,.sh-who,.sh-status,#rt{display:none!important}.sh-top{padding:6px 10px}}
</style></head><body>
<div class="app" id="app">
<header class="sh-top"><button class="sh-hb" id="hb" aria-label="Menu" title="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><div class="sh-brand" title="Mahdi Repair"><div class="sh-logo">M</div><span id="sn"></span></div><div class="sh-tabs" id="tb"></div><div class="sh-user"><div class="sh-av" id="av"></div><div class="sh-who"><b id="un"></b><small id="ur"></small></div><button id="rt" title="Toolbar" aria-label="Toolbar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="m6 9 6 6 6-6"/></svg></button><button id="th" title="Theme" aria-label="Theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button><select id="lg" aria-label="Language"><option value="en">EN</option><option value="fr">FR</option><option value="ar">AR</option></select><button id="so" title="Sign out" aria-label="Sign out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 8l-4 4 4 4M6 12h10"/></svg></button></div></header>

<script type="module">
if(window.self!==window.top){window.top.location.replace(location.href)}
import {$,auth,start,role,profile,user,PAGES,SHOP} from "./common.js?v=24";
import {S,save,apply,setLang} from "./ui.js?v=24";
import {signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const IC={moon:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6 19 19M5 19l1.4-1.4M17.6 6.4 19 5"/>'};
const svg=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">${IC[n]}</svg>`;
const GROUPS=[['Workshop',[['📊','Dashboard','dashboard.html'],['🛠️','Reception desk','reception.html'],['🧾','New quote','quotes.html'],['🔧','Technician board','technician.html#my'],['📋','History','technician.html#hs'],['📈','My stats','technician.html#st'],['📦','Parts requests','partsqueue.html#rq'],['✅','Issued parts','partsqueue.html#is'],['🛎️','Parts needed','partsqueue.html#nd'],['💬','CRM dashboard','crm.html']]],
 ['Stock',[['📦','Parts catalog','inventory.html#cat'],['🖼️','Part details editor','partseditor.html'],['🎧','Accessories','pos.html#acc'],['🗂️','Storage map','locations.html'],['🔄','Movements','inventory.html#mv'],['⬆️','Import','inventory.html#im'],['🧾','Receiving notes','inventory.html#rc'],['📤','Delivery notes','inventory.html#dn'],['📋','Stock counts','stockmgmt.html#count'],['🔀','Merge products','stockmgmt.html#merge']]],
 ['Purchases',[['📝','Supplier orders','suppliers.html#po'],['🏭','Supplier list','suppliers.html#sp'],['💳','Supplier payments','suppliers.html#py'],['↩️','Supplier returns','suppliers.html#rt'],['🧾','Receiving notes','inventory.html#rc'],['📄','Purchase invoices','invoices.html#purchase'],['📄','Purchase credit notes','invoices.html#purchaseCredit']]],
 ['Sales',[['🛒','Counter sale','pos.html#pos',1],['📒','Sales journal','pos.html#sal'],['↩️','Returns','pos.html#ret'],['👥','Customers & debts','pos.html#cus'],['📄','Proforma invoices','invoices.html#proforma'],['📄','Sales invoices','invoices.html#sale'],['📄','Credit note invoices','invoices.html#saleCredit'],['📤','Delivery notes','inventory.html#dn']]],
 ['Finance',[['💸','Expenses','treasury.html#ex'],['🗑️','Losses','treasury.html#ls'],['🔐','Registers','treasury.html#rg'],['🧮','Daily closing','treasury.html#cl'],['📊','Statistics','statistics.html'],['🏅','Bonus report','techreport.html']]],
 ['System',[['⚙️','Settings','settings.html'],['👤','Users','admin.html#us'],['🏅','Repair bonuses','admin.html#bn'],['💬','Customer messages','admin.html#ms'],['🧾','Audit log','admin.html#au'],['🔑','Access rights','admin.html#ac'],['🧪','Demo data','seed.html']]]];
const DEFP={reception:'dashboard.html',manager:'dashboard.html',admin:'dashboard.html',technician:'technician.html',inventory:'partsqueue.html'},frames={},app=$('app');
const ok=h=>{const a=PAGES[h.split('#')[0].split('?')[0]];return !a||a.includes(role)},A=(l,h,f)=>`<a data-h="${h}" ${f?'data-f="1"':''}>${l}</a>`;
function build(){$('sn').textContent=SHOP.name;$('un').textContent=(profile&&profile.name)||user.email;$('ur').textContent=role[0].toUpperCase()+role.slice(1);$('av').textContent=(((profile&&profile.name)||user.email)[0]||'?').toUpperCase();$('s1').textContent='User: '+$('un').textContent;$('s2').textContent='Role: '+role;$('s3').textContent=SHOP.name;
 const R=GROUPS.map(([n,it])=>[n,it.filter(x=>ok(x[2])&&!(/invoices\.html#purchase/.test(x[2])&&role==='reception'))]).filter(x=>x[1].length);
 $('tb').innerHTML=R.map(([n])=>`<span>${n}</span>`).join('');
 $('rb').innerHTML='<div class="sh-ribs">'+R.map(([n,it])=>`<div class="sh-rib">${it.map(x=>`<a data-h="${x[2]}" ${x[3]?'data-f="1"':''}><i>${x[0]}</i>${x[1]}</a>`).join('')}</div>`).join('')+'</div>';
 $('mm').innerHTML=R.map(([n,it])=>`<div class="mg"><b>${n}<span>›</span></b><div class="mi">${it.map(x=>`<a data-h="${x[2]}" ${x[3]?'data-f="1"':''}>${x[1]}</a>`).join('')}</div></div>`).join('');
 const tabs=[...$('tb').children],pan=[...$('rb').querySelectorAll('.sh-rib')],sel=i=>{tabs.forEach((t,k)=>t.classList.toggle('on',k===i));pan.forEach((p,k)=>p.classList.toggle('on',k===i))};tabs.forEach((t,i)=>t.onclick=()=>{app.classList.remove('rc');sel(i)});sel(0);
 document.querySelectorAll('.mg>b').forEach(b=>b.onclick=()=>b.parentElement.classList.toggle('open'));
 document.querySelectorAll('[data-h]').forEach(a=>a.onclick=e=>{e.stopPropagation();$('mm').classList.remove('open');show(a.dataset.h,!!a.dataset.f)});
 app.classList.toggle('rc',localStorage.getItem('rd_rc')==='1')}
function show(href,focus){const u=new URL(href,location.href),key=u.pathname.split('/').pop(),hash=u.hash.slice(1);let f=frames[key];
 if(!f){f=document.createElement('iframe');f.name='rd:'+key;f.className='fr';f.dataset.s=u.search;const qs=new URLSearchParams(u.search);qs.set('v','24');if(focus)qs.set('focus','1');f.src=key+'?'+qs+(hash?'#'+hash:'');f.onload=()=>{$('ld').style.display='none'};frames[key]=f;$('fm').append(f);$('ld').style.display='grid'}
 else{if(u.search!==f.dataset.s){f.dataset.s=u.search;const q2=new URLSearchParams(u.search);q2.set('v','24');f.src=key+'?'+q2+(hash?'#'+hash:'')}else if(hash){try{f.contentWindow.location.hash=hash}catch(e){}}if(key==='pos.html'){try{f.contentDocument.documentElement.classList.toggle('pos-focus',!!focus)}catch(e){}}}
 Object.values(frames).forEach(x=>x.classList.toggle('on',x===f));
 document.querySelectorAll('.sh-rib a').forEach(a=>{const h=a.dataset.h,hk=h.split('#')[0].split('?')[0];a.classList.toggle('on',hk===key&&(!h.includes('#')||h.split('#')[1]===hash))});
 const tabs=[...$('tb').children],pans=[...$('rb').querySelectorAll('.sh-rib')],curp=pans.find(p=>p.classList.contains('on')),here=curp&&curp.querySelector('a.on')?curp:pans.find(p=>p.querySelector('a.on'));if(here){const i=pans.indexOf(here);tabs.forEach((t,k)=>t.classList.toggle('on',k===i));pans.forEach((p,k)=>p.classList.toggle('on',k===i))}
 app.classList.toggle('focus',!!focus);if(focus){document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{})}else if(document.fullscreenElement){document.exitFullscreen().catch(()=>{})}
 history.replaceState(null,'','#'+encodeURIComponent(href))}
start(()=>{build();$('lg').value=S.lang;let h='';try{h=decodeURIComponent(location.hash.slice(1))}catch(e){}show(h&&ok(h)?h:DEFP[role]||'dashboard.html')});
addEventListener('message',e=>{if(e.origin!==location.origin||!e.data||!e.data.rdGo)return;const h=e.data.rdGo;if(ok(h))show(h,!!e.data.focus)});
$('fx').onclick=()=>show(DEFP[role]||'dashboard.html');$('hb').onclick=()=>$('mm').classList.toggle('open');$('so').onclick=()=>signOut(auth);$('lg').onchange=()=>setLang($('lg').value);
$('rt').onclick=()=>{app.classList.toggle('rc');localStorage.setItem('rd_rc',app.classList.contains('rc')?'1':'0')};
const setTh=()=>{$('th').innerHTML=svg(S.theme==='dark'?'sun':'moon')};setTh();addEventListener('storage',e=>{if(e.key==='rd_settings')setTh()});
